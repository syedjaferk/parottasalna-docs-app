# Nginx inside docker compose. Django authorises every docs request; Nginx streams the file.

# Keep an upstream proxy's scheme (e.g. a TLS terminator in front of this container).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Throttle writes (quiz submissions, "Mark as complete") per client IP; reads are not limited.
map $request_method $write_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=writes:10m rate=5r/s;
# Live quiz joining: a whole class often shares one public IP (college Wi-Fi), so allow bursts.
limit_req_zone $write_limit_key zone=joins:10m rate=30r/s;

# WebSocket upgrade headers for the live quiz.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
limit_req_status 429;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Behind a host proxy (Caddy/Nginx on the VPS) use the real client IP, so the rate limit is
    # per student rather than one shared bucket. Only private-network proxies are trusted.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Reachable ONLY via Django's X-Accel-Redirect, never directly by a browser.
    location /protected-docs/ {
        internal;
        alias /srv/docs_build/;
    }

    # Re-resolve "web" through Docker's DNS, so recreating the app container doesn't leave
    # Nginx pointing at its old IP (which shows up as a lasting 502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://web:8000;
    set $ws http://ws:8001;

    # Live quiz WebSockets → Daphne. Long read timeout: a lobby can sit quiet for a while.
    location /ws/ {
        proxy_pass $ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Live quiz PIN and nickname forms.
    location ^~ /join {
        limit_req zone=joins burst=300 nodelay;
        proxy_pass $app;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        limit_req zone=writes burst=20 nodelay;
        proxy_pass $app;
        # $http_host keeps the port, so Google's OAuth redirect URI matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
