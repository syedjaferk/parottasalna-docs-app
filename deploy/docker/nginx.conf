# Nginx inside docker compose. Django authorises every docs request; Nginx streams the file.

# Keep an upstream proxy's scheme (e.g. a TLS terminator in front of this container).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Reachable ONLY via Django's X-Accel-Redirect, never directly by a browser.
    location /protected-docs/ {
        internal;
        alias /srv/docs_build/;
    }

    location / {
        proxy_pass http://web:8000;
        # $http_host keeps the port, so Google's OAuth redirect URI matches.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
