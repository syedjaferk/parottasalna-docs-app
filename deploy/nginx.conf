# Example server block. Django authorises every docs request; Nginx streams the file.

# Throttle writes (quiz submissions, "Mark as complete") per client IP; reads are not limited.
map $request_method $write_limit_key {
    default "";
    POST    $binary_remote_addr;
}
limit_req_zone $write_limit_key zone=writes:10m rate=5r/s;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name portal.example.com;
    # ssl_certificate / ssl_certificate_key ...

    location /static/ {
        alias /srv/portal/staticfiles/;
    }

    # Reachable ONLY via Django's X-Accel-Redirect, never directly by a browser.
    location /protected-docs/ {
        internal;
        alias /srv/portal/docs_build/;
    }

    location / {
        limit_req zone=writes burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
