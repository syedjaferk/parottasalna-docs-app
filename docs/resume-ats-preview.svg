<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1940 1060" width="1940" height="1060" font-family="Helvetica, Arial, sans-serif"><defs><marker id="h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/></marker><marker id="h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/></marker><marker id="h-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/></marker><marker id="h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e03131"/></marker><marker id="h-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6741d9"/></marker><marker id="h-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0c8599"/></marker><marker id="h-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker><marker id="h-zone" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#495057"/></marker></defs><rect width="1940" height="1060" fill="#ffffff"/><text y="18" font-size="34" fill="#1e1e1e" text-anchor="start" font-weight="700"><tspan x="20" dy="34">Resume ATS review · how it works</tspan></text><text y="66" font-size="18" fill="#495057" text-anchor="start"><tspan x="20" dy="18">Upload → reviewed by a local AI → report by email. The numbers follow one resume through the system.</tspan></text><rect x="20" y="110" width="280" height="890" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="120" font-size="18" fill="#495057" text-anchor="start"><tspan x="34" dy="18">Student</tspan></text><rect x="360" y="110" width="720" height="890" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="120" font-size="18" fill="#495057" text-anchor="start"><tspan x="374" dy="18">learn.parottasalna.com · Docker on the server</tspan></text><rect x="1140" y="110" width="320" height="250" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="120" font-size="18" fill="#495057" text-anchor="start"><tspan x="1154" dy="18">Google Drive · shared drive</tspan></text><rect x="1140" y="670" width="320" height="180" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="680" font-size="18" fill="#495057" text-anchor="start"><tspan x="1154" dy="18">Email delivery</tspan></text><rect x="1520" y="110" width="400" height="890" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="120" font-size="18" fill="#495057" text-anchor="start"><tspan x="1534" dy="18">GPU machine · ats-worker (no open ports)</tspan></text><rect x="50" y="200" width="220" height="100" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text y="230.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" dy="16">Student&#x27;s browser</tspan><tspan x="160.0" dy="20.0">signed in with Google</tspan></text><rect x="50" y="860" width="220" height="90" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text y="895.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="160.0" dy="16">Student&#x27;s inbox</tspan></text><rect x="400" y="200" width="280" height="110" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text y="225.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" dy="16">Upload page /resume-review/</tspan><tspan x="540.0" dy="20.0">PDF up to 5 MB</tspan><tspan x="540.0" dy="20.0">+ consent tick box</tspan></text><rect x="400" y="350" width="280" height="80" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text y="370.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" dy="16">Status page</tspan><tspan x="540.0" dy="20.0">look up by tracking ID</tspan></text><rect x="750" y="200" width="290" height="110" rx="12" fill="#e5dbff" stroke="#6741d9" stroke-width="2"/><text y="225.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="895.0" dy="16">Postgres · ResumeReview</tspan><tspan x="895.0" dy="20.0">queued → processing →</tspan><tspan x="895.0" dy="20.0">done · held · failed</tspan></text><rect x="750" y="360" width="290" height="100" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text y="380.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="895.0" dy="16">Worker API</tspan><tspan x="895.0" dy="20.0">/api/ats/claim · complete · fail</tspan><tspan x="895.0" dy="20.0">Bearer ATS_WORKER_TOKEN</tspan></text><rect x="750" y="510" width="290" height="110" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text y="535.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="895.0" dy="16">Guardrails · results.py</tspan><tspan x="895.0" dy="20.0">fixed schema, scores clamped,</tspan><tspan x="895.0" dy="20.0">links stripped, odd → held</tspan></text><rect x="400" y="510" width="280" height="100" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text y="530.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" dy="16">Admin panel</tspan><tspan x="540.0" dy="20.0">a person checks held reviews</tspan><tspan x="540.0" dy="20.0">and clicks Release</tspan></text><rect x="400" y="690" width="280" height="100" rx="12" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text y="710.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" dy="16">Cron</tspan><tspan x="540.0" dy="20.0">send_resume_emails · every 10 min</tspan><tspan x="540.0" dy="20.0">purge_resumes · daily</tspan></text><rect x="730" y="670" width="330" height="180" rx="16" fill="none" stroke="#495057" stroke-width="1.5" stroke-dasharray="8 6"/><text y="680" font-size="18" fill="#495057" text-anchor="start"><tspan x="744" dy="18">Mailer · separate compose</tspan></text><rect x="750" y="715" width="290" height="110" rx="12" fill="#c5f6fa" stroke="#0c8599" stroke-width="2"/><text y="740.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="895.0" dy="16">listmonk</tspan><tspan x="895.0" dy="20.0">pass-through template</tspan><tspan x="895.0" dy="20.0">portal may only send (tx:send)</tspan></text><rect x="1170" y="200" width="260" height="120" rx="12" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/><text y="230.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1300.0" dy="16">Resume reviews/</tspan><tspan x="1300.0" dy="20.0">ATS-7K3Q-9XMP.pdf</tspan><tspan x="1300.0" dy="20.0">no name, no email</tspan></text><rect x="1170" y="720" width="260" height="90" rx="12" fill="#c5f6fa" stroke="#0c8599" stroke-width="2"/><text y="745.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1300.0" dy="16">SMTP relay</tspan><tspan x="1300.0" dy="20.0">Workspace / SES / Brevo</tspan></text><rect x="1550" y="200" width="340" height="70" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text y="215.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">1 · claim the next job</tspan><tspan x="1720.0" dy="20.0">polls the portal every 30 s</tspan></text><path d="M1720,270 L1720,298" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="300" width="340" height="70" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text y="315.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">2 · download the PDF</tspan><tspan x="1720.0" dy="20.0">from Drive (read-only)</tspan></text><path d="M1720,370 L1720,398" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="400" width="340" height="90" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text y="415.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">3 · read only the visible text</tspan><tspan x="1720.0" dy="20.0">white / tiny / invisible /</tspan><tspan x="1720.0" dy="20.0">off-page text removed</tspan></text><path d="M1720,490 L1720,518" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="520" width="340" height="70" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text y="535.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">4 · remove text aimed at the AI</tspan><tspan x="1720.0" dy="20.0">&quot;ignore previous instructions…&quot;</tspan></text><path d="M1720,590 L1720,618" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="620" width="340" height="90" rx="12" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text y="635.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">5 · local LLM (Ollama / vLLM)</tspan><tspan x="1720.0" dy="20.0">fixed JSON schema</tspan><tspan x="1720.0" dy="20.0">temperature 0</tspan></text><path d="M1720,710 L1720,738" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="740" width="340" height="70" rx="12" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/><text y="755.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">6 · compare with a rule-based score</tspan><tspan x="1720.0" dy="20.0">verdict set from the score</tspan></text><path d="M1720,810 L1720,838" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><rect x="1550" y="840" width="340" height="70" rx="12" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/><text y="855.0" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="1720.0" dy="16">7 · post the review</tspan><tspan x="1720.0" dy="20.0">(or a fixed failure reason)</tspan></text><path d="M270,240 L398,240" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#h-blue)"/><text y="220" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="334" dy="14">① upload</tspan></text><path d="M400,280 L272,280" fill="none" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h-blue)"/><text y="288" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="312" dy="14">tracking ID</tspan></text><path d="M160,300 L160,390 L398,390" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h-gray)"/><text y="370" font-size="14" fill="#495057" text-anchor="middle"><tspan x="280" dy="14">check status</tspan></text><path d="M540,200 L540,165 L1300,165 L1300,198" fill="none" stroke="#1971c2" stroke-width="2" marker-end="url(#h-blue)"/><text y="142" font-size="14" fill="#1971c2" text-anchor="middle"><tspan x="920" dy="14">② PDF straight to Drive (kept in memory, never on disk)</tspan></text><path d="M680,255 L748,255" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#h-violet)"/><text y="233" font-size="13" fill="#6741d9" text-anchor="middle"><tspan x="714" dy="13">③ queued</tspan></text><path d="M1550,235 L1490,235 L1490,390 L1042,390" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><text y="368" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="1265" dy="14">④ claim: tracking ID + Drive file ID (never the email)</tspan></text><path d="M1430,300 L1460,300 L1460,335 L1548,335" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><text y="330" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="1300" dy="14">⑤ download PDF →</tspan></text><path d="M1550,875 L1510,875 L1510,420 L1042,420" fill="none" stroke="#2f9e44" stroke-width="2" marker-end="url(#h-green)"/><text y="428" font-size="14" fill="#2f9e44" text-anchor="middle"><tspan x="1265" dy="14">⑥ review JSON + flags</tspan></text><path d="M820,460 L820,508" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#h-red)"/><path d="M1040,565 L1065,565 L1065,255 L1042,255" fill="none" stroke="#6741d9" stroke-width="2" marker-end="url(#h-violet)"/><text y="476" font-size="14" fill="#6741d9" text-anchor="middle"><tspan x="965" dy="14">⑦ done / held</tspan></text><path d="M750,560 L682,560" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#h-red)"/><text y="538" font-size="14" fill="#e03131" text-anchor="middle"><tspan x="716" dy="14">held</tspan></text><path d="M680,590 L712,590 L712,740 L748,740" fill="none" stroke="#f08c00" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h-amber)"/><text y="618" font-size="13" fill="#f08c00" text-anchor="middle"><tspan x="612" dy="13">release → email</tspan></text><path d="M1010,620 L1010,713" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#h-teal)"/><text y="636" font-size="14" fill="#0c8599" text-anchor="middle"><tspan x="922" dy="14">⑧ done → send report</tspan></text><path d="M680,770 L748,770" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h-gray)"/><text y="778" font-size="13" fill="#495057" text-anchor="middle"><tspan x="714" dy="13">retry</tspan></text><path d="M1040,770 L1168,770" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#h-teal)"/><text y="748" font-size="14" fill="#0c8599" text-anchor="middle"><tspan x="1104" dy="14">⑨ send</tspan></text><path d="M1300,810 L1300,965 L160,965 L160,952" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#h-teal)"/><text y="943" font-size="14" fill="#0c8599" text-anchor="middle"><tspan x="700" dy="14">⑩ report email: scores, top fixes, link to the full report</tspan></text><path d="M540,790 L540,875 L1100,875 L1100,300 L1168,300" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#h-red)"/><text y="880" font-size="14" fill="#e03131" text-anchor="middle"><tspan x="800" dy="14">delete the PDF 7 days after the email</tspan></text><text y="1020" font-size="16" fill="#495057" text-anchor="start"><tspan x="20" dy="16">Blue: upload path  ·  Green: worker  ·  Red: guardrails and deletion  ·  Amber: a person decides  ·  Teal: email  ·  Dashed: happens later</tspan></text></svg>