title: System Design
description: Learn how to design systems the way interviewers and real teams expect, one idea at a time. Nineteen chapters with diagrams and worked numbers cover the interview framework, estimation, APIs and data, IDs, caching, scaling, networking, databases, queues and ten full case studies (URL shortener, autocomplete, load balancer, CDN, parking garage, vending machine, key-value store, distributed cache, authentication and UPI). Then build each design, step by step, in the System Design playground.
common: true
