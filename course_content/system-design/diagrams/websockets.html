<svg class="dg" viewBox="0 0 800 330" role="img" aria-labelledby="websockets-t websockets-d" xmlns="http://www.w3.org/2000/svg">
<title id="websockets-t">HTTP polling vs a WebSocket</title>

<text x="200" y="20" text-anchor="middle" dominant-baseline="middle" class="title">HTTP polling</text>
<text x="610" y="20" text-anchor="middle" dominant-baseline="middle" class="title">WebSocket</text>

<path d="M100,140 L300,152" class="arrow" marker-end="url(#websockets-h)"/>
<text x="200" y="132" text-anchor="middle" dominant-baseline="middle" class="small">any news?</text>
<path d="M300,172 L100,184" class="arrow red" marker-end="url(#websockets-h-red)"/>
<text x="200" y="200" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<path d="M100,220 L300,232" class="arrow" marker-end="url(#websockets-h)"/>

<path d="M300,252 L100,264" class="arrow red" marker-end="url(#websockets-h-red)"/>

<line x1="510" y1="36" x2="510" y2="310" class="line"/>

<path d="M710,92 L510,104" class="arrow green" marker-end="url(#websockets-h-green)"/>
