<figure class="diagram">
<svg class="dg" viewBox="0 0 800 330" role="img" aria-labelledby="dns-lookup-t dns-lookup-d" xmlns="http://www.w3.org/2000/svg">
<title id="dns-lookup-t">How a DNS lookup works</title>
<desc id="dns-lookup-d">The resolver walks root, TLD and authoritative servers and caches the answer for its TTL.</desc>
<defs><marker id="dns-lookup-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="dns-lookup-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="dns-lookup-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="dns-lookup-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="130" width="110" height="60" rx="10" class="blue"/>
<text x="75.0" y="150.0" text-anchor="middle" dominant-baseline="middle">Browser</text>
<text x="75.0" y="170.0" text-anchor="middle" dominant-baseline="middle">+ OS cache</text>
<rect x="200" y="130" width="130" height="60" rx="10" class="purple"/>
<text x="265.0" y="150.0" text-anchor="middle" dominant-baseline="middle">Recursive</text>
<text x="265.0" y="170.0" text-anchor="middle" dominant-baseline="middle">resolver</text>
<rect x="430" y="20" width="150" height="50" rx="10" class="amber"/>
<text x="505.0" y="35.0" text-anchor="middle" dominant-baseline="middle">Root server</text>
<text x="505.0" y="55.0" text-anchor="middle" dominant-baseline="middle">who has .com?</text>
<rect x="430" y="130" width="170" height="50" rx="10" class="amber"/>
<text x="515.0" y="145.0" text-anchor="middle" dominant-baseline="middle">TLD server (.com)</text>
<text x="515.0" y="165.0" text-anchor="middle" dominant-baseline="middle">who has example.com?</text>
<rect x="430" y="240" width="170" height="50" rx="10" class="green"/>
<text x="515.0" y="255.0" text-anchor="middle" dominant-baseline="middle">Authoritative</text>
<text x="515.0" y="275.0" text-anchor="middle" dominant-baseline="middle">A record: 203.0.113.7</text>
<path d="M130,150 L200,150" class="arrow" marker-end="url(#dns-lookup-h)"/>
<text x="165" y="132" text-anchor="middle" dominant-baseline="middle" class="small">1 asks</text>
<path d="M200,178 L130,178" class="arrow green" marker-end="url(#dns-lookup-h-green)"/>
<text x="165" y="200" text-anchor="middle" dominant-baseline="middle" class="small">6 answer</text>
<path d="M330,145 L430,50" class="arrow" marker-end="url(#dns-lookup-h)"/>
<text x="375" y="88" text-anchor="middle" dominant-baseline="middle" class="small">2</text>
<path d="M330,160 L430,155" class="arrow" marker-end="url(#dns-lookup-h)"/>
<text x="380" y="140" text-anchor="middle" dominant-baseline="middle" class="small">3</text>
<path d="M330,175 L430,265" class="arrow" marker-end="url(#dns-lookup-h)"/>
<text x="375" y="232" text-anchor="middle" dominant-baseline="middle" class="small">4</text>
<rect x="650" y="130" width="130" height="60" rx="10" class="box"/>
<text x="715.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Answer cached</text>
<text x="715.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">for the TTL</text>
<path d="M600,265 L700,190" class="arrow green dashed" marker-end="url(#dns-lookup-h-green)"/>
<text x="665" y="232" text-anchor="middle" dominant-baseline="middle" class="small">5</text>
</svg>
<figcaption>The resolver walks root, TLD and authoritative servers and caches the answer for its TTL.</figcaption>
</figure>
