<figure class="diagram">
<svg class="dg" viewBox="0 0 800 290" role="img" aria-labelledby="vending-machine-t vending-machine-d" xmlns="http://www.w3.org/2000/svg">
<title id="vending-machine-t">Vending machine state machine</title>
<desc id="vending-machine-d">Each arrow is an event. Anything not drawn, such as selecting with no money, is rejected in that state.</desc>
<defs><marker id="vending-machine-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="vending-machine-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="vending-machine-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="vending-machine-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="110" width="130" height="60" rx="10" class="blue"/>
<text x="85.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Idle</text>
<text x="85.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">no money</text>
<rect x="230" y="110" width="150" height="60" rx="10" class="amber"/>
<text x="305.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">HasMoney</text>
<text x="305.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">balance &gt; 0</text>
<rect x="460" y="110" width="150" height="60" rx="10" class="green"/>
<text x="535.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Dispensing</text>
<text x="535.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">motor running</text>
<rect x="660" y="110" width="120" height="60" rx="10" class="blue"/>
<text x="720.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Idle</text>
<text x="720.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">change returned</text>
<path d="M150,140 L230,140" class="arrow" marker-end="url(#vending-machine-h)"/>
<text x="190" y="122" text-anchor="middle" dominant-baseline="middle" class="small">insert coin</text>
<path d="M380,140 L460,140" class="arrow" marker-end="url(#vending-machine-h)"/>
<text x="420" y="122" text-anchor="middle" dominant-baseline="middle" class="small">select (valid)</text>
<path d="M610,140 L660,140" class="arrow" marker-end="url(#vending-machine-h)"/>
<text x="635" y="122" text-anchor="middle" dominant-baseline="middle" class="small">done</text>
<path d="M305,110 L305,60 L85,60 L85,110" class="arrow" marker-end="url(#vending-machine-h)"/>
<text x="195" y="45" text-anchor="middle" dominant-baseline="middle" class="small">cancel: refund</text>
<path d="M305,170 L305,230" class="arrow red dashed" marker-end="url(#vending-machine-h-red)"/>
<rect x="180" y="230" width="250" height="40" rx="10" class="red"/>
<text x="305.0" y="250.0" text-anchor="middle" dominant-baseline="middle" class="small">sold out / no change: reject, stay in HasMoney</text>
<rect x="470" y="220" width="300" height="55" rx="10" class="red"/>
<text x="620.0" y="237.5" text-anchor="middle" dominant-baseline="middle" class="bold">OutOfService</text>
<text x="620.0" y="257.5" text-anchor="middle" dominant-baseline="middle" class="small">jam, power loss: refund and flag</text>
<path d="M535,170 L535,220" class="arrow red dashed" marker-end="url(#vending-machine-h-red)"/>
</svg>
<figcaption>Each arrow is an event. Anything not drawn, such as selecting with no money, is rejected in that state.</figcaption>
</figure>
