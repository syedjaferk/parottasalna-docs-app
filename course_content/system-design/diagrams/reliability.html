<figure class="diagram">
<svg class="dg" viewBox="0 0 760 250" role="img" aria-labelledby="reliability-t reliability-d" xmlns="http://www.w3.org/2000/svg">
<title id="reliability-t">Available is not the same as reliable</title>
<desc id="reliability-d">A system can be up but wrong. Reliability means correct results, durable data and recovery from faults.</desc>
<defs><marker id="reliability-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="reliability-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="reliability-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="reliability-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="40" y="40" width="320" height="80" rx="10" class="amber"/>
<text x="200.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">Available but unreliable</text>
<text x="200.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">answers, but loses writes or returns wrong data</text>
<rect x="400" y="40" width="320" height="80" rx="10" class="blue"/>
<text x="560.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">Reliable but unavailable</text>
<text x="560.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">always correct, but down for maintenance</text>
<rect x="220" y="150" width="320" height="70" rx="10" class="green"/>
<text x="380.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">Both: the goal</text>
<text x="380.0" y="195.0" text-anchor="middle" dominant-baseline="middle" class="small">up, correct, durable, self-healing</text>
<path d="M200,120 L330,150" class="arrow" marker-end="url(#reliability-h)"/>
<path d="M560,120 L430,150" class="arrow" marker-end="url(#reliability-h)"/>
</svg>
<figcaption>A system can be up but wrong. Reliability means correct results, durable data and recovery from faults.</figcaption>
</figure>
