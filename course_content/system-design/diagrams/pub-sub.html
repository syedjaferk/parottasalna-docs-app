<title id="pub-sub-t">Publish/subscribe</title>

<defs><marker id="pub-sub-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="pub-sub-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="pub-sub-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="pub-sub-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="120" width="120" height="60" rx="10" class="blue"/>
<text x="70.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">Order service</text>
<text x="70.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="small">publisher</text>
<rect x="230" y="120" width="130" height="60" rx="10" class="purple"/>

<text x="295.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="code">order.placed</text>
<path d="M130,150 L230,150" class="arrow blue" marker-end="url(#pub-sub-h-blue)"/>

<rect x="560" y="20" width="200" height="44" rx="10" class="green"/>
<text x="660.0" y="42.0" text-anchor="middle" dominant-baseline="middle">Billing</text>
<path d="M360,150 L560,42" class="arrow" marker-end="url(#pub-sub-h)"/>
<rect x="560" y="100" width="200" height="44" rx="10" class="green"/>
<text x="660.0" y="122.0" text-anchor="middle" dominant-baseline="middle">Inventory</text>
<path d="M360,150 L560,122" class="arrow" marker-end="url(#pub-sub-h)"/>
<rect x="560" y="180" width="200" height="44" rx="10" class="green"/>

<rect x="560" y="250" width="200" height="44" rx="10" class="green"/>
<text x="660.0" y="272.0" text-anchor="middle" dominant-baseline="middle">Analytics</text>
<path d="M360,150 L560,272" class="arrow" marker-end="url(#pub-sub-h)"/>
<text x="400" y="315" text-anchor="middle" dominant-baseline="middle" class="small">adding a subscriber needs no change to the publisher</text>
</svg>
