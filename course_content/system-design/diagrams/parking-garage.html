<figure class="diagram">
<svg class="dg" viewBox="0 0 800 260" role="img" aria-labelledby="pg-t pg-d" xmlns="http://www.w3.org/2000/svg">
<title id="pg-t">Parking garage classes</title>
<desc id="pg-d">A ParkingLot has floors. Each floor has spots of different sizes. A Ticket links a Vehicle to a Spot. A PricingPolicy computes the fee.</desc>
<defs><marker id="pg-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="20" y="20" width="140" height="50" rx="10" class="green"/>
<text x="90.0" y="41.0" text-anchor="middle" class="code">ParkingLot</text>
<text x="90.0" y="57.0" text-anchor="middle" class="code">entry / exit</text>
<rect x="230" y="20" width="130" height="50" rx="10" class="green"/>
<text x="295.0" y="49.0" text-anchor="middle" class="code">Floor</text>
<rect x="430" y="20" width="130" height="50" rx="10" class="amber"/>
<text x="495.0" y="41.0" text-anchor="middle" class="code">Spot</text>
<text x="495.0" y="57.0" text-anchor="middle" class="code">(size, free?)</text>
<rect x="630" y="20" width="140" height="50" rx="10" class="blue"/>
<text x="700.0" y="41.0" text-anchor="middle" class="code">Vehicle</text>
<text x="700.0" y="57.0" text-anchor="middle" class="code">(Car, Bike, Truck)</text>
<rect x="20" y="150" width="140" height="50" rx="10" class="red"/>
<text x="90.0" y="171.0" text-anchor="middle" class="code">Ticket</text>
<text x="90.0" y="187.0" text-anchor="middle" class="code">in, spot, vehicle</text>
<rect x="230" y="150" width="160" height="50" rx="10" class="red"/>
<text x="310.0" y="171.0" text-anchor="middle" class="code">PricingPolicy</text>
<text x="310.0" y="187.0" text-anchor="middle" class="code">(Hourly, Flat)</text>
<rect x="450" y="150" width="140" height="50" rx="10" class="red"/>
<text x="520.0" y="179.0" text-anchor="middle" class="code">Payment</text>
<path d="M160,45 L230,45" class="arrow" marker-end="url(#pg-h)"/>
<text x="195.0" y="39.0" text-anchor="middle" class="small">has</text>
<path d="M360,45 L430,45" class="arrow" marker-end="url(#pg-h)"/>
<text x="395.0" y="39.0" text-anchor="middle" class="small">many</text>
<path d="M630,45 L560,45" class="arrow" marker-end="url(#pg-h)"/>
<text x="595.0" y="39.0" text-anchor="middle" class="small">fits</text>
<path d="M90,70 L90,150" class="arrow" marker-end="url(#pg-h)"/>
<text x="120" y="112" text-anchor="middle" class="small">issues</text>
<path d="M160,175 L230,175" class="arrow" marker-end="url(#pg-h)"/>
<text x="195.0" y="169.0" text-anchor="middle" class="small">fee</text>
<path d="M390,175 L450,175" class="arrow" marker-end="url(#pg-h)"/>
</svg>
<figcaption>Objects own their own rules: a Spot knows what fits, a PricingPolicy knows the price.</figcaption>
</figure>
