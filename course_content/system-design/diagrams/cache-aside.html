<figure class="diagram">
<svg class="dg" viewBox="0 0 760 230" role="img" aria-labelledby="ca-t ca-d" xmlns="http://www.w3.org/2000/svg">
<title id="ca-t">Cache-aside read path</title>
<desc id="ca-d">The app asks the cache first. On a hit it answers. On a miss it reads the database, stores the result in the cache and answers.</desc>
<defs><marker id="ca-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="20" y="85" width="110" height="50" rx="10" class="blue"/><text x="75" y="110" text-anchor="middle" class="code">Client</text>
<rect x="250" y="85" width="130" height="50" rx="10" class="green"/><text x="315" y="110" text-anchor="middle" class="code">App server</text>
<rect x="520" y="20" width="130" height="50" rx="10" class="amber"/><text x="585" y="45" text-anchor="middle" class="code">Cache</text>
<rect x="520" y="150" width="130" height="50" rx="10" class="red"/><text x="585" y="175" text-anchor="middle" class="code">Database</text>
<path d="M130,110 L250,110" class="arrow" marker-end="url(#ca-h)"/><text x="190" y="100" text-anchor="middle" class="small">GET /aZ3k9Qp</text>
<path d="M380,100 L520,52" class="arrow" marker-end="url(#ca-h)"/><text x="425" y="62" text-anchor="middle" class="small">1 look up</text>
<path d="M380,122 L520,168" class="arrow" marker-end="url(#ca-h)"/><text x="425" y="168" text-anchor="middle" class="small">2 on miss</text>
<text x="585" y="95" text-anchor="middle" class="small">3 store the result,</text><text x="585" y="112" text-anchor="middle" class="small">then answer 302</text>
<text x="380" y="222" text-anchor="middle" class="small">Hit: answer from memory. Miss: read the database once, remember it for next time.</text>
</svg>
<figcaption>Cache-aside: the application owns the logic, the cache is just fast storage.</figcaption>
</figure>
