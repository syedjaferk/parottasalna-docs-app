<figure class="diagram">
<svg class="dg" viewBox="0 0 800 300" role="img" aria-labelledby="gossip-t gossip-d" xmlns="http://www.w3.org/2000/svg">
<title id="gossip-t">Gossip spreads like a rumour</title>
<desc id="gossip-d">Each round every informed node tells a few random peers, so the informed count roughly doubles.</desc>
<defs><marker id="gossip-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="gossip-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="gossip-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="gossip-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="160" y="25" text-anchor="middle" dominant-baseline="middle" class="bold">Round 0: 1 knows</text>
<circle cx="125" cy="70" r="16" class="circle-b"/>
<circle cx="170" cy="70" r="16" class="ghost"/>
<circle cx="215" cy="70" r="16" class="ghost"/>
<circle cx="125" cy="125" r="16" class="ghost"/>
<circle cx="170" cy="125" r="16" class="ghost"/>
<circle cx="215" cy="125" r="16" class="ghost"/>
<circle cx="125" cy="180" r="16" class="ghost"/>
<circle cx="170" cy="180" r="16" class="ghost"/>
<circle cx="215" cy="180" r="16" class="ghost"/>
<text x="400" y="25" text-anchor="middle" dominant-baseline="middle" class="bold">Round 1: 3 know</text>
<circle cx="365" cy="70" r="16" class="circle-b"/>
<circle cx="410" cy="70" r="16" class="circle-b"/>
<circle cx="455" cy="70" r="16" class="circle-b"/>
<circle cx="365" cy="125" r="16" class="ghost"/>
<circle cx="410" cy="125" r="16" class="ghost"/>
<circle cx="455" cy="125" r="16" class="ghost"/>
<circle cx="365" cy="180" r="16" class="ghost"/>
<circle cx="410" cy="180" r="16" class="ghost"/>
<circle cx="455" cy="180" r="16" class="ghost"/>
<text x="640" y="25" text-anchor="middle" dominant-baseline="middle" class="bold">Round 2: 9 know</text>
<circle cx="605" cy="70" r="16" class="circle-b"/>
<circle cx="650" cy="70" r="16" class="circle-b"/>
<circle cx="695" cy="70" r="16" class="circle-b"/>
<circle cx="605" cy="125" r="16" class="circle-b"/>
<circle cx="650" cy="125" r="16" class="circle-b"/>
<circle cx="695" cy="125" r="16" class="circle-b"/>
<circle cx="605" cy="180" r="16" class="circle-b"/>
<circle cx="650" cy="180" r="16" class="circle-b"/>
<circle cx="695" cy="180" r="16" class="circle-b"/>
<path d="M260,130 L320,130" class="arrow" marker-end="url(#gossip-h)"/>
<path d="M500,130 L560,130" class="arrow" marker-end="url(#gossip-h)"/>
<text x="400" y="260" text-anchor="middle" dominant-baseline="middle" class="small">10,000 nodes need only about log2(10,000) = 14 rounds. No central coordinator.</text>
</svg>
<figcaption>Each round every informed node tells a few random peers, so the informed count roughly doubles.</figcaption>
</figure>
