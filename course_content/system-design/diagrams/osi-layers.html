<figure class="diagram">
<svg class="dg" viewBox="0 0 780 330" role="img" aria-labelledby="osi-layers-t osi-layers-d" xmlns="http://www.w3.org/2000/svg">
<title id="osi-layers-t">The seven OSI layers</title>
<desc id="osi-layers-d">Each layer wraps the data from the layer above with its own header on the way down, and unwraps it on the way up.</desc>
<defs><marker id="osi-layers-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="osi-layers-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="osi-layers-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="osi-layers-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="40" y="20" width="250" height="36" rx="10" class="blue"/>
<text x="165.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="bold">7  Application</text>
<text x="310" y="38" text-anchor="start" dominant-baseline="middle" class="small">HTTP, DNS, SMTP</text>
<rect x="40" y="62" width="250" height="36" rx="10" class="blue"/>
<text x="165.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">6  Presentation</text>
<text x="310" y="80" text-anchor="start" dominant-baseline="middle" class="small">TLS, JSON, gzip</text>
<rect x="40" y="104" width="250" height="36" rx="10" class="blue"/>
<text x="165.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="bold">5  Session</text>
<text x="310" y="122" text-anchor="start" dominant-baseline="middle" class="small">sessions, RPC</text>
<rect x="40" y="146" width="250" height="36" rx="10" class="green"/>
<text x="165.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="bold">4  Transport</text>
<text x="310" y="164" text-anchor="start" dominant-baseline="middle" class="small">TCP, UDP: ports</text>
<rect x="40" y="188" width="250" height="36" rx="10" class="amber"/>
<text x="165.0" y="206.0" text-anchor="middle" dominant-baseline="middle" class="bold">3  Network</text>
<text x="310" y="206" text-anchor="start" dominant-baseline="middle" class="small">IP: addresses, routing</text>
<rect x="40" y="230" width="250" height="36" rx="10" class="red"/>
<text x="165.0" y="248.0" text-anchor="middle" dominant-baseline="middle" class="bold">2  Data link</text>
<text x="310" y="248" text-anchor="start" dominant-baseline="middle" class="small">Ethernet, Wi-Fi: MAC</text>
<rect x="40" y="272" width="250" height="36" rx="10" class="red"/>
<text x="165.0" y="290.0" text-anchor="middle" dominant-baseline="middle" class="bold">1  Physical</text>
<text x="310" y="290" text-anchor="start" dominant-baseline="middle" class="small">cable, fibre, radio</text>
<rect x="560" y="20" width="190" height="36" rx="10" class="box"/>
<text x="655.0" y="38.0" text-anchor="middle" dominant-baseline="middle">Your program</text>
<rect x="560" y="188" width="190" height="36" rx="10" class="green"/>
<text x="655.0" y="206.0" text-anchor="middle" dominant-baseline="middle">TCP header + data</text>
<rect x="560" y="230" width="190" height="36" rx="10" class="amber"/>
<text x="655.0" y="248.0" text-anchor="middle" dominant-baseline="middle">IP header + TCP + data</text>
<rect x="560" y="272" width="190" height="36" rx="10" class="red"/>
<text x="655.0" y="290.0" text-anchor="middle" dominant-baseline="middle">Ethernet frame (all of it)</text>
<path d="M655,56 L655,146" class="arrow" marker-end="url(#osi-layers-h)"/>
<text x="690" y="100" text-anchor="middle" dominant-baseline="middle" class="small">wrap</text>
</svg>
<figcaption>Each layer wraps the data from the layer above with its own header on the way down, and unwraps it on the way up.</figcaption>
</figure>
