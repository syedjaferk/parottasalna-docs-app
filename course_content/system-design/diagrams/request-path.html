<figure class="diagram">
<svg class="dg" viewBox="0 0 800 270" role="img" aria-labelledby="request-path-t request-path-d" xmlns="http://www.w3.org/2000/svg">
<title id="request-path-t">The path of a request</title>
<desc id="request-path-d">Each hop can answer early: browser cache, DNS cache, CDN, application cache. Otherwise the request travels on.</desc>
<defs><marker id="request-path-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="request-path-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="request-path-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="request-path-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="100" width="130" height="60" rx="10" class="blue"/>
<text x="75.0" y="130.0" text-anchor="middle" dominant-baseline="middle">Browser</text>
<rect x="170" y="100" width="130" height="60" rx="10" class="amber"/>
<text x="235.0" y="130.0" text-anchor="middle" dominant-baseline="middle">DNS</text>
<path d="M140,130.0 L170,130.0" class="arrow" marker-end="url(#request-path-h)"/>
<rect x="330" y="100" width="130" height="60" rx="10" class="amber"/>
<text x="395.0" y="130.0" text-anchor="middle" dominant-baseline="middle">CDN</text>
<path d="M300,130.0 L330,130.0" class="arrow" marker-end="url(#request-path-h)"/>
<rect x="490" y="100" width="130" height="60" rx="10" class="purple"/>
<text x="555.0" y="130.0" text-anchor="middle" dominant-baseline="middle">Load balancer</text>
<path d="M460,130.0 L490,130.0" class="arrow" marker-end="url(#request-path-h)"/>
<rect x="650" y="100" width="130" height="60" rx="10" class="green"/>
<text x="715.0" y="130.0" text-anchor="middle" dominant-baseline="middle">App servers</text>
<path d="M620,130.0 L650,130.0" class="arrow" marker-end="url(#request-path-h)"/>
<rect x="520" y="200" width="110" height="44" rx="10" class="amber"/>
<text x="575.0" y="222.0" text-anchor="middle" dominant-baseline="middle">Cache</text>
<rect x="660" y="200" width="120" height="44" rx="10" class="red"/>
<text x="720.0" y="222.0" text-anchor="middle" dominant-baseline="middle">Database</text>
<path d="M720,160 L590,200" class="arrow" marker-end="url(#request-path-h)"/>
<path d="M720,160 L720,200" class="arrow" marker-end="url(#request-path-h)"/>
</svg>
<figcaption>Each hop can answer early: browser cache, DNS cache, CDN, application cache. Otherwise the request travels on.</figcaption>
</figure>
