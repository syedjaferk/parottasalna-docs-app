<figure class="diagram">

<rect x="10" y="110" width="90" height="50" rx="10" class="blue"/>

<rect x="160" y="190" width="150" height="50" rx="10" class="purple"/>
<text x="235.0" y="215.0" text-anchor="middle" dominant-baseline="middle">LB (standby)</text>

<text x="290" y="135" text-anchor="middle" dominant-baseline="middle" class="small">heartbeat</text>
<rect x="470" y="20" width="170" height="50" rx="10" class="green"/>
<text x="555.0" y="45.0" text-anchor="middle" dominant-baseline="middle">Server 1</text>
<path d="M310,55 L470,45" class="arrow" marker-end="url(#load-balancer-h)"/>
