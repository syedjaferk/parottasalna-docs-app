<figure class="diagram">
<svg class="dg" viewBox="0 0 800 250" role="img" aria-labelledby="lb-t lb-d" xmlns="http://www.w3.org/2000/svg">
<title id="lb-t">Inside a load balancer</title>
<desc id="lb-d">Clients connect to a pair of load balancers. A health checker removes unhealthy servers from the pool and the balancing algorithm picks a server for each request.</desc>
<defs><marker id="lb-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="100" width="90" height="50" rx="10" class="blue"/>
<text x="55.0" y="129.0" text-anchor="middle" class="code">Clients</text>
<rect x="150" y="40" width="150" height="44" rx="10" class="amber"/>
<text x="225.0" y="66.0" text-anchor="middle" class="code">LB (active)</text>
<rect x="150" y="150" width="150" height="44" rx="10" class="amber"/>
<text x="225.0" y="176.0" text-anchor="middle" class="code">LB (standby)</text>
<path d="M100,118 L150,66" class="arrow" marker-end="url(#lb-h)"/>
<path d="M100,134 L150,170" class="arrow" marker-end="url(#lb-h)"/>
<path d="M225,84 L225,150" class="arrow" stroke-dasharray="5 4" marker-end="url(#lb-h)"/>
<text x="270" y="122" text-anchor="middle" class="small">heartbeat</text>
<rect x="420" y="20" width="120" height="44" rx="10" class="green"/>
<text x="480.0" y="46.0" text-anchor="middle" class="code">Server 1</text>
<rect x="420" y="90" width="120" height="44" rx="10" class="green"/>
<text x="480.0" y="116.0" text-anchor="middle" class="code">Server 2</text>
<rect x="420" y="160" width="120" height="44" rx="10" class="red"/>
<text x="480.0" y="186.0" text-anchor="middle" class="code">Server 3 (down)</text>
<path d="M300,55 L420,42" class="arrow" marker-end="url(#lb-h)"/>
<path d="M300,68 L420,110" class="arrow" marker-end="url(#lb-h)"/>
<path d="M300,80 L420,178" class="arrow" stroke-dasharray="5 4" marker-end="url(#lb-h)"/>
<rect x="610" y="90" width="150" height="44" rx="10" class="blue"/>
<text x="685.0" y="116.0" text-anchor="middle" class="code">Health checker</text>
<path d="M610,112 L540,112" class="arrow" marker-end="url(#lb-h)"/>
<text x="575" y="100" text-anchor="middle" class="small">ping /health</text>
</svg>
<figcaption>A load balancer is a server that picks another server. It must itself not be a single point of failure.</figcaption>
</figure>
