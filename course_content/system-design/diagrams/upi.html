<figure class="diagram">
<svg class="dg" viewBox="0 0 820 270" role="img" aria-labelledby="upi-t upi-d" xmlns="http://www.w3.org/2000/svg">
<title id="upi-t">UPI payment flow</title>
<desc id="upi-d">The payer&#x27;s app sends a request through the payment switch, which asks the payer&#x27;s bank to debit and the payee&#x27;s bank to credit, then reports the result to both apps.</desc>
<defs><marker id="upi-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="100" width="100" height="50" rx="10" class="blue"/>
<text x="60.0" y="129.0" text-anchor="middle" class="code">Payer app</text>
<rect x="170" y="100" width="120" height="50" rx="10" class="green"/>
<text x="230.0" y="129.0" text-anchor="middle" class="code">PSP bank</text>
<rect x="350" y="100" width="120" height="50" rx="10" class="amber"/>
<text x="410.0" y="129.0" text-anchor="middle" class="code">UPI switch</text>
<rect x="540" y="20" width="130" height="44" rx="10" class="red"/>
<text x="605.0" y="38.0" text-anchor="middle" class="code">Payer bank</text>
<text x="605.0" y="54.0" text-anchor="middle" class="code">(debit)</text>
<rect x="540" y="190" width="130" height="44" rx="10" class="red"/>
<text x="605.0" y="208.0" text-anchor="middle" class="code">Payee bank</text>
<text x="605.0" y="224.0" text-anchor="middle" class="code">(credit)</text>
<rect x="710" y="100" width="100" height="50" rx="10" class="blue"/>
<text x="760.0" y="129.0" text-anchor="middle" class="code">Payee app</text>
<path d="M110,125 L170,125" class="arrow" marker-end="url(#upi-h)"/>
<text x="140.0" y="119.0" text-anchor="middle" class="small">1 pay</text>
<path d="M290,125 L350,125" class="arrow" marker-end="url(#upi-h)"/>
<path d="M470,110 L540,50" class="arrow" marker-end="url(#upi-h)"/>
<text x="520" y="70" text-anchor="middle" class="small">2 debit</text>
<path d="M470,140 L540,205" class="arrow" marker-end="url(#upi-h)"/>
<text x="510" y="185" text-anchor="middle" class="small">3 credit</text>
<path d="M670,212 L740,150" class="arrow" marker-end="url(#upi-h)"/>
<text x="725" y="190" text-anchor="middle" class="small">4 notify</text>
</svg>
<figcaption>The switch routes and records. The money moves between banks. Every step has a unique transaction id so retries are safe.</figcaption>
</figure>
