<figure class="diagram">
<svg class="dg" viewBox="0 0 780 330" role="img" aria-labelledby="tls-handshake-t tls-handshake-d" xmlns="http://www.w3.org/2000/svg">
<title id="tls-handshake-t">TLS 1.3 handshake</title>
<desc id="tls-handshake-d">One round trip agrees on a secret key without ever sending it. After that everything is encrypted.</desc>
<defs><marker id="tls-handshake-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="tls-handshake-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="tls-handshake-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="tls-handshake-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="130" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Browser</text>
<text x="650" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Server</text>
<line x1="130" y1="36" x2="130" y2="300" class="line"/>
<line x1="650" y1="36" x2="650" y2="300" class="line"/>
<path d="M130,70 L650,90" class="arrow blue" marker-end="url(#tls-handshake-h-blue)"/>
<text x="390" y="68" text-anchor="middle" dominant-baseline="middle" class="small">ClientHello: versions, ciphers, key share</text>
<path d="M650,120 L130,140" class="arrow green" marker-end="url(#tls-handshake-h-green)"/>
<text x="390" y="118" text-anchor="middle" dominant-baseline="middle" class="small">ServerHello + certificate + key share</text>
<rect x="150" y="160" width="380" height="40" rx="10" class="amber"/>
<text x="340.0" y="180.0" text-anchor="middle" dominant-baseline="middle">Browser verifies certificate chain, name, expiry</text>
<rect x="290" y="215" width="400" height="40" rx="10" class="purple"/>
<text x="490.0" y="235.0" text-anchor="middle" dominant-baseline="middle">Both derive the same session key (never sent)</text>
<path d="M130,285 L650,285" class="arrow blue" marker-end="url(#tls-handshake-h-blue)"/>
<text x="390" y="270" text-anchor="middle" dominant-baseline="middle" class="small">Encrypted HTTP requests and responses</text>
</svg>
<figcaption>One round trip agrees on a secret key without ever sending it. After that everything is encrypted.</figcaption>
</figure>
