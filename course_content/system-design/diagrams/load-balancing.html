<figure class="diagram">
<svg class="dg" viewBox="0 0 780 300" role="img" aria-labelledby="load-balancing-t load-balancing-d" xmlns="http://www.w3.org/2000/svg">
<title id="load-balancing-t">A load balancer in front of three servers</title>
<desc id="load-balancing-d">The balancer chooses a server per request and stops using any server that fails its health check.</desc>
<defs><marker id="load-balancing-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="load-balancing-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="load-balancing-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="load-balancing-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="110" width="90" height="50" rx="10" class="blue"/>
<text x="55.0" y="135.0" text-anchor="middle" dominant-baseline="middle">Clients</text>
<rect x="170" y="100" width="150" height="70" rx="10" class="purple"/>
<text x="245.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="bold">Load balancer</text>
<text x="245.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">algorithm + health</text>
<rect x="470" y="30" width="200" height="50" rx="10" class="green"/>
<text x="570.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Server 1  (3 conns)</text>
<path d="M320,135 L470,55" class="arrow" marker-end="url(#load-balancing-h)"/>
<rect x="470" y="115" width="200" height="50" rx="10" class="green"/>
<text x="570.0" y="140.0" text-anchor="middle" dominant-baseline="middle">Server 2  (1 conn)</text>
<path d="M320,135 L470,140" class="arrow" marker-end="url(#load-balancing-h)"/>
<rect x="470" y="200" width="200" height="50" rx="10" class="red"/>
<text x="570.0" y="225.0" text-anchor="middle" dominant-baseline="middle">Server 3  (down)</text>
<path d="M320,135 L470,225" class="arrow red dashed" marker-end="url(#load-balancing-h-red)"/>
<path d="M100,135 L170,135" class="arrow" marker-end="url(#load-balancing-h)"/>
<text x="570" y="270" text-anchor="middle" dominant-baseline="middle" class="small">least connections sends the next request to Server 2</text>
</svg>
<figcaption>The balancer chooses a server per request and stops using any server that fails its health check.</figcaption>
</figure>
