<figure class="diagram">
<svg class="dg" viewBox="0 0 800 330" role="img" aria-labelledby="authentication-t authentication-d" xmlns="http://www.w3.org/2000/svg">
<title id="authentication-t">Authentication: login once, verify everywhere</title>
<desc id="authentication-d">The auth service verifies the password and issues short-lived tokens. The gateway verifies tokens locally on every request.</desc>
<defs><marker id="authentication-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="authentication-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="authentication-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="authentication-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="130" width="100" height="60" rx="10" class="blue"/>
<text x="60.0" y="150.0" text-anchor="middle" dominant-baseline="middle">User</text>
<text x="60.0" y="170.0" text-anchor="middle" dominant-baseline="middle">browser / app</text>
<rect x="180" y="20" width="150" height="50" rx="10" class="amber"/>
<text x="255.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="bold">Rate limiter</text>
<rect x="180" y="130" width="150" height="60" rx="10" class="green"/>
<text x="255.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Auth service</text>
<text x="255.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">verify hash + MFA</text>
<path d="M110,150 L180,150" class="arrow" marker-end="url(#authentication-h)"/>
<text x="145" y="132" text-anchor="middle" dominant-baseline="middle" class="small">1 login</text>
<path d="M255,70 L255,130" class="arrow dashed" marker-end="url(#authentication-h)"/>
<rect x="400" y="40" width="170" height="60" rx="10" class="red"/>
<text x="485.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="bold">User DB</text>
<text x="485.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="small">salted slow hashes</text>
<rect x="400" y="130" width="170" height="60" rx="10" class="red"/>
<text x="485.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Token store</text>
<text x="485.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">refresh tokens, sessions</text>
<rect x="400" y="220" width="170" height="50" rx="10" class="box"/>
<text x="485.0" y="245.0" text-anchor="middle" dominant-baseline="middle" class="bold">Audit log</text>
<path d="M330,140 L400,75" class="arrow" marker-end="url(#authentication-h)"/>
<path d="M330,160 L400,160" class="arrow" marker-end="url(#authentication-h)"/>
<path d="M330,175 L400,245" class="arrow dashed" marker-end="url(#authentication-h)"/>
<rect x="620" y="130" width="170" height="60" rx="10" class="purple"/>
<text x="705.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">API gateway</text>
<text x="705.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">verifies token locally</text>
<rect x="620" y="230" width="170" height="50" rx="10" class="green"/>
<text x="705.0" y="255.0" text-anchor="middle" dominant-baseline="middle" class="bold">Services</text>
<path d="M110,175 L180,300 L620,300 L700,280" class="arrow blue dashed" marker-end="url(#authentication-h-blue)"/>
<text x="400" y="312" text-anchor="middle" dominant-baseline="middle" class="small">2 every API call carries the access token</text>
<path d="M705,190 L705,230" class="arrow" marker-end="url(#authentication-h)"/>
</svg>
<figcaption>The auth service verifies the password and issues short-lived tokens. The gateway verifies tokens locally on every request.</figcaption>
</figure>
