<figure class="diagram">
<svg class="dg" viewBox="0 0 800 270" role="img" aria-labelledby="replication-t replication-d" xmlns="http://www.w3.org/2000/svg">
<title id="replication-t">Primary and replicas</title>
<desc id="replication-d">Writes go to the primary. It ships changes to replicas, which serve reads and stand ready for failover.</desc>
<defs><marker id="replication-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="replication-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="replication-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="replication-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="100" width="110" height="60" rx="10" class="blue"/>
<text x="65.0" y="130.0" text-anchor="middle" dominant-baseline="middle">App servers</text>
<rect x="250" y="30" width="170" height="60" rx="10" class="red"/>
<text x="335.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="bold">Primary</text>
<text x="335.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="small">accepts writes</text>
<rect x="250" y="170" width="170" height="60" rx="10" class="amber"/>
<text x="335.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="bold">Replica A</text>
<text x="335.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">serves reads</text>
<rect x="540" y="170" width="170" height="60" rx="10" class="amber"/>
<text x="625.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="bold">Replica B</text>
<text x="625.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">other region</text>
<path d="M120,115 L250,60" class="arrow red" marker-end="url(#replication-h-red)"/>
<text x="170" y="72" text-anchor="middle" dominant-baseline="middle" class="small">writes</text>
<path d="M120,150 L250,195" class="arrow" marker-end="url(#replication-h)"/>
<text x="170" y="190" text-anchor="middle" dominant-baseline="middle" class="small">reads</text>
<path d="M335,90 L335,170" class="arrow dashed" marker-end="url(#replication-h)"/>
<text x="392" y="130" text-anchor="middle" dominant-baseline="middle" class="small">change log</text>
<path d="M420,70 L600,170" class="arrow dashed" marker-end="url(#replication-h)"/>
<text x="560" y="100" text-anchor="middle" dominant-baseline="middle" class="small">async: replicas lag slightly</text>
</svg>
<figcaption>Writes go to the primary. It ships changes to replicas, which serve reads and stand ready for failover.</figcaption>
</figure>
