<figure class="diagram">
<svg class="dg" viewBox="0 0 760 240" role="img" aria-labelledby="rep-t rep-d" xmlns="http://www.w3.org/2000/svg">
<title id="rep-t">Primary and replicas</title>
<desc id="rep-d">Writes go to the primary database. The primary copies changes to two replicas. Reads can be served by any replica.</desc>
<defs><marker id="rep-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="20" y="95" width="110" height="50" rx="10" class="green"/>
<text x="75.0" y="124.0" text-anchor="middle" class="code">App servers</text>
<rect x="300" y="20" width="140" height="50" rx="10" class="red"/>
<text x="370.0" y="41.0" text-anchor="middle" class="code">Primary</text>
<text x="370.0" y="57.0" text-anchor="middle" class="code">(accepts writes)</text>
<rect x="300" y="160" width="140" height="50" rx="10" class="amber"/>
<text x="370.0" y="189.0" text-anchor="middle" class="code">Replica A</text>
<rect x="540" y="160" width="140" height="50" rx="10" class="amber"/>
<text x="610.0" y="189.0" text-anchor="middle" class="code">Replica B</text>
<path d="M130,108 L300,48" class="arrow" marker-end="url(#rep-h)"/>
<text x="205" y="64" text-anchor="middle" class="small">writes</text>
<path d="M130,132 L300,182" class="arrow" marker-end="url(#rep-h)"/>
<text x="205" y="172" text-anchor="middle" class="small">reads</text>
<path d="M370,70 L370,160" class="arrow" marker-end="url(#rep-h)"/>
<text x="420" y="118" text-anchor="middle" class="small">copy changes</text>
<path d="M440,60 L600,160" class="arrow" marker-end="url(#rep-h)"/>
<text x="610" y="100" text-anchor="middle" class="small">copy changes</text>
</svg>
<figcaption>Replication copies data for safety and read capacity. Copies lag a little: that lag is eventual consistency.</figcaption>
</figure>
