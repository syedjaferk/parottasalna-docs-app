<figure class="diagram">
<svg class="dg" viewBox="0 0 800 330" role="img" aria-labelledby="database-architectures-t database-architectures-d" xmlns="http://www.w3.org/2000/svg">
<title id="database-architectures-t">Common database deployments</title>
<desc id="database-architectures-d">From one node to active-active regions: more availability and lower latency cost more complexity.</desc>
<defs><marker id="database-architectures-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="database-architectures-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="database-architectures-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="database-architectures-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="30" width="240" height="90" rx="10" class="blue"/>
<text x="130.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Primary + replicas</text>
<text x="130.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">one region, writes to one node</text>
<rect x="280" y="30" width="240" height="90" rx="10" class="green"/>
<text x="400.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Multi-AZ standby</text>
<text x="400.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">sync copy in another zone</text>
<rect x="550" y="30" width="240" height="90" rx="10" class="amber"/>
<text x="670.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Cross-region replica</text>
<text x="670.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">async copy for DR + reads</text>
<rect x="10" y="150" width="380" height="120" rx="10" class="purple"/>
<text x="200.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="bold">Active-active, multi-region</text>
<text x="200.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">Mumbai, Frankfurt and Virginia all accept writes</text>
<text x="200.0" y="230.0" text-anchor="middle" dominant-baseline="middle" class="small">conflicts avoided by home region per record</text>
<rect x="420" y="150" width="370" height="120" rx="10" class="red"/>
<text x="605.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="bold">Disaster-recovery strategies</text>
<text x="605.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">backup/restore: hours</text>
<text x="605.0" y="220.0" text-anchor="middle" dominant-baseline="middle" class="small">pilot light: tens of minutes</text>
<text x="605.0" y="240.0" text-anchor="middle" dominant-baseline="middle" class="small">warm standby: minutes</text>
</svg>
<figcaption>From one node to active-active regions: more availability and lower latency cost more complexity.</figcaption>
</figure>
