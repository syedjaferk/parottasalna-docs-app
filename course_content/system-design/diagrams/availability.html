<figure class="diagram">
<svg class="dg" viewBox="0 0 760 250" role="img" aria-labelledby="availability-t availability-d" xmlns="http://www.w3.org/2000/svg">
<title id="availability-t">Availability over a year</title>
<desc id="availability-d">Availability is the share of time the system works. Each extra nine allows ten times less downtime.</desc>
<defs><marker id="availability-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="availability-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="availability-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="availability-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="380" y="24" text-anchor="middle" dominant-baseline="middle" class="title">Downtime allowed per year</text>
<text x="70" y="64" text-anchor="end" dominant-baseline="middle" class="bold">99%</text>
<rect x="90" y="50" width="540.0" height="28" rx="5" class="bar amber"/>
<text x="640.0" y="64" text-anchor="start" dominant-baseline="middle" class="small">3.65 days</text>
<text x="70" y="108" text-anchor="end" dominant-baseline="middle" class="bold">99.9%</text>
<rect x="90" y="94" width="216.0" height="28" rx="5" class="bar"/>
<text x="316.0" y="108" text-anchor="start" dominant-baseline="middle" class="small">8.8 hours</text>
<text x="70" y="152" text-anchor="end" dominant-baseline="middle" class="bold">99.99%</text>
<rect x="90" y="138" width="54.0" height="28" rx="5" class="bar green"/>
<text x="154.0" y="152" text-anchor="start" dominant-baseline="middle" class="small">53 minutes</text>
<text x="70" y="196" text-anchor="end" dominant-baseline="middle" class="bold">99.999%</text>
<rect x="90" y="182" width="7.2" height="28" rx="5" class="bar green"/>
<text x="107.2" y="196" text-anchor="start" dominant-baseline="middle" class="small">5 minutes</text>
<text x="380" y="232" text-anchor="middle" dominant-baseline="middle" class="small">Each added nine is roughly 10x harder and more expensive.</text>
</svg>
<figcaption>Availability is the share of time the system works. Each extra nine allows ten times less downtime.</figcaption>
</figure>
