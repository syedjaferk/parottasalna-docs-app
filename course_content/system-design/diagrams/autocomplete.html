<figure class="diagram">
<svg class="dg" viewBox="0 0 800 250" role="img" aria-labelledby="ac-t ac-d" xmlns="http://www.w3.org/2000/svg">
<title id="ac-t">Autocomplete with a trie</title>
<desc id="ac-d">As the user types, the request goes to a suggestion service that walks a trie to the typed prefix and returns the top suggestions. A separate pipeline rebuilds the trie from query logs.</desc>
<defs><marker id="ac-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="30" width="100" height="46" rx="10" class="blue"/>
<text x="60.0" y="57.0" text-anchor="middle" class="code">Browser</text>
<rect x="160" y="30" width="120" height="46" rx="10" class="green"/>
<text x="220.0" y="49.0" text-anchor="middle" class="code">Suggestion</text>
<text x="220.0" y="65.0" text-anchor="middle" class="code">service</text>
<rect x="340" y="30" width="140" height="46" rx="10" class="amber"/>
<text x="410.0" y="57.0" text-anchor="middle" class="code">Prefix cache</text>
<rect x="540" y="30" width="140" height="46" rx="10" class="red"/>
<text x="610.0" y="57.0" text-anchor="middle" class="code">Trie (top-k)</text>
<path d="M110,53 L160,53" class="arrow" marker-end="url(#ac-h)"/>
<text x="135.0" y="47.0" text-anchor="middle" class="small">&#x27;ho&#x27;</text>
<path d="M280,53 L340,53" class="arrow" marker-end="url(#ac-h)"/>
<path d="M480,53 L540,53" class="arrow" marker-end="url(#ac-h)"/>
<text x="510.0" y="47.0" text-anchor="middle" class="small">miss</text>
<rect x="10" y="160" width="120" height="46" rx="10" class="blue"/>
<text x="70.0" y="187.0" text-anchor="middle" class="code">Search logs</text>
<rect x="180" y="160" width="130" height="46" rx="10" class="green"/>
<text x="245.0" y="179.0" text-anchor="middle" class="code">Aggregator</text>
<text x="245.0" y="195.0" text-anchor="middle" class="code">(count, weekly)</text>
<rect x="370" y="160" width="130" height="46" rx="10" class="green"/>
<text x="435.0" y="187.0" text-anchor="middle" class="code">Trie builder</text>
<path d="M130,183 L180,183" class="arrow" marker-end="url(#ac-h)"/>
<path d="M310,183 L370,183" class="arrow" marker-end="url(#ac-h)"/>
<path d="M500,175 L590,76" class="arrow" marker-end="url(#ac-h)"/>
<text x="600" y="130" text-anchor="middle" class="small">publish new trie</text>
</svg>
<figcaption>Serving path (top) is read-only and fast. The data pipeline (bottom) rebuilds the trie offline.</figcaption>
</figure>
