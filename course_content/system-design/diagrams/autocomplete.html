<figure class="diagram">
<svg class="dg" viewBox="0 0 800 300" role="img" aria-labelledby="autocomplete-t autocomplete-d" xmlns="http://www.w3.org/2000/svg">
<title id="autocomplete-t">Autocomplete: serving path and data pipeline</title>
<desc id="autocomplete-d">The serving path (top) is read-only and fast. The pipeline (bottom) rebuilds the trie offline and swaps it in.</desc>
<defs><marker id="autocomplete-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="autocomplete-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="autocomplete-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="autocomplete-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="400" y="18" text-anchor="middle" dominant-baseline="middle" class="title">Serving path</text>
<rect x="10" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="60.0" y="65.0" text-anchor="middle" dominant-baseline="middle">Browser</text>
<rect x="160" y="40" width="140" height="50" rx="10" class="purple"/>
<text x="230.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">CDN</text>
<text x="230.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="small">hot prefixes</text>
<rect x="350" y="40" width="150" height="50" rx="10" class="green"/>
<text x="425.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">Suggestion</text>
<text x="425.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="small">service</text>
<rect x="550" y="20" width="110" height="40" rx="10" class="amber"/>
<text x="605.0" y="40.0" text-anchor="middle" dominant-baseline="middle">Prefix cache</text>
<rect x="550" y="75" width="110" height="40" rx="10" class="red"/>
<text x="605.0" y="95.0" text-anchor="middle" dominant-baseline="middle">Trie in memory</text>
<rect x="690" y="45" width="100" height="60" rx="10" class="box"/>
<text x="740.0" y="65.0" text-anchor="middle" dominant-baseline="middle">top-k per</text>
<text x="740.0" y="85.0" text-anchor="middle" dominant-baseline="middle">node</text>
<path d="M110,65 L160,65" class="arrow" marker-end="url(#autocomplete-h)"/>
<text x="135" y="48" text-anchor="middle" dominant-baseline="middle" class="small">&#x27;ho&#x27;</text>
<path d="M300,65 L350,65" class="arrow" marker-end="url(#autocomplete-h)"/>
<path d="M500,55 L550,40" class="arrow" marker-end="url(#autocomplete-h)"/>
<path d="M500,80 L550,95" class="arrow dashed" marker-end="url(#autocomplete-h)"/>
<path d="M660,95 L690,85" class="arrow"/>
<text x="400" y="150" text-anchor="middle" dominant-baseline="middle" class="title">Data pipeline (offline)</text>
<rect x="10" y="175" width="120" height="50" rx="10" class="blue"/>
<text x="70.0" y="190.0" text-anchor="middle" dominant-baseline="middle">Search logs</text>
<text x="70.0" y="210.0" text-anchor="middle" dominant-baseline="middle">(stream)</text>
<rect x="180" y="175" width="140" height="50" rx="10" class="green"/>
<text x="250.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="bold">Aggregator</text>
<text x="250.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">counts + decay</text>
<rect x="370" y="175" width="140" height="50" rx="10" class="green"/>
<text x="440.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="bold">Trie builder</text>
<text x="440.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">validate</text>
<rect x="560" y="175" width="120" height="50" rx="10" class="amber"/>
<text x="620.0" y="190.0" text-anchor="middle" dominant-baseline="middle">Snapshot</text>
<text x="620.0" y="210.0" text-anchor="middle" dominant-baseline="middle">(object store)</text>
<path d="M130,200 L180,200" class="arrow" marker-end="url(#autocomplete-h)"/>
<path d="M320,200 L370,200" class="arrow" marker-end="url(#autocomplete-h)"/>
<path d="M510,200 L560,200" class="arrow" marker-end="url(#autocomplete-h)"/>
<path d="M620,175 L605,115" class="arrow dashed" marker-end="url(#autocomplete-h)"/>
<text x="700" y="150" text-anchor="middle" dominant-baseline="middle" class="small">load + atomic swap</text>
<text x="400" y="270" text-anchor="middle" dominant-baseline="middle" class="small">Never update the live trie in place: build a new one, validate it, then swap.</text>
</svg>
<figcaption>The serving path (top) is read-only and fast. The pipeline (bottom) rebuilds the trie offline and swaps it in.</figcaption>
</figure>
