<figure class="diagram">
<svg class="dg" viewBox="0 0 780 250" role="img" aria-labelledby="ip-addresses-t ip-addresses-d" xmlns="http://www.w3.org/2000/svg">
<title id="ip-addresses-t">Anatomy of an IPv4 address</title>
<desc id="ip-addresses-d">In 10.0.1.77/24 the first 24 bits name the network and the last 8 bits name the host.</desc>
<defs><marker id="ip-addresses-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ip-addresses-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="ip-addresses-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="ip-addresses-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="60" y="60" width="100" height="50" rx="10" class="blue"/>
<text x="110.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">10</text>
<text x="170" y="85" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="180" y="60" width="100" height="50" rx="10" class="blue"/>
<text x="230.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">0</text>
<text x="290" y="85" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="300" y="60" width="100" height="50" rx="10" class="blue"/>
<text x="350.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">1</text>
<text x="410" y="85" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="420" y="60" width="100" height="50" rx="10" class="green"/>
<text x="470.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">77</text>
<text x="30" y="85" text-anchor="middle" dominant-baseline="middle" class="small">IP</text>
<rect x="60" y="128" width="340" height="8" rx="4" class="bar"/>
<rect x="420" y="128" width="100" height="8" rx="4" class="bar green"/>
<text x="230" y="152" text-anchor="middle" dominant-baseline="middle" class="small">network: first 24 bits (/24)</text>
<text x="470" y="152" text-anchor="middle" dominant-baseline="middle" class="small">host: 8 bits</text>
<rect x="560" y="50" width="190" height="80" rx="10" class="box"/>
<text x="655.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">/24 = 256 addresses</text>
<text x="655.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">/16 = 65,536</text>
<text x="655.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">/28 = 16</text>
<rect x="60" y="185" width="320" height="45" rx="10" class="amber"/>
<text x="220.0" y="207.5" text-anchor="middle" dominant-baseline="middle">Private: 10.x, 172.16-31.x, 192.168.x</text>
<rect x="400" y="185" width="350" height="45" rx="10" class="purple"/>
<text x="575.0" y="207.5" text-anchor="middle" dominant-baseline="middle">Router: longest matching prefix wins</text>
</svg>
<figcaption>In 10.0.1.77/24 the first 24 bits name the network and the last 8 bits name the host.</figcaption>
</figure>
