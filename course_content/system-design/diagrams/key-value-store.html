<figure class="diagram">
<svg class="dg" viewBox="0 0 800 260" role="img" aria-labelledby="kv-t kv-d" xmlns="http://www.w3.org/2000/svg">
<title id="kv-t">Distributed key-value store</title>
<desc id="kv-d">A client contacts any node, which acts as coordinator. Keys are placed on a hash ring and each key is copied to three nodes. Writes succeed once a quorum acknowledges.</desc>
<defs><marker id="kv-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="100" width="90" height="50" rx="10" class="blue"/>
<text x="55.0" y="129.0" text-anchor="middle" class="code">Client</text>
<rect x="170" y="100" width="130" height="50" rx="10" class="green"/>
<text x="235.0" y="121.0" text-anchor="middle" class="code">Coordinator</text>
<text x="235.0" y="137.0" text-anchor="middle" class="code">node</text>
<rect x="400" y="20" width="120" height="44" rx="10" class="red"/>
<text x="460.0" y="46.0" text-anchor="middle" class="code">Node A (copy 1)</text>
<rect x="400" y="100" width="120" height="50" rx="10" class="red"/>
<text x="460.0" y="129.0" text-anchor="middle" class="code">Node B (copy 2)</text>
<rect x="400" y="190" width="120" height="44" rx="10" class="red"/>
<text x="460.0" y="216.0" text-anchor="middle" class="code">Node C (copy 3)</text>
<path d="M100,125 L170,125" class="arrow" marker-end="url(#kv-h)"/>
<text x="135.0" y="119.0" text-anchor="middle" class="small">put(k,v)</text>
<path d="M300,110 L400,45" class="arrow" marker-end="url(#kv-h)"/>
<path d="M300,125 L400,125" class="arrow" marker-end="url(#kv-h)"/>
<path d="M300,140 L400,210" class="arrow" marker-end="url(#kv-h)"/>
<rect x="600" y="100" width="170" height="50" rx="10" class="amber"/>
<text x="685.0" y="121.0" text-anchor="middle" class="code">Hinted handoff</text>
<text x="685.0" y="137.0" text-anchor="middle" class="code">+ read repair</text>
<path d="M520,125 L600,125" class="arrow" stroke-dasharray="5 4" marker-end="url(#kv-h)"/>
<text x="560" y="112" text-anchor="middle" class="small">if a node is down</text>
</svg>
<figcaption>Replication factor N=3, write quorum W=2, read quorum R=2: R + W &gt; N, so reads see the latest write.</figcaption>
</figure>
