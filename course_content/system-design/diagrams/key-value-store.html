<figure class="diagram">
<svg class="dg" viewBox="0 0 800 320" role="img" aria-labelledby="key-value-store-t key-value-store-d" xmlns="http://www.w3.org/2000/svg">
<title id="key-value-store-t">Distributed key-value store</title>
<desc id="key-value-store-d">A coordinator sends each write to the 3 replicas on the ring and waits for a quorum. Down nodes are covered by hints and repair.</desc>
<defs><marker id="key-value-store-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="key-value-store-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="key-value-store-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="key-value-store-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="130" width="90" height="50" rx="10" class="blue"/>
<text x="55.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Client</text>
<rect x="150" y="120" width="140" height="70" rx="10" class="green"/>
<text x="220.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="bold">Coordinator</text>
<text x="220.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">any node</text>
<path d="M100,155 L150,155" class="arrow" marker-end="url(#key-value-store-h)"/>
<text x="125" y="138" text-anchor="middle" dominant-baseline="middle" class="small">put(k, v)</text>
<rect x="380" y="20" width="180" height="50" rx="10" class="red"/>
<text x="470.0" y="35.0" text-anchor="middle" dominant-baseline="middle" class="bold">Replica 1</text>
<text x="470.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="small">ack</text>
<rect x="380" y="130" width="180" height="50" rx="10" class="red"/>
<text x="470.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="bold">Replica 2</text>
<text x="470.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">ack</text>
<rect x="380" y="240" width="180" height="50" rx="10" class="box"/>
<text x="470.0" y="255.0" text-anchor="middle" dominant-baseline="middle" class="bold">Replica 3</text>
<text x="470.0" y="275.0" text-anchor="middle" dominant-baseline="middle" class="small">down: hint stored</text>
<path d="M290,135 L380,45" class="arrow" marker-end="url(#key-value-store-h)"/>
<path d="M290,155 L380,155" class="arrow" marker-end="url(#key-value-store-h)"/>
<path d="M290,175 L380,265" class="arrow dashed" marker-end="url(#key-value-store-h)"/>
<rect x="620" y="20" width="170" height="60" rx="10" class="purple"/>
<text x="705.0" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">Hash ring</text>
<text x="705.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">virtual nodes</text>
<rect x="620" y="110" width="170" height="80" rx="10" class="amber"/>
<text x="705.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Repair</text>
<text x="705.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">hinted handoff</text>
<text x="705.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">read repair, Merkle</text>
<rect x="620" y="220" width="170" height="70" rx="10" class="amber"/>
<text x="705.0" y="245.0" text-anchor="middle" dominant-baseline="middle" class="bold">Membership</text>
<text x="705.0" y="265.0" text-anchor="middle" dominant-baseline="middle" class="small">gossip + heartbeats</text>
<text x="200" y="230" text-anchor="middle" dominant-baseline="middle" class="bold">N=3, W=2, R=2: R + W &gt; N</text>
<text x="200" y="255" text-anchor="middle" dominant-baseline="middle" class="small">so reads overlap the latest write</text>
</svg>
<figcaption>A coordinator sends each write to the 3 replicas on the ring and waits for a quorum. Down nodes are covered by hints and repair.</figcaption>
</figure>
