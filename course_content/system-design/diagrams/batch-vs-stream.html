<figure class="diagram">
<svg class="dg" viewBox="0 0 800 300" role="img" aria-labelledby="batch-vs-stream-t batch-vs-stream-d" xmlns="http://www.w3.org/2000/svg">
<title id="batch-vs-stream-t">Batch vs stream</title>
<desc id="batch-vs-stream-d">Batch collects data and processes it on a schedule. Stream processes each event as it arrives.</desc>
<defs><marker id="batch-vs-stream-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="batch-vs-stream-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="batch-vs-stream-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="batch-vs-stream-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="200" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Batch</text>
<text x="610" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Stream</text>
<rect x="10" y="100" width="100" height="60" rx="10" class="blue"/>
<text x="60.0" y="120.0" text-anchor="middle" dominant-baseline="middle">Data piles</text>
<text x="60.0" y="140.0" text-anchor="middle" dominant-baseline="middle">up all day</text>
<path d="M110,130 L170,130" class="arrow" marker-end="url(#batch-vs-stream-h)"/>
<rect x="170" y="90" width="90" height="80" rx="10" class="purple"/>
<text x="215.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">Job at</text>
<text x="215.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">2 am</text>
<path d="M260,130 L310,130" class="arrow" marker-end="url(#batch-vs-stream-h)"/>
<rect x="310" y="100" width="90" height="60" rx="10" class="green"/>
<text x="355.0" y="120.0" text-anchor="middle" dominant-baseline="middle">Report</text>
<text x="355.0" y="140.0" text-anchor="middle" dominant-baseline="middle">next morning</text>
<circle cx="450" cy="80" r="10" class="circle-a"/>
<circle cx="450" cy="130" r="10" class="circle-a"/>
<circle cx="450" cy="180" r="10" class="circle-a"/>
<path d="M470,130 L540,130" class="arrow" marker-end="url(#batch-vs-stream-h)"/>
<rect x="540" y="90" width="110" height="80" rx="10" class="purple"/>
<text x="595.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="bold">Stream</text>
<text x="595.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">processor</text>
<path d="M650,130 L690,130" class="arrow" marker-end="url(#batch-vs-stream-h)"/>
<rect x="690" y="100" width="90" height="60" rx="10" class="green"/>
<text x="735.0" y="120.0" text-anchor="middle" dominant-baseline="middle">Live</text>
<text x="735.0" y="140.0" text-anchor="middle" dominant-baseline="middle">result</text>
<text x="200" y="220" text-anchor="middle" dominant-baseline="middle" class="small">high throughput, hours of latency</text>
<text x="610" y="220" text-anchor="middle" dominant-baseline="middle" class="small">seconds of latency, harder to build</text>
</svg>
<figcaption>Batch collects data and processes it on a schedule. Stream processes each event as it arrives.</figcaption>
