<figure class="diagram">
<svg class="dg" viewBox="0 0 800 320" role="img" aria-labelledby="consensus-t consensus-d" xmlns="http://www.w3.org/2000/svg">
<title id="consensus-t">Majority agreement (Raft)</title>
<desc id="consensus-d">The leader replicates a command. With 3 of 5 nodes holding it, it is committed and survives any minority failure.</desc>
<defs><marker id="consensus-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="consensus-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="consensus-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="consensus-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="120" width="100" height="50" rx="10" class="blue"/>
<text x="60.0" y="145.0" text-anchor="middle" dominant-baseline="middle">Client</text>
<rect x="170" y="110" width="130" height="70" rx="10" class="purple"/>
<text x="235.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="bold">Leader</text>
<text x="235.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="small">term 3</text>
<path d="M110,145 L170,145" class="arrow" marker-end="url(#consensus-h)"/>
<text x="140" y="128" text-anchor="middle" dominant-baseline="middle" class="small">set x=5</text>
<rect x="470" y="10" width="140" height="38" rx="10" class="green"/>
<text x="540.0" y="29.0" text-anchor="middle" dominant-baseline="middle">F1  ack</text>
<path d="M300,145 L470,29" class="arrow" marker-end="url(#consensus-h)"/>
<rect x="470" y="70" width="140" height="38" rx="10" class="green"/>
<text x="540.0" y="89.0" text-anchor="middle" dominant-baseline="middle">F2  ack</text>
<path d="M300,145 L470,89" class="arrow" marker-end="url(#consensus-h)"/>
<rect x="470" y="190" width="140" height="38" rx="10" class="amber"/>
<text x="540.0" y="209.0" text-anchor="middle" dominant-baseline="middle">F3  slow</text>
<path d="M300,145 L470,209" class="arrow dashed" marker-end="url(#consensus-h)"/>
<rect x="470" y="250" width="140" height="38" rx="10" class="red"/>
<text x="540.0" y="269.0" text-anchor="middle" dominant-baseline="middle">F4  down</text>
<path d="M300,145 L470,269" class="arrow dashed" marker-end="url(#consensus-h)"/>
<rect x="650" y="110" width="140" height="70" rx="10" class="green"/>
<text x="720.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="bold">Committed</text>
<text x="720.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="small">3 of 5 = majority</text>
<path d="M610,90 L700,110" class="arrow green" marker-end="url(#consensus-h-green)"/>
<text x="400" y="305" text-anchor="middle" dominant-baseline="middle" class="small">2 nodes may fail. 3 failures: no majority, no leader: safe but stopped.</text>
</svg>
<figcaption>The leader replicates a command. With 3 of 5 nodes holding it, it is committed and survives any minority failure.</figcaption>
</figure>
