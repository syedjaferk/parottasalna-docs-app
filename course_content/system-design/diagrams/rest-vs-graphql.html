<figure class="diagram">
<svg class="dg" viewBox="0 0 800 330" role="img" aria-labelledby="rest-vs-graphql-t rest-vs-graphql-d" xmlns="http://www.w3.org/2000/svg">
<title id="rest-vs-graphql-t">REST: three round trips. GraphQL: one.</title>
<desc id="rest-vs-graphql-d">GraphQL lets the client ask for exactly the fields it needs in a single request.</desc>
<defs><marker id="rest-vs-graphql-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="rest-vs-graphql-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="rest-vs-graphql-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="rest-vs-graphql-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="200" y="20" text-anchor="middle" dominant-baseline="middle" class="title">REST</text>
<text x="610" y="20" text-anchor="middle" dominant-baseline="middle" class="title">GraphQL</text>
<rect x="10" y="130" width="80" height="50" rx="10" class="blue"/>
<text x="50.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Client</text>
<rect x="190" y="50" width="200" height="44" rx="10" class="green"/>
<text x="290.0" y="72.0" text-anchor="middle" dominant-baseline="middle" class="code">GET /books/42</text>
<path d="M90,155 L190,72" class="arrow" marker-end="url(#rest-vs-graphql-h)"/>
<rect x="190" y="130" width="200" height="44" rx="10" class="green"/>
<text x="290.0" y="152.0" text-anchor="middle" dominant-baseline="middle" class="code">GET /authors/7</text>
<path d="M90,155 L190,152" class="arrow" marker-end="url(#rest-vs-graphql-h)"/>
<rect x="190" y="210" width="200" height="44" rx="10" class="green"/>
<text x="290.0" y="232.0" text-anchor="middle" dominant-baseline="middle" class="code">GET /books/42/reviews</text>
<path d="M90,155 L190,232" class="arrow" marker-end="url(#rest-vs-graphql-h)"/>
<text x="290" y="285" text-anchor="middle" dominant-baseline="middle" class="small">3 requests, extra fields returned</text>
<rect x="430" y="130" width="80" height="50" rx="10" class="blue"/>
<text x="470.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Client</text>
<rect x="590" y="90" width="190" height="130" rx="10" class="purple"/>
<text x="685.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="code">POST /graphql</text>
<text x="685.0" y="145.0" text-anchor="middle" dominant-baseline="middle">{ book(id:42) {</text>
<text x="685.0" y="165.0" text-anchor="middle" dominant-baseline="middle">title author{name}</text>
<text x="685.0" y="185.0" text-anchor="middle" dominant-baseline="middle">reviews(limit:2){text} } }</text>
<path d="M510,155 L590,155" class="arrow blue" marker-end="url(#rest-vs-graphql-h-blue)"/>
<text x="690" y="245" text-anchor="middle" dominant-baseline="middle" class="small">1 request, exactly those fields</text>
</svg>
<figcaption>GraphQL lets the client ask for exactly the fields it needs in a single request.</figcaption>
</figure>
