<figure class="diagram">
<svg class="dg" viewBox="0 0 800 280" role="img" aria-labelledby="acid-t acid-d" xmlns="http://www.w3.org/2000/svg">
<title id="acid-t">A transfer as one atomic transaction</title>
<desc id="acid-d">Both updates commit together or both roll back. The log makes the commit durable.</desc>
<defs><marker id="acid-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="acid-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="acid-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="acid-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="100" width="100" height="50" rx="10" class="blue"/>
<text x="60.0" y="125.0" text-anchor="middle" dominant-baseline="middle">BEGIN</text>
<rect x="170" y="40" width="190" height="50" rx="10" class="amber"/>
<text x="265.0" y="65.0" text-anchor="middle" dominant-baseline="middle">Asha: balance - 500</text>
<rect x="170" y="160" width="190" height="50" rx="10" class="amber"/>
<text x="265.0" y="185.0" text-anchor="middle" dominant-baseline="middle">Ravi: balance + 500</text>
<path d="M110,115 L170,65" class="arrow" marker-end="url(#acid-h)"/>
<path d="M110,135 L170,185" class="arrow" marker-end="url(#acid-h)"/>
<rect x="430" y="100" width="120" height="50" rx="10" class="purple"/>
<text x="490.0" y="125.0" text-anchor="middle" dominant-baseline="middle">Any error?</text>
<path d="M360,65 L430,115" class="arrow" marker-end="url(#acid-h)"/>
<path d="M360,185 L430,135" class="arrow" marker-end="url(#acid-h)"/>
<rect x="620" y="30" width="160" height="60" rx="10" class="green"/>
<text x="700.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="bold">COMMIT</text>
<text x="700.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="small">both changes visible</text>
<rect x="620" y="120" width="160" height="60" rx="10" class="red"/>
<text x="700.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">ROLLBACK</text>
<text x="700.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="small">neither change</text>
<path d="M550,110 L620,60" class="arrow" marker-end="url(#acid-h)"/>
<text x="585" y="70" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<path d="M550,140 L620,150" class="arrow" marker-end="url(#acid-h)"/>
<text x="585" y="158" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<rect x="170" y="235" width="380" height="36" rx="10" class="box"/>
<text x="360.0" y="253.0" text-anchor="middle" dominant-baseline="middle">Write-ahead log is flushed before COMMIT returns: durability</text>
</svg>
<figcaption>Both updates commit together or both roll back. The log makes the commit durable.</figcaption>
</figure>
