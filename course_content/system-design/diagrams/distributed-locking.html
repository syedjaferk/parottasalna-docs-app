<figure class="diagram">
<svg class="dg" viewBox="0 0 800 340" role="img" aria-labelledby="distributed-locking-t distributed-locking-d" xmlns="http://www.w3.org/2000/svg">
<title id="distributed-locking-t">Lease + fencing token</title>
<desc id="distributed-locking-d">A paused client wakes up with an expired lease. The storage rejects its write because the token is stale.</desc>
<defs><marker id="distributed-locking-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="distributed-locking-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="distributed-locking-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="distributed-locking-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="110" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Client A</text>
<text x="330" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Lock service</text>
<text x="540" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Client B</text>
<text x="720" y="20" text-anchor="middle" dominant-baseline="middle" class="title">Storage</text>
<line x1="110" y1="34" x2="110" y2="310" class="line"/>
<line x1="330" y1="34" x2="330" y2="310" class="line"/>
<line x1="540" y1="34" x2="540" y2="310" class="line"/>
<line x1="720" y1="34" x2="720" y2="310" class="line"/>
<path d="M110,60 L330,70" class="arrow blue" marker-end="url(#distributed-locking-h-blue)"/>
<text x="220" y="50" text-anchor="middle" dominant-baseline="middle" class="small">acquire</text>
<path d="M330,85 L110,95" class="arrow green" marker-end="url(#distributed-locking-h-green)"/>
<text x="220" y="108" text-anchor="middle" dominant-baseline="middle" class="small">token 33, lease 10s</text>
<rect x="10" y="125" width="200" height="40" rx="10" class="amber"/>
<text x="110.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">A pauses (GC): lease expires</text>
<path d="M540,150 L330,160" class="arrow blue" marker-end="url(#distributed-locking-h-blue)"/>
<text x="435" y="140" text-anchor="middle" dominant-baseline="middle" class="small">acquire</text>
<path d="M330,175 L540,185" class="arrow green" marker-end="url(#distributed-locking-h-green)"/>
<text x="435" y="198" text-anchor="middle" dominant-baseline="middle" class="small">token 34</text>
<path d="M540,215 L720,225" class="arrow green" marker-end="url(#distributed-locking-h-green)"/>
<text x="630" y="205" text-anchor="middle" dominant-baseline="middle" class="small">write, token 34: ok</text>
<path d="M110,255 L720,267" class="arrow red" marker-end="url(#distributed-locking-h-red)"/>
<text x="415" y="245" text-anchor="middle" dominant-baseline="middle" class="small">late write, token 33</text>
<rect x="480" y="290" width="290" height="40" rx="10" class="red"/>
<text x="625.0" y="310.0" text-anchor="middle" dominant-baseline="middle" class="bold">REJECTED: 33 &lt; 34</text>
</svg>
<figcaption>A paused client wakes up with an expired lease. The storage rejects its write because the token is stale.</figcaption>
</figure>
