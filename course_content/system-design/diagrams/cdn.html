<figure class="diagram">
<svg class="dg" viewBox="0 0 800 250" role="img" aria-labelledby="cdn-t cdn-d" xmlns="http://www.w3.org/2000/svg">
<title id="cdn-t">CDN edge and origin</title>
<desc id="cdn-d">A user is routed to the nearest edge server. On a hit the edge answers. On a miss it fetches from the origin and keeps a copy.</desc>
<defs><marker id="cdn-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="100" width="90" height="50" rx="10" class="blue"/>
<text x="55.0" y="121.0" text-anchor="middle" class="code">User</text>
<text x="55.0" y="137.0" text-anchor="middle" class="code">(Chennai)</text>
<rect x="150" y="20" width="110" height="44" rx="10" class="amber"/>
<text x="205.0" y="46.0" text-anchor="middle" class="code">DNS / anycast</text>
<rect x="310" y="100" width="140" height="50" rx="10" class="amber"/>
<text x="380.0" y="129.0" text-anchor="middle" class="code">Edge: Chennai</text>
<rect x="310" y="180" width="140" height="44" rx="10" class="amber"/>
<text x="380.0" y="206.0" text-anchor="middle" class="code">Edge: Frankfurt</text>
<rect x="540" y="100" width="120" height="50" rx="10" class="green"/>
<text x="600.0" y="129.0" text-anchor="middle" class="code">Origin shield</text>
<rect x="700" y="100" width="90" height="50" rx="10" class="red"/>
<text x="745.0" y="129.0" text-anchor="middle" class="code">Origin</text>
<path d="M100,118 L150,52" class="arrow" marker-end="url(#cdn-h)"/>
<text x="120" y="80" text-anchor="middle" class="small">1</text>
<path d="M100,130 L310,125" class="arrow" marker-end="url(#cdn-h)"/>
<text x="205.0" y="121.5" text-anchor="middle" class="small">2 hit: answer</text>
<path d="M450,125 L540,125" class="arrow" marker-end="url(#cdn-h)"/>
<text x="495.0" y="119.0" text-anchor="middle" class="small">3 miss</text>
<path d="M660,125 L700,125" class="arrow" marker-end="url(#cdn-h)"/>
</svg>
<figcaption>Edges answer most requests. Only misses travel to the origin.</figcaption>
</figure>
