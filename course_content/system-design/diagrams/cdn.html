<figure class="diagram">
<svg class="dg" viewBox="0 0 800 300" role="img" aria-labelledby="cdn-t cdn-d" xmlns="http://www.w3.org/2000/svg">
<title id="cdn-t">CDN edge and origin</title>
<desc id="cdn-d">Users are routed to the nearest edge. A hit is answered there. A miss goes through a shield cache to the origin.</desc>
<defs><marker id="cdn-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="cdn-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="cdn-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="cdn-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="130" width="110" height="60" rx="10" class="blue"/>
<text x="65.0" y="150.0" text-anchor="middle" dominant-baseline="middle">Users</text>
<text x="65.0" y="170.0" text-anchor="middle" dominant-baseline="middle">(Chennai)</text>
<rect x="10" y="30" width="150" height="44" rx="10" class="purple"/>
<text x="85.0" y="52.0" text-anchor="middle" dominant-baseline="middle">DNS / anycast</text>
<path d="M65,130 L65,74" class="arrow" marker-end="url(#cdn-h)"/>
<text x="150" y="102" text-anchor="middle" dominant-baseline="middle" class="small">1 which edge?</text>
<rect x="280" y="120" width="150" height="60" rx="10" class="amber"/>
<text x="355.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Edge: Chennai</text>
<rect x="280" y="215" width="150" height="50" rx="10" class="amber"/>
<text x="355.0" y="240.0" text-anchor="middle" dominant-baseline="middle">Edge: Frankfurt</text>
<rect x="520" y="120" width="130" height="60" rx="10" class="green"/>
<text x="585.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Origin shield</text>
<rect x="690" y="120" width="100" height="60" rx="10" class="red"/>
<text x="740.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="bold">Origin</text>
<path d="M120,150 L280,150" class="arrow" marker-end="url(#cdn-h)"/>
<text x="200" y="134" text-anchor="middle" dominant-baseline="middle" class="small">2 GET</text>
<path d="M280,170 L120,170" class="arrow green dashed" marker-end="url(#cdn-h-green)"/>
<text x="200" y="190" text-anchor="middle" dominant-baseline="middle" class="small">hit: answered here</text>
<path d="M430,150 L520,150" class="arrow dashed" marker-end="url(#cdn-h)"/>
<text x="475" y="134" text-anchor="middle" dominant-baseline="middle" class="small">3 miss</text>
<path d="M650,150 L690,150" class="arrow dashed" marker-end="url(#cdn-h)"/>
<text x="400" y="288" text-anchor="middle" dominant-baseline="middle" class="small">A 97% hit rate means the origin sees only 3% of the traffic.</text>
</svg>
<figcaption>Users are routed to the nearest edge. A hit is answered there. A miss goes through a shield cache to the origin.</figcaption>
</figure>
