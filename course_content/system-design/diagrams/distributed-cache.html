<figure class="diagram">
<svg class="dg" viewBox="0 0 800 260" role="img" aria-labelledby="dc-t dc-d" xmlns="http://www.w3.org/2000/svg">
<title id="dc-t">Distributed cache cluster</title>
<desc id="dc-d">Application servers use a client library that hashes the key to pick the cache node. Each node has a replica. On a miss the app reads the database.</desc>
<defs><marker id="dc-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="100" width="120" height="50" rx="10" class="green"/>
<text x="70.0" y="121.0" text-anchor="middle" class="code">App servers</text>
<text x="70.0" y="137.0" text-anchor="middle" class="code">+ cache client</text>
<rect x="250" y="20" width="120" height="44" rx="10" class="amber"/>
<text x="310.0" y="46.0" text-anchor="middle" class="code">Cache node 1</text>
<rect x="250" y="100" width="120" height="50" rx="10" class="amber"/>
<text x="310.0" y="129.0" text-anchor="middle" class="code">Cache node 2</text>
<rect x="250" y="190" width="120" height="44" rx="10" class="amber"/>
<text x="310.0" y="216.0" text-anchor="middle" class="code">Cache node 3</text>
<path d="M130,112 L250,44" class="arrow" marker-end="url(#dc-h)"/>
<text x="180" y="68" text-anchor="middle" class="small">hash(key)</text>
<path d="M130,125 L250,125" class="arrow" marker-end="url(#dc-h)"/>
<path d="M130,138 L250,212" class="arrow" marker-end="url(#dc-h)"/>
<rect x="470" y="100" width="110" height="50" rx="10" class="amber"/>
<text x="525.0" y="129.0" text-anchor="middle" class="code">Replica of 2</text>
<path d="M370,125 L470,125" class="arrow" marker-end="url(#dc-h)"/>
<text x="420" y="114" text-anchor="middle" class="small">async copy</text>
<rect x="650" y="100" width="120" height="50" rx="10" class="red"/>
<text x="710.0" y="129.0" text-anchor="middle" class="code">Database</text>
<path d="M130,150 L650,190" class="arrow" marker-end="url(#dc-h)"/>
<text x="400" y="232" text-anchor="middle" class="small">miss: read the database and fill the cache</text>
</svg>
<figcaption>Consistent hashing means adding a node moves only a small share of keys.</figcaption>
</figure>
