<title id="distributed-cache-t">A sharded and replicated cache cluster</title>

<rect x="10" y="120" width="150" height="70" rx="10" class="green"/>

<path d="M160,155 L270,115" class="arrow" marker-end="url(#distributed-cache-h)"/>
<rect x="470" y="90" width="110" height="50" rx="10" class="box"/>

<path d="M400,185 L470,185" class="arrow dashed" marker-end="url(#distributed-cache-h)"/>
<rect x="270" y="230" width="130" height="50" rx="10" class="amber"/>
