<figure class="diagram">
<svg class="dg" viewBox="0 0 760 210" role="img" aria-labelledby="fw-t fw-d" xmlns="http://www.w3.org/2000/svg">
<title id="fw-t">The seven steps of a system design answer</title>
<desc id="fw-d">Clarify, estimate, API and data, high-level design, deep dive, reliability, trade-offs, with suggested minutes.</desc>
<defs><marker id="fw-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker></defs>
<rect x="10" y="30" width="96" height="60" rx="10" class="blue"/><text x="58" y="52" text-anchor="middle" class="code">1 Clarify</text><text x="58" y="74" text-anchor="middle" class="small">3-5 min</text>
<rect x="116" y="30" width="96" height="60" rx="10" class="blue"/><text x="164" y="52" text-anchor="middle" class="code">2 Estimate</text><text x="164" y="74" text-anchor="middle" class="small">2-3 min</text>
<rect x="222" y="30" width="96" height="60" rx="10" class="blue"/><text x="270" y="52" text-anchor="middle" class="code">3 API+data</text><text x="270" y="74" text-anchor="middle" class="small">3-5 min</text>
<rect x="328" y="30" width="96" height="60" rx="10" class="green"/><text x="376" y="52" text-anchor="middle" class="code">4 High-level</text><text x="376" y="74" text-anchor="middle" class="small">5-10 min</text>
<rect x="434" y="30" width="96" height="60" rx="10" class="amber"/><text x="482" y="52" text-anchor="middle" class="code">5 Deep dive</text><text x="482" y="74" text-anchor="middle" class="small">10-15 min</text>
<rect x="540" y="30" width="96" height="60" rx="10" class="red"/><text x="588" y="52" text-anchor="middle" class="code">6 Reliability</text><text x="588" y="74" text-anchor="middle" class="small">5 min</text>
<rect x="646" y="30" width="96" height="60" rx="10" class="blue"/><text x="694" y="52" text-anchor="middle" class="code">7 Trade-offs</text><text x="694" y="74" text-anchor="middle" class="small">to the end</text>
<text x="380" y="130" text-anchor="middle" class="small">Start simple, then evolve. Tie every decision to a requirement or a number from steps 1 and 2.</text>
<text x="380" y="156" text-anchor="middle" class="small">Think out loud: the reasoning matters more than the final picture.</text>
</svg>
<figcaption>Seven steps, roughly 45 minutes. Do not spend 25 minutes on steps 1 and 2.</figcaption>
</figure>
