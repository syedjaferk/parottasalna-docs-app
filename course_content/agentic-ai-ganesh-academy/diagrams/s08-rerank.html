<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s08-rerank-t s08-rerank-d" xmlns="http://www.w3.org/2000/svg">
<title id="s08-rerank-t">Filter, shortlist, rerank</title>
<desc id="s08-rerank-d">A metadata filter limits which chunks may match. Fast vector search shortlists about 15. A slower, more accurate cross-encoder re-scores each (question, chunk) pair and keeps the best few for the LLM.</desc>
<defs><marker id="s08-rerank-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s08-rerank-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s08-rerank-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s08-rerank-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="90" width="120" height="60" rx="10" class="box"/>
<text x="80.0" y="110.0" text-anchor="middle" dominant-baseline="middle">question</text>
<text x="80.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">+ filter</text>
<path d="M140,120 L178,120" class="arrow" marker-end="url(#s08-rerank-h)"/>
<rect x="180" y="30" width="160" height="180" rx="10" class="blue"/>
<text x="260" y="50" text-anchor="middle" dominant-baseline="middle" class="bold">Vector DB</text>
<rect x="185" y="70" width="150" height="36" rx="6" class="amber"/>
<text x="260.0" y="88.0" text-anchor="middle" dominant-baseline="middle" class="code">filter: Database</text>
<text x="260" y="125" text-anchor="middle" dominant-baseline="middle" class="small">bi-encoder search</text>
<text x="260" y="145" text-anchor="middle" dominant-baseline="middle" class="small">fast, rough</text>
<text x="260" y="180" text-anchor="middle" dominant-baseline="middle" class="bold">top 15</text>
<path d="M340,120 L398,120" class="arrow" marker-end="url(#s08-rerank-h)"/>
<text x="369" y="106" text-anchor="middle" dominant-baseline="middle" class="small">15 chunks</text>
<rect x="400" y="60" width="160" height="120" rx="10" class="amber"/>
<text x="480.0" y="90.0" text-anchor="middle" dominant-baseline="middle">Cross-encoder</text>
<text x="480.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">reads question + chunk</text>
<text x="480.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">together</text>
<text x="480.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">slow, accurate</text>
<path d="M560,120 L598,120" class="arrow green" marker-end="url(#s08-rerank-h-green)"/>
<text x="579" y="106" text-anchor="middle" dominant-baseline="middle" class="small">top 4</text>
<rect x="600" y="90" width="100" height="60" rx="10" class="green"/>
<text x="650.0" y="120.0" text-anchor="middle" dominant-baseline="middle">LLM</text>
</svg>
<figcaption>A metadata filter limits which chunks may match. Fast vector search shortlists about 15. A slower, more accurate cross-encoder re-scores each (question, chunk) pair and keeps the best few for the LLM.</figcaption>
