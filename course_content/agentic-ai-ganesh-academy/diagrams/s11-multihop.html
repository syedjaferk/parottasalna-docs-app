<figure class="diagram">
<svg class="dg" viewBox="0 0 720 210" role="img" aria-labelledby="s11-multihop-t s11-multihop-d" xmlns="http://www.w3.org/2000/svg">
<title id="s11-multihop-t">Multi-hop retrieval</title>
<desc id="s11-multihop-d">The first search finds a fact that points somewhere else. A second search, written from that fact, finds the rest of the answer.</desc>
<defs><marker id="s11-multihop-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s11-multihop-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s11-multihop-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s11-multihop-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="75" width="150" height="60" rx="10" class="box"/>
<text x="95.0" y="95.0" text-anchor="middle" dominant-baseline="middle">How does S3 reduce</text>
<text x="95.0" y="115.0" text-anchor="middle" dominant-baseline="middle">storage cost?</text>
<path d="M170,105 L208,105" class="arrow" marker-end="url(#s11-multihop-h)"/>
<text x="189" y="90" text-anchor="middle" dominant-baseline="middle" class="small">hop 1</text>
<rect x="210" y="60" width="180" height="90" rx="10" class="blue"/>
<text x="300.0" y="85.0" text-anchor="middle" dominant-baseline="middle">Lifecycle Policies</text>
<text x="300.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">move old objects</text>
<text x="300.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">to Glacier</text>
<path d="M390,105 L428,105" class="arrow" marker-end="url(#s11-multihop-h)"/>
<text x="409" y="90" text-anchor="middle" dominant-baseline="middle" class="small">hop 2</text>
<rect x="430" y="60" width="160" height="90" rx="10" class="blue"/>
<text x="510.0" y="85.0" text-anchor="middle" dominant-baseline="middle">search “Glacier”</text>
<text x="510.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">low-cost archive</text>
<text x="510.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">Deep Archive cheapest</text>
<path d="M590,105 L618,105" class="arrow green" marker-end="url(#s11-multihop-h-green)"/>
<rect x="620" y="75" width="85" height="60" rx="10" class="green"/>
<text x="662.5" y="95.0" text-anchor="middle" dominant-baseline="middle">answer</text>
<text x="662.5" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">both hops</text>
</svg>
<figcaption>The first search finds a fact that points somewhere else. A second search, written from that fact, finds the rest of the answer.</figcaption>
</figure>
