<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s09-cache-t s09-cache-d" xmlns="http://www.w3.org/2000/svg">
<title id="s09-cache-t">A semantic cache in front of RAG</title>
<desc id="s09-cache-d">Embed the question and compare it with cached questions. Similar enough (≥ 0.90): return the saved answer instantly. Otherwise run the full RAG pipeline and save the new answer.</desc>
<defs><marker id="s09-cache-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s09-cache-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s09-cache-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s09-cache-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="95" width="145" height="60" rx="10" class="box"/>
<text x="92.5" y="115.0" text-anchor="middle" dominant-baseline="middle">question</text>
<text x="92.5" y="135.0" text-anchor="middle" dominant-baseline="middle" class="small">“explain python lists”</text>
<path d="M165,125 L188,125" class="arrow" marker-end="url(#s09-cache-h)"/>
<rect x="190" y="85" width="150" height="80" rx="10" class="amber"/>
<text x="265.0" y="105.0" text-anchor="middle" dominant-baseline="middle">Redis cache</text>
<text x="265.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">similar question?</text>
<text x="265.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="code">cosine ≥ 0.90</text>
<path d="M340,105 L420,45" class="arrow green" marker-end="url(#s09-cache-h-green)"/>
<text x="372" y="62" text-anchor="middle" dominant-baseline="middle" class="small">HIT</text>
<rect x="422" y="20" width="280" height="50" rx="10" class="green"/>
<text x="562.0" y="35.0" text-anchor="middle" dominant-baseline="middle">return saved answer</text>
<text x="562.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="small">milliseconds · no LLM cost</text>
<path d="M340,145 L420,185" class="arrow red" marker-end="url(#s09-cache-h-red)"/>
<text x="372" y="182" text-anchor="middle" dominant-baseline="middle" class="small">MISS</text>
<rect x="422" y="160" width="170" height="60" rx="10" class="blue"/>
<text x="507.0" y="180.0" text-anchor="middle" dominant-baseline="middle">retrieve + LLM</text>
<text x="507.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">seconds · tokens</text>
<path d="M592,190 L640,190 L640,230 L265,230 L265,167" class="arrow dashed" marker-end="url(#s09-cache-h)"/>
<text x="455" y="242" text-anchor="middle" dominant-baseline="middle" class="small">store question + vector + answer</text>
</svg>
<figcaption>Embed the question and compare it with cached questions. Similar enough (≥ 0.90): return the saved answer instantly. Otherwise run the full RAG pipeline and save the new answer.</figcaption>
</figure>
