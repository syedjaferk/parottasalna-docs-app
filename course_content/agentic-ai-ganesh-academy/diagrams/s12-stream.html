<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s12-stream-t s12-stream-d" xmlns="http://www.w3.org/2000/svg">
<title id="s12-stream-t">Streaming RAG with Server-Sent Events</title>
<desc id="s12-stream-d">The browser opens one long HTTP request. FastAPI retrieves context, then forwards each token from Groq as an SSE event the moment it arrives, ending with a done event.</desc>
<defs><marker id="s12-stream-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s12-stream-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s12-stream-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s12-stream-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="80" width="140" height="80" rx="10" class="box"/>
<text x="90.0" y="100.0" text-anchor="middle" dominant-baseline="middle">Browser</text>
<text x="90.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="code">EventSource</text>
<text x="90.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="code">textContent +=</text>
<path d="M160,100 L238,100" class="arrow" marker-end="url(#s12-stream-h)"/>
<text x="199" y="86" text-anchor="middle" dominant-baseline="middle" class="small">GET /chat?question=</text>
<rect x="240" y="60" width="200" height="120" rx="10" class="blue"/>
<text x="340.0" y="90.0" text-anchor="middle" dominant-baseline="middle">FastAPI</text>
<text x="340.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">EventSourceResponse</text>
<text x="340.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">1 · retrieve (Chroma)</text>
<text x="340.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">2 · stream tokens</text>
<path d="M440,100 L518,100" class="arrow" marker-end="url(#s12-stream-h)"/>
<text x="479" y="86" text-anchor="middle" dominant-baseline="middle" class="small">stream=True</text>
<rect x="520" y="70" width="180" height="100" rx="10" class="amber"/>
<text x="610.0" y="110.0" text-anchor="middle" dominant-baseline="middle">Groq</text>
<text x="610.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">token · token · token</text>
<path d="M518,145 L442,145" class="arrow green" marker-end="url(#s12-stream-h-green)"/>
<path d="M238,145 L162,145" class="arrow green" marker-end="url(#s12-stream-h-green)"/>
<text x="200" y="160" text-anchor="middle" dominant-baseline="middle" class="small">event: token</text>
<text x="200" y="210" text-anchor="middle" dominant-baseline="middle" class="small">… event: done → close</text>
</svg>
<figcaption>The browser opens one long HTTP request. FastAPI retrieves context, then forwards each token from Groq as an SSE event the moment it arrives, ending with a done event.</figcaption>
</figure>
