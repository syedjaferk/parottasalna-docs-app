<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s04-hybrid-t s04-hybrid-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-hybrid-t">Hybrid search</title>
<desc id="s04-hybrid-d">Run keyword (BM25) and vector search for the same question, put both score lists on the same scale, then combine them into one ranking.</desc>
<defs><marker id="s04-hybrid-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-hybrid-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-hybrid-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-hybrid-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="85" width="140" height="60" rx="10" class="box"/>

<path d="M160,100 L198,55" class="arrow" marker-end="url(#s04-hybrid-h)"/>
<path d="M160,130 L198,175" class="arrow" marker-end="url(#s04-hybrid-h)"/>

<rect x="200" y="145" width="180" height="60" rx="10" class="green"/>
<text x="290.0" y="165.0" text-anchor="middle" dominant-baseline="middle">Dense (cosine)</text>
<text x="290.0" y="185.0" text-anchor="middle" dominant-baseline="middle" class="small">scores -1 … 1</text>
<path d="M380,55 L438,100" class="arrow" marker-end="url(#s04-hybrid-h)"/>

<rect x="610" y="80" width="95" height="70" rx="10" class="green"/>
