<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s03-vdb-t s03-vdb-d" xmlns="http://www.w3.org/2000/svg">
<title id="s03-vdb-t">Store, then search</title>
<desc id="s03-vdb-d">Flow 1 stores each document with its vector. Flow 2 embeds the question with the SAME model and asks the vector database for the nearest documents.</desc>
<defs><marker id="s03-vdb-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s03-vdb-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s03-vdb-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s03-vdb-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="20" y="30" text-anchor="start" dominant-baseline="middle" class="bold">FLOW 1 · store</text>
<rect x="20" y="45" width="140" height="50" rx="10" class="box"/>
<text x="90.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="small">documents</text>
<path d="M160,70 L218,70" class="arrow" marker-end="url(#s03-vdb-h)"/>
<rect x="220" y="45" width="160" height="50" rx="10" class="blue"/>
<text x="300.0" y="60.0" text-anchor="middle" dominant-baseline="middle">embedding model</text>
<text x="300.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="small">nomic / MiniLM</text>
<path d="M380,70 L478,95" class="arrow" marker-end="url(#s03-vdb-h)"/>
<rect x="480" y="80" width="220" height="70" rx="10" class="green"/>
<text x="590.0" y="95.0" text-anchor="middle" dominant-baseline="middle">Vector DB</text>
<text x="590.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">Chroma · FAISS · Pinecone</text>
<text x="590.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="small">text + vector + metadata</text>
<text x="20" y="140" text-anchor="start" dominant-baseline="middle" class="bold">FLOW 2 · search</text>
<rect x="20" y="155" width="140" height="50" rx="10" class="box"/>
<text x="90.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="small">question</text>
<path d="M160,180 L218,180" class="arrow" marker-end="url(#s03-vdb-h)"/>
<rect x="220" y="155" width="160" height="50" rx="10" class="blue"/>
<text x="300.0" y="170.0" text-anchor="middle" dominant-baseline="middle">same model</text>
<text x="300.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="small">→ query vector</text>
<path d="M380,180 L478,140" class="arrow" marker-end="url(#s03-vdb-h)"/>
<text x="440" y="175" text-anchor="middle" dominant-baseline="middle" class="small">nearest k</text>
</svg>
<figcaption>Flow 1 stores each document with its vector. Flow 2 embeds the question with the SAME model and asks the vector database for the nearest documents.</figcaption>
</figure>
