<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s05-chunking-t s05-chunking-d" xmlns="http://www.w3.org/2000/svg">
<title id="s05-chunking-t">Four ways to cut the same text</title>
<desc id="s05-chunking-d">Fixed size cuts anywhere, even mid-word. Overlap repeats the edges. Sentence chunking never splits a sentence. Semantic chunking starts a new chunk when the topic changes.</desc>
<defs><marker id="s05-chunking-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s05-chunking-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s05-chunking-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s05-chunking-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="150" y="40" text-anchor="end" dominant-baseline="middle" class="small">Fixed (200)</text>
<rect x="160.0" y="25" width="147.0" height="26" rx="5" class="blue"/>
<rect x="310.0" y="25" width="147.0" height="26" rx="5" class="blue"/>
<rect x="460.0" y="25" width="147.0" height="26" rx="5" class="blue"/>
<rect x="610.0" y="25" width="34.5" height="26" rx="5" class="blue"/>
<text x="150" y="92" text-anchor="end" dominant-baseline="middle" class="small">Overlap (200/50)</text>
<rect x="160.0" y="77" width="147.0" height="26" rx="5" class="blue"/>
<rect x="272.5" y="85" width="147.0" height="26" rx="5" class="green"/>
<rect x="385.0" y="77" width="147.0" height="26" rx="5" class="blue"/>
<rect x="497.5" y="85" width="147.0" height="26" rx="5" class="green"/>
<text x="150" y="144" text-anchor="end" dominant-baseline="middle" class="small">Sentences</text>
<rect x="160.0" y="129" width="124.5" height="26" rx="5" class="blue"/>
<rect x="287.5" y="129" width="162.0" height="26" rx="5" class="green"/>
<rect x="452.5" y="129" width="94.5" height="26" rx="5" class="blue"/>
<rect x="550.0" y="129" width="94.5" height="26" rx="5" class="green"/>
<text x="150" y="196" text-anchor="end" dominant-baseline="middle" class="small">Semantic</text>
<rect x="160.0" y="181" width="222.0" height="26" rx="5" class="blue"/>
<rect x="385.0" y="181" width="132.0" height="26" rx="5" class="green"/>
<rect x="520.0" y="181" width="124.5" height="26" rx="5" class="amber"/>
<text x="160" y="235" text-anchor="start" dominant-baseline="middle" class="small">cuts “bitma|ps”</text>
<text x="560" y="235" text-anchor="start" dominant-baseline="middle" class="small">same topic = one chunk</text>
</svg>
<figcaption>Fixed size cuts anywhere, even mid-word. Overlap repeats the edges. Sentence chunking never splits a sentence. Semantic chunking starts a new chunk when the topic changes.</figcaption>
</figure>
