<figure class="diagram">
<svg class="dg" viewBox="0 0 720 190" role="img" aria-labelledby="s07-chunks-t s07-chunks-d" xmlns="http://www.w3.org/2000/svg">
<title id="s07-chunks-t">Chunks with overlap</title>
<desc id="s07-chunks-d">Neighbouring chunks share a little text, so a sentence cut at a boundary still appears whole in one chunk.</desc>
<defs><marker id="s07-chunks-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s07-chunks-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s07-chunks-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s07-chunks-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="680" height="30" rx="6" class="box"/>
<text x="360" y="35" text-anchor="middle" dominant-baseline="middle" class="small">the whole page of text ............................................................</text>
<rect x="20" y="80" width="260" height="44" rx="10" class="blue"/>
<text x="150.0" y="102.0" text-anchor="middle" dominant-baseline="middle">chunk 1  (1000 chars)</text>
<rect x="230" y="135" width="260" height="44" rx="10" class="blue"/>
<text x="360.0" y="157.0" text-anchor="middle" dominant-baseline="middle">chunk 2</text>
<rect x="440" y="80" width="260" height="44" rx="10" class="blue"/>
<text x="570.0" y="102.0" text-anchor="middle" dominant-baseline="middle">chunk 3</text>
<rect x="230" y="80" width="50" height="44" rx="6" class="amber"/>
<rect x="440" y="135" width="50" height="44" rx="6" class="amber"/>
<text x="255" y="70" text-anchor="middle" dominant-baseline="middle" class="small">overlap</text>
<text x="600" y="160" text-anchor="middle" dominant-baseline="middle" class="small">overlap = 150 chars</text>
</svg>
<figcaption>Neighbouring chunks share a little text, so a sentence cut at a boundary still appears whole in one chunk.</figcaption>
</figure>
