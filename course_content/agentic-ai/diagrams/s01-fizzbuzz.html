<figure class="diagram">
<svg class="dg" viewBox="0 0 720 372" role="img" aria-labelledby="s01-fizzbuzz-t s01-fizzbuzz-d" xmlns="http://www.w3.org/2000/svg">
<title id="s01-fizzbuzz-t">FizzBuzz decision order</title>
<desc id="s01-fizzbuzz-d">Python checks each condition from top to bottom and stops at the first one that is true. So the most specific check (divisible by 3 AND 5) must come first.</desc>
<defs><marker id="s01-fizzbuzz-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-fizzbuzz-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-fizzbuzz-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-fizzbuzz-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="40" y="15" width="260" height="40" rx="10" class="box"/>
<text x="170.0" y="35.0" text-anchor="middle" dominant-baseline="middle">Take the next number n</text>
<path d="M170,55 L170,78" class="arrow" marker-end="url(#s01-fizzbuzz-h)"/>
<rect x="40" y="80" width="260" height="44" rx="10" class="amber"/>
<text x="170.0" y="102.0" text-anchor="middle" dominant-baseline="middle">Divisible by 3 AND 5?</text>
<rect x="440" y="82" width="160" height="40" rx="10" class="green"/>
<text x="520.0" y="102.0" text-anchor="middle" dominant-baseline="middle" class="bold">FizzBuzz</text>
<path d="M300,102 L438,102" class="arrow green" marker-end="url(#s01-fizzbuzz-h-green)"/>
<text x="370" y="90" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M170,124 L170,158" class="arrow" marker-end="url(#s01-fizzbuzz-h)"/>
<text x="190" y="142" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<rect x="40" y="160" width="260" height="44" rx="10" class="amber"/>
<text x="170.0" y="182.0" text-anchor="middle" dominant-baseline="middle">Divisible by 3?</text>
<rect x="440" y="162" width="160" height="40" rx="10" class="green"/>
<text x="520.0" y="182.0" text-anchor="middle" dominant-baseline="middle" class="bold">Fizz</text>
<path d="M300,182 L438,182" class="arrow green" marker-end="url(#s01-fizzbuzz-h-green)"/>
<text x="370" y="170" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M170,204 L170,238" class="arrow" marker-end="url(#s01-fizzbuzz-h)"/>
<text x="190" y="222" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<rect x="40" y="240" width="260" height="44" rx="10" class="amber"/>
<text x="170.0" y="262.0" text-anchor="middle" dominant-baseline="middle">Divisible by 5?</text>
<rect x="440" y="242" width="160" height="40" rx="10" class="green"/>
<text x="520.0" y="262.0" text-anchor="middle" dominant-baseline="middle" class="bold">Buzz</text>
<path d="M300,262 L438,262" class="arrow green" marker-end="url(#s01-fizzbuzz-h-green)"/>
<text x="370" y="250" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M170,284 L170,318" class="arrow" marker-end="url(#s01-fizzbuzz-h)"/>
<text x="190" y="302" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<rect x="40" y="320" width="260" height="40" rx="10" class="box"/>
<text x="170.0" y="340.0" text-anchor="middle" dominant-baseline="middle" class="code">print(n)</text>
</svg>
<figcaption>Python checks each condition from top to bottom and stops at the first one that is true. So the most specific check (divisible by 3 AND 5) must come first.</figcaption>
</figure>
