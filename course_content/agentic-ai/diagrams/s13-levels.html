<figure class="diagram">
<svg class="dg" viewBox="0 0 720 275" role="img" aria-labelledby="s13-levels-t s13-levels-d" xmlns="http://www.w3.org/2000/svg">
<title id="s13-levels-t">Three levels of human in the loop</title>
<desc id="s13-levels-d">Each level adds control. Level 3 can pause for hours and survive a restart, which is what real apps need.</desc>
<defs><marker id="s13-levels-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s13-levels-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s13-levels-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s13-levels-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="175" width="220" height="64" rx="10" class="blue"/>
<text x="120.0" y="197.0" text-anchor="middle" dominant-baseline="middle" class="bold">Level 1 · gate in a chain</text>
<text x="120.0" y="217.0" text-anchor="middle" dominant-baseline="middle" class="small">input() before serving</text>
<text x="120" y="257" text-anchor="middle" dominant-baseline="middle" class="small">scripts and learning</text>
<rect x="250" y="100" width="220" height="64" rx="10" class="amber"/>
<text x="360.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="bold">Level 2 · review tool calls</text>
<text x="360.0" y="142.0" text-anchor="middle" dominant-baseline="middle" class="small">approve / edit / reject each one</text>
<text x="360" y="182" text-anchor="middle" dominant-baseline="middle" class="small">your own agent loop</text>
<rect x="490" y="25" width="220" height="64" rx="10" class="green"/>
<text x="600.0" y="47.0" text-anchor="middle" dominant-baseline="middle" class="bold">Level 3 · middleware</text>
<text x="600.0" y="67.0" text-anchor="middle" dominant-baseline="middle" class="small">rule book + pause and resume</text>
<text x="600" y="107" text-anchor="middle" dominant-baseline="middle" class="small">production apps</text>
<path d="M120,175 L120,132 L248,132" class="arrow" marker-end="url(#s13-levels-h)"/>
<path d="M360,100 L360,57 L488,57" class="arrow" marker-end="url(#s13-levels-h)"/>
<text x="150" y="40" text-anchor="middle" dominant-baseline="middle" class="small">more control,</text>
<text x="150" y="58" text-anchor="middle" dominant-baseline="middle" class="small">survives restarts →</text>
</svg>
<figcaption>Each level adds control. Level 3 can pause for hours and survive a restart, which is what real apps need.</figcaption>
</figure>
