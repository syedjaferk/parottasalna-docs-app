<figure class="diagram">
<svg class="dg" viewBox="0 0 720 280" role="img" aria-labelledby="s10-threads-store-t s10-threads-store-d" xmlns="http://www.w3.org/2000/svg">
<title id="s10-threads-store-t">Checkpointer vs Store</title>
<desc id="s10-threads-store-d">A checkpointer remembers one conversation (thread). A Store remembers facts about a user across all their conversations.</desc>
<defs><marker id="s10-threads-store-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s10-threads-store-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s10-threads-store-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s10-threads-store-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="170" y="15" text-anchor="middle" dominant-baseline="middle" class="title">CHECKPOINTER (per thread)</text>
<rect x="20" y="45" width="140" height="120" rx="10" class="blue"/>
<text x="90.0" y="85.0" text-anchor="middle" dominant-baseline="middle">thread</text>
<text x="90.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">session-1</text>
<text x="90.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">chat history</text>
<rect x="180" y="45" width="140" height="120" rx="10" class="blue"/>
<text x="250.0" y="85.0" text-anchor="middle" dominant-baseline="middle">thread</text>
<text x="250.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">session-2</text>
<text x="250.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">chat history</text>
<text x="170" y="185" text-anchor="middle" dominant-baseline="middle" class="small">separate — session-2 can&#x27;t see session-1</text>
<text x="540" y="15" text-anchor="middle" dominant-baseline="middle" class="title">STORE (per user, all threads)</text>
<rect x="400" y="45" width="300" height="120" rx="10" class="green"/>
<text x="550.0" y="85.0" text-anchor="middle" dominant-baseline="middle">(&quot;memories&quot;, &quot;Jafer&quot;)</text>
<text x="550.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">• plays chess, badminton</text>
<text x="550.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">• likes cricket</text>
<path d="M90,45 L90,32 L370,32 L370,70 L398,70" class="arrow green dashed" marker-end="url(#s10-threads-store-h-green)"/>
<path d="M320,120 L398,120" class="arrow green dashed" marker-end="url(#s10-threads-store-h-green)"/>
<text x="550" y="185" text-anchor="middle" dominant-baseline="middle" class="small">both threads read the same facts</text>
<rect x="400" y="210" width="300" height="50" rx="10" class="ghost"/>
<text x="550.0" y="225.0" text-anchor="middle" dominant-baseline="middle">(&quot;memories&quot;, &quot;priya&quot;)</text>
<text x="550.0" y="245.0" text-anchor="middle" dominant-baseline="middle" class="small">empty — can&#x27;t see Jafer&#x27;s facts</text>
</svg>
<figcaption>A checkpointer remembers one conversation (thread). A Store remembers facts about a user across all their conversations.</figcaption>
</figure>
