<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="s11-agent-loop-t s11-agent-loop-d" xmlns="http://www.w3.org/2000/svg">
<title id="s11-agent-loop-t">The agent loop</title>
<desc id="s11-agent-loop-d">Call the model, run any tools it asks for, send the results back, and repeat until it stops asking.</desc>
<defs><marker id="s11-agent-loop-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s11-agent-loop-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s11-agent-loop-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s11-agent-loop-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="105" width="130" height="50" rx="10" class="blue"/>
<text x="85.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Question</text>
<path d="M150,130 L208,130" class="arrow" marker-end="url(#s11-agent-loop-h)"/>
<rect x="210" y="105" width="130" height="50" rx="10" class="amber"/>
<text x="275.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">LLM</text>
<path d="M340,130 L398,130" class="arrow" marker-end="url(#s11-agent-loop-h)"/>
<rect x="400" y="100" width="140" height="60" rx="10" class="amber"/>
<text x="470.0" y="120.0" text-anchor="middle" dominant-baseline="middle">Asked for</text>
<text x="470.0" y="140.0" text-anchor="middle" dominant-baseline="middle">tools?</text>
<rect x="590" y="20" width="110" height="60" rx="10" class="box"/>
<text x="645.0" y="40.0" text-anchor="middle" dominant-baseline="middle">Run tools</text>
<text x="645.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">(your code)</text>
<path d="M470,100 L470,50 L588,50" class="arrow" marker-end="url(#s11-agent-loop-h)"/>
<text x="495" y="38" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M645,80 L645,215 L275,215 L275,157" class="arrow blue" marker-end="url(#s11-agent-loop-h-blue)"/>
<text x="460" y="232" text-anchor="middle" dominant-baseline="middle" class="small">add results to messages, call again</text>
<rect x="590" y="105" width="110" height="50" rx="10" class="green"/>
<text x="645.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Answer</text>
<path d="M540,130 L588,130" class="arrow green" marker-end="url(#s11-agent-loop-h-green)"/>
<text x="562" y="118" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
</svg>
<figcaption>Call the model, run any tools it asks for, send the results back, and repeat until it stops asking.</figcaption>
</figure>
