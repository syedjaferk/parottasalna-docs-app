<defs><marker id="s03-flow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s03-flow-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s03-flow-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s03-flow-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>

<path d="M455,64 L455,108" class="arrow" marker-end="url(#s03-flow-h)"/>

<text x="275.0" y="207.0" text-anchor="middle" dominant-baseline="middle">Say higher /</text>

<text x="88" y="220" text-anchor="middle" dominant-baseline="middle" class="small">yes: try again</text>
<rect x="380" y="285" width="150" height="44" rx="10" class="red"/>

<rect x="570" y="285" width="135" height="44" rx="10" class="box"/>
<text x="637.5" y="297.0" text-anchor="middle" dominant-baseline="middle">Save to</text>
