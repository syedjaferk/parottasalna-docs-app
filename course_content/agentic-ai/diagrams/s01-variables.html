<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s01-variables-t s01-variables-d" xmlns="http://www.w3.org/2000/svg">
<title id="s01-variables-t">Variables are labels pointing at values</title>
<desc id="s01-variables-d">A variable is a name tag tied to a value. Re-assigning moves the tag; the old value is left behind.</desc>
<defs><marker id="s01-variables-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-variables-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-variables-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-variables-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="120" y="18" text-anchor="middle" dominant-baseline="middle" class="title">NAME (label)</text>
<text x="450" y="18" text-anchor="middle" dominant-baseline="middle" class="title">VALUE</text>
<text x="640" y="18" text-anchor="middle" dominant-baseline="middle" class="title">TYPE</text>
<rect x="40" y="35" width="160" height="44" rx="10" class="blue"/>
<text x="120.0" y="57.0" text-anchor="middle" dominant-baseline="middle" class="code">name</text>
<rect x="340" y="35" width="220" height="44" rx="10" class="box"/>
<text x="450.0" y="57.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Syed Jafer K&quot;</text>
<text x="640" y="57" text-anchor="middle" dominant-baseline="middle" class="small">str</text>
<path d="M200,57 L338,57" class="arrow" marker-end="url(#s01-variables-h)"/>
<rect x="40" y="110" width="160" height="44" rx="10" class="blue"/>
<text x="120.0" y="132.0" text-anchor="middle" dominant-baseline="middle" class="code">age</text>
<rect x="340" y="92" width="220" height="36" rx="10" class="ghost"/>
<text x="450.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">28</text>
<text x="640" y="110" text-anchor="middle" dominant-baseline="middle" class="small">int  (before)</text>
<rect x="340" y="140" width="220" height="36" rx="10" class="box"/>
<text x="450.0" y="158.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Twenty Eight&quot;</text>
<text x="640" y="158" text-anchor="middle" dominant-baseline="middle" class="small">str  (after)</text>
<path d="M200,125 L338,110" class="arrow dashed" marker-end="url(#s01-variables-h)"/>
<path d="M200,140 L338,158" class="arrow blue" marker-end="url(#s01-variables-h-blue)"/>
<text x="270" y="175" text-anchor="middle" dominant-baseline="middle" class="small">age = &quot;Twenty Eight&quot;</text>
<rect x="40" y="195" width="160" height="44" rx="10" class="blue"/>
<text x="120.0" y="217.0" text-anchor="middle" dominant-baseline="middle" class="code">is_machine_on</text>
<rect x="340" y="195" width="220" height="44" rx="10" class="box"/>
<text x="450.0" y="217.0" text-anchor="middle" dominant-baseline="middle" class="code">False</text>
<text x="640" y="217" text-anchor="middle" dominant-baseline="middle" class="small">bool</text>
<path d="M200,217 L338,217" class="arrow" marker-end="url(#s01-variables-h)"/>
</svg>
<figcaption>A variable is a name tag tied to a value. Re-assigning moves the tag; the old value is left behind.</figcaption>
</figure>
