<figure class="diagram">
<svg class="dg" viewBox="0 0 720 300" role="img" aria-labelledby="s04-topk-topp-t s04-topk-topp-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-topk-topp-t">Top-k and top-p cut-offs</title>
<desc id="s04-topk-topp-d">Top-k keeps a fixed number of words. Top-p keeps as many words as it takes to reach a total probability.</desc>
<defs><marker id="s04-topk-topp-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-topk-topp-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-topk-topp-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-topk-topp-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="128" y="42.0" text-anchor="end" dominant-baseline="middle" class="code">pizza</text>

<text x="128" y="74.0" text-anchor="end" dominant-baseline="middle" class="code">pasta</text>
<rect x="140" y="62" width="90.0" height="24" rx="4" class="bar"/>
<text x="240.0" y="74.0" text-anchor="start" dominant-baseline="middle" class="small">25%</text>
<text x="128" y="106.0" text-anchor="end" dominant-baseline="middle" class="code">mangoes</text>
<rect x="140" y="94" width="43.199999999999996" height="24" rx="4" class="bar"/>
<text x="193.2" y="106.0" text-anchor="start" dominant-baseline="middle" class="small">12%</text>
<text x="128" y="138.0" text-anchor="end" dominant-baseline="middle" class="code">biryani</text>
<rect x="140" y="126" width="28.8" height="24" rx="4" class="bar dim"/>
<text x="178.8" y="138.0" text-anchor="start" dominant-baseline="middle" class="small">8%</text>
<text x="128" y="170.0" text-anchor="end" dominant-baseline="middle" class="code">rice</text>
<rect x="140" y="158" width="18.0" height="24" rx="4" class="bar dim"/>
<text x="168.0" y="170.0" text-anchor="start" dominant-baseline="middle" class="small">5%</text>
<text x="128" y="202.0" text-anchor="end" dominant-baseline="middle" class="code">cake</text>
<rect x="140" y="190" width="10.799999999999999" height="24" rx="4" class="bar dim"/>
<text x="160.8" y="202.0" text-anchor="start" dominant-baseline="middle" class="small">3%</text>
<text x="128" y="234.0" text-anchor="end" dominant-baseline="middle" class="code">cardboard</text>
<rect x="140" y="222" width="7.2" height="24" rx="4" class="bar dim"/>

<line x1="110" y1="157" x2="640" y2="157" class="line cut"/>
<text x="640" y="145" text-anchor="end" dominant-baseline="middle" class="small">top-p = 0.9: 45+25+12+8 = 90% → keep 4</text>
<text x="360" y="282" text-anchor="middle" dominant-baseline="middle" class="small">Predicting the word after &quot;I love eating ...&quot;</text>
</svg>
