<figure class="diagram">
<svg class="dg" viewBox="0 0 720 290" role="img" aria-labelledby="trees-t trees-d" xmlns="http://www.w3.org/2000/svg">
<title id="trees-t">Trees: ask the children, then combine</title>
<desc id="trees-d">Height of a node = 1 + the bigger height of its two children. Answers flow from the leaves up to the root.</desc>
<defs><marker id="trees-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="trees-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="trees-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="trees-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<line x1="260" y1="40" x2="140" y2="120" class="line"/>
<line x1="260" y1="40" x2="380" y2="120" class="line"/>
<line x1="140" y1="120" x2="80" y2="200" class="line"/>
<line x1="140" y1="120" x2="200" y2="200" class="line"/>
<circle cx="260" cy="40" r="22" class="blue"/>
<text x="260" y="40" text-anchor="middle" dominant-baseline="middle" class="code">1</text>
<text x="294" y="40" text-anchor="middle" dominant-baseline="middle" class="small">h=3</text>
<circle cx="140" cy="120" r="22" class="blue"/>
<text x="140" y="120" text-anchor="middle" dominant-baseline="middle" class="code">2</text>
<text x="174" y="120" text-anchor="middle" dominant-baseline="middle" class="small">h=2</text>
<circle cx="380" cy="120" r="22" class="green"/>
<text x="380" y="120" text-anchor="middle" dominant-baseline="middle" class="code">3</text>
<text x="414" y="120" text-anchor="middle" dominant-baseline="middle" class="small">h=1</text>
<circle cx="80" cy="200" r="22" class="green"/>
<text x="80" y="200" text-anchor="middle" dominant-baseline="middle" class="code">4</text>
<text x="114" y="200" text-anchor="middle" dominant-baseline="middle" class="small">h=1</text>
<circle cx="200" cy="200" r="22" class="green"/>
<text x="200" y="200" text-anchor="middle" dominant-baseline="middle" class="code">5</text>
<text x="234" y="200" text-anchor="middle" dominant-baseline="middle" class="small">h=1</text>
<text x="520" y="70" text-anchor="start" dominant-baseline="middle" class="code">base case: None → 0</text>
<text x="520" y="100" text-anchor="start" dominant-baseline="middle" class="small">height(4) = 1 + max(0, 0) = 1</text>
<text x="520" y="124" text-anchor="start" dominant-baseline="middle" class="small">height(2) = 1 + max(1, 1) = 2</text>
<text x="520" y="148" text-anchor="start" dominant-baseline="middle" class="small">height(1) = 1 + max(2, 1) = 3</text>
</svg>
<figcaption>Height of a node = 1 + the bigger height of its two children. Answers flow from the leaves up to the root.</figcaption>
</figure>
