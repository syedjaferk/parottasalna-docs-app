<figure class="diagram">
<svg class="dg" viewBox="0 0 720 290" role="img" aria-labelledby="lru-t lru-d" xmlns="http://www.w3.org/2000/svg">
<title id="lru-t">LRU cache = hash map + doubly linked list</title>
<desc id="lru-d">The map finds a node in O(1). The list keeps the order of use: most recent at the front, least recent at the back.</desc>
<defs><marker id="lru-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="lru-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="lru-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="lru-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="120" y="20" text-anchor="middle" dominant-baseline="middle" class="title">hash map</text>
<text x="480" y="20" text-anchor="middle" dominant-baseline="middle" class="title">doubly linked list (recent → old)</text>
<rect x="60" y="40" width="120" height="36" rx="10" class="blue"/>
<text x="120.0" y="58.0" text-anchor="middle" dominant-baseline="middle" class="code">A → node A</text>
<rect x="60" y="90" width="120" height="36" rx="10" class="green"/>
<text x="120.0" y="108.0" text-anchor="middle" dominant-baseline="middle" class="code">B → node B</text>
<rect x="60" y="140" width="120" height="36" rx="10" class="amber"/>
<text x="120.0" y="158.0" text-anchor="middle" dominant-baseline="middle" class="code">C → node C</text>
<rect x="330" y="80" width="70" height="40" rx="10" class="amber"/>
<text x="365.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">C</text>
<rect x="430" y="80" width="70" height="40" rx="10" class="blue"/>
<text x="465.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">A</text>
<path d="M400,92 L430,92" class="arrow" marker-end="url(#lru-h)"/>
<path d="M430,108 L400,108" class="arrow" marker-end="url(#lru-h)"/>
<rect x="530" y="80" width="70" height="40" rx="10" class="green"/>
<text x="565.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">B</text>
<path d="M500,92 L530,92" class="arrow" marker-end="url(#lru-h)"/>
<path d="M530,108 L500,108" class="arrow" marker-end="url(#lru-h)"/>
<text x="365" y="150" text-anchor="middle" dominant-baseline="middle" class="small">most recent</text>
<text x="565" y="150" text-anchor="middle" dominant-baseline="middle" class="small">evict me</text>
<text x="360" y="200" text-anchor="middle" dominant-baseline="middle" class="small">get(A): look up in map, move node A to the front</text>
<text x="360" y="225" text-anchor="middle" dominant-baseline="middle" class="small">put(D) when full: drop the back node (B), add D at the front</text>
<text x="360" y="255" text-anchor="middle" dominant-baseline="middle" class="bold">Both operations O(1)</text>
</svg>
<figcaption>The map finds a node in O(1). The list keeps the order of use: most recent at the front, least recent at the back.</figcaption>
</figure>
