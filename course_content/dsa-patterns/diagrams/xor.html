<figure class="diagram">
<svg class="dg" viewBox="0 0 720 290" role="img" aria-labelledby="xor-t xor-d" xmlns="http://www.w3.org/2000/svg">
<title id="xor-t">XOR cancels pairs</title>
<desc id="xor-d">a ^ a = 0 and a ^ 0 = a. XOR every number: the pairs cancel and the single one is left.</desc>
<defs><marker id="xor-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="xor-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="xor-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="xor-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="40" y="25" text-anchor="start" dominant-baseline="middle" class="code">numbers: 4, 1, 2, 1, 2</text>
<text x="40" y="60" text-anchor="start" dominant-baseline="middle" class="title">value</text>
<text x="140" y="60" text-anchor="start" dominant-baseline="middle" class="title">bits</text>
<text x="260" y="60" text-anchor="start" dominant-baseline="middle" class="title">running XOR</text>
<text x="40" y="84" text-anchor="start" dominant-baseline="middle" class="code">4</text>
<text x="140" y="84" text-anchor="start" dominant-baseline="middle" class="code">100</text>
<rect x="260" y="70" width="90" height="28" rx="10" class="box"/>
<text x="305.0" y="84.0" text-anchor="middle" dominant-baseline="middle" class="code">100  (4)</text>
<text x="40" y="122" text-anchor="start" dominant-baseline="middle" class="code">1</text>
<text x="140" y="122" text-anchor="start" dominant-baseline="middle" class="code">001</text>
<rect x="260" y="108" width="90" height="28" rx="10" class="box"/>
<text x="305.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="code">101  (5)</text>
<text x="40" y="160" text-anchor="start" dominant-baseline="middle" class="code">2</text>
<text x="140" y="160" text-anchor="start" dominant-baseline="middle" class="code">010</text>
<rect x="260" y="146" width="90" height="28" rx="10" class="box"/>
<text x="305.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="code">111  (7)</text>
<text x="40" y="198" text-anchor="start" dominant-baseline="middle" class="code">1</text>
<text x="140" y="198" text-anchor="start" dominant-baseline="middle" class="code">001</text>
<rect x="260" y="184" width="90" height="28" rx="10" class="box"/>
<text x="305.0" y="198.0" text-anchor="middle" dominant-baseline="middle" class="code">110  (6)</text>
<text x="40" y="236" text-anchor="start" dominant-baseline="middle" class="code">2</text>
<text x="140" y="236" text-anchor="start" dominant-baseline="middle" class="code">010</text>
<rect x="260" y="222" width="90" height="28" rx="10" class="green"/>
<text x="305.0" y="236.0" text-anchor="middle" dominant-baseline="middle" class="code">100  (4)</text>
<text x="400" y="150" text-anchor="start" dominant-baseline="middle" class="small">1 ^ 1 = 0 and 2 ^ 2 = 0 cancel out</text>
<text x="400" y="180" text-anchor="start" dominant-baseline="middle" class="bold">Only 4 survives → answer = 4</text>
</svg>
<figcaption>a ^ a = 0 and a ^ 0 = a. XOR every number: the pairs cancel and the single one is left.</figcaption>
</figure>
