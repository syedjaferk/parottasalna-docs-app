<figure class="diagram">
<svg class="dg" viewBox="0 0 720 270" role="img" aria-labelledby="hash-map-t hash-map-d" xmlns="http://www.w3.org/2000/svg">
<title id="hash-map-t">Hash map: remember what you have seen</title>
<desc id="hash-map-d">Two Sum with target 9: for each number ask the map whether its partner was already seen.</desc>
<defs><marker id="hash-map-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="hash-map-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="hash-map-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="hash-map-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="60" y="20" text-anchor="start" dominant-baseline="middle" class="title">nums</text>
<rect x="60" y="35" width="60" height="38" rx="10" class="blue"/>
<text x="90.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">2</text>
<rect x="126" y="35" width="60" height="38" rx="10" class="green"/>
<text x="156.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">7</text>
<rect x="192" y="35" width="60" height="38" rx="10" class="box"/>
<text x="222.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">11</text>
<rect x="258" y="35" width="60" height="38" rx="10" class="box"/>
<text x="288.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">15</text>
<text x="60" y="110" text-anchor="start" dominant-baseline="middle" class="small">step 1: x = 2 → need 7 → not in map → store {2: 0}</text>
<text x="60" y="135" text-anchor="start" dominant-baseline="middle" class="bold">step 2: x = 7 → need 2 → found at index 0 → answer [0, 1]</text>
<text x="400" y="20" text-anchor="start" dominant-baseline="middle" class="title">map (value → index)</text>
<rect x="400" y="35" width="80" height="38" rx="10" class="blue"/>
<text x="440.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">2 → 0</text>
<rect x="490" y="35" width="80" height="38" rx="10" class="ghost"/>
<text x="530.0" y="54.0" text-anchor="middle" dominant-baseline="middle" class="code">7 → 1</text>
<text x="60" y="185" text-anchor="start" dominant-baseline="middle" class="small">Without a map: compare every pair → O(n²).</text>
<text x="60" y="210" text-anchor="start" dominant-baseline="middle" class="small">With a map: one pass, one lookup each → O(n).</text>
</svg>
<figcaption>Two Sum with target 9: for each number ask the map whether its partner was already seen.</figcaption>
</figure>
