<figure class="diagram">
<svg class="dg" viewBox="0 0 720 300" role="img" aria-labelledby="mono-stack-t mono-stack-d" xmlns="http://www.w3.org/2000/svg">
<title id="mono-stack-t">Monotonic stack: next greater element</title>
<desc id="mono-stack-d">Temperatures 73, 74, 75, 71. The stack keeps indexes of days still waiting for a warmer day.</desc>
<defs><marker id="mono-stack-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="mono-stack-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="mono-stack-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="mono-stack-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="40" y="20" width="60" height="38" rx="10" class="box"/>
<text x="70.0" y="39.0" text-anchor="middle" dominant-baseline="middle" class="code">73</text>
<text x="70.0" y="72" text-anchor="middle" dominant-baseline="middle" class="small">0</text>
<rect x="106" y="20" width="60" height="38" rx="10" class="box"/>
<text x="136.0" y="39.0" text-anchor="middle" dominant-baseline="middle" class="code">74</text>
<text x="136.0" y="72" text-anchor="middle" dominant-baseline="middle" class="small">1</text>
<rect x="172" y="20" width="60" height="38" rx="10" class="box"/>
<text x="202.0" y="39.0" text-anchor="middle" dominant-baseline="middle" class="code">75</text>
<text x="202.0" y="72" text-anchor="middle" dominant-baseline="middle" class="small">2</text>
<rect x="238" y="20" width="60" height="38" rx="10" class="box"/>
<text x="268.0" y="39.0" text-anchor="middle" dominant-baseline="middle" class="code">71</text>
<text x="268.0" y="72" text-anchor="middle" dominant-baseline="middle" class="small">3</text>
<text x="330" y="20" text-anchor="start" dominant-baseline="middle" class="title">stack after each step (top on the right)</text>
<text x="330" y="56" text-anchor="start" dominant-baseline="middle" class="small">i=0 (73)</text>
<rect x="420" y="40" width="64" height="32" rx="10" class="blue"/>
<text x="452.0" y="56.0" text-anchor="middle" dominant-baseline="middle" class="code">0:73</text>
<text x="570" y="56" text-anchor="middle" dominant-baseline="middle" class="small"></text>
<text x="330" y="86" text-anchor="start" dominant-baseline="middle" class="small">push 0</text>
<text x="330" y="118" text-anchor="start" dominant-baseline="middle" class="small">i=1 (74)</text>
<rect x="420" y="102" width="64" height="32" rx="10" class="blue"/>
<text x="452.0" y="118.0" text-anchor="middle" dominant-baseline="middle" class="code">1:74</text>
<text x="570" y="118" text-anchor="middle" dominant-baseline="middle" class="small"></text>
<text x="330" y="148" text-anchor="start" dominant-baseline="middle" class="small">74 &gt; 73 → pop 0, answer for day 0 = 1</text>
<text x="330" y="180" text-anchor="start" dominant-baseline="middle" class="small">i=2 (75)</text>
<rect x="420" y="164" width="64" height="32" rx="10" class="blue"/>
<text x="452.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">2:75</text>
<text x="570" y="180" text-anchor="middle" dominant-baseline="middle" class="small"></text>
<text x="330" y="210" text-anchor="start" dominant-baseline="middle" class="small">75 &gt; 74 → pop 1, answer for day 1 = 1</text>
<text x="330" y="242" text-anchor="start" dominant-baseline="middle" class="small">i=3 (71)</text>
<rect x="420" y="226" width="64" height="32" rx="10" class="blue"/>
<text x="452.0" y="242.0" text-anchor="middle" dominant-baseline="middle" class="code">2:75</text>
<rect x="490" y="226" width="64" height="32" rx="10" class="blue"/>
<text x="522.0" y="242.0" text-anchor="middle" dominant-baseline="middle" class="code">3:71</text>
<text x="570" y="242" text-anchor="middle" dominant-baseline="middle" class="small"></text>
<text x="330" y="272" text-anchor="start" dominant-baseline="middle" class="small">71 &lt; 75 → just push</text>
</svg>
<figcaption>Temperatures 73, 74, 75, 71. The stack keeps indexes of days still waiting for a warmer day.</figcaption>
</figure>
