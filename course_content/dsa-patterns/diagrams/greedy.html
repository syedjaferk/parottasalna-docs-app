<rect x="95" y="30" width="110" height="22" rx="4" class="bar green"/>
<text x="215" y="41" text-anchor="start" dominant-baseline="middle" class="small">[1,3]</text>
<rect x="150" y="68" width="165" height="22" rx="4" class="bar dim"/>
<text x="325" y="79" text-anchor="start" dominant-baseline="middle" class="small">[2,5]</text>
<rect x="260" y="106" width="110" height="22" rx="4" class="bar green"/>
<text x="380" y="117" text-anchor="start" dominant-baseline="middle" class="small">[4,6]</text>
<rect x="315" y="144" width="165" height="22" rx="4" class="bar dim"/>
<text x="490" y="155" text-anchor="start" dominant-baseline="middle" class="small">[5,8]</text>
<rect x="370" y="182" width="165" height="22" rx="4" class="bar green"/>
<text x="545" y="193" text-anchor="start" dominant-baseline="middle" class="small">[6,9]</text>
<text x="40" y="240" text-anchor="start" dominant-baseline="middle" class="small">Sorted by end time. Take [1,3]; skip [2,5] (clashes); take [4,6]; skip [5,8]; take [6,9].</text>
