<figure class="diagram">
<svg class="dg" viewBox="0 0 760 270" role="img" aria-labelledby="image-container-t image-container-d" xmlns="http://www.w3.org/2000/svg">
<title id="image-container-t">One image, many containers</title>
<desc id="image-container-d">An image is a read-only template. Each container made from it gets its own writable layer, and changes there never touch the image.</desc>
<defs><marker id="image-container-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="image-container-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="image-container-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="image-container-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="90" width="200" height="90" rx="10" class="green"/>
<text x="120.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="bold">Image</text>
<text x="120.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="code">alpine (read-only)</text>
<rect x="400" y="20" width="200" height="60" rx="10" class="blue"/>
<text x="500.0" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">Container dm-a</text>
<text x="500.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">writable layer</text>
<path d="M222,135 L398,50" class="arrow blue" marker-end="url(#image-container-h-blue)"/>
<rect x="400" y="100" width="200" height="60" rx="10" class="blue"/>
<text x="500.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="bold">Container dm-b</text>
<text x="500.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">writable layer</text>
<path d="M222,135 L398,130" class="arrow blue" marker-end="url(#image-container-h-blue)"/>
<rect x="400" y="180" width="200" height="60" rx="10" class="blue"/>
<text x="500.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="bold">Container dm-c</text>
<text x="500.0" y="220.0" text-anchor="middle" dominant-baseline="middle" class="small">writable layer</text>
<path d="M222,135 L398,210" class="arrow blue" marker-end="url(#image-container-h-blue)"/>
<text x="620" y="130" text-anchor="start" dominant-baseline="middle" class="code">docker run</text>
<text x="380" y="255" text-anchor="middle" dominant-baseline="middle" class="small">delete the container and its writable layer goes too</text>
</svg>
<figcaption>An image is a read-only template. Each container made from it gets its own writable layer, and changes there never touch the image.</figcaption>
</figure>
