<figure class="diagram">
<svg class="dg" viewBox="0 0 760 230" role="img" aria-labelledby="port-map-t port-map-d" xmlns="http://www.w3.org/2000/svg">
<title id="port-map-t">Publishing a port</title>
<desc id="port-map-d">-p 8088:80 sends traffic arriving at port 8088 on your machine to port 80 inside the container.</desc>
<defs><marker id="port-map-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="port-map-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="port-map-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="port-map-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="70" width="160" height="80" rx="10" class="blue"/>
<text x="100.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="bold">Browser / curl</text>
<text x="100.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="code">localhost:8088</text>
<rect x="280" y="50" width="460" height="120" rx="10" class="ghost"/>
<text x="510.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">Host</text>
<rect x="320" y="90" width="130" height="60" rx="10" class="amber"/>
<text x="385.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">host port</text>
<text x="385.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="code">8088</text>
<rect x="540" y="90" width="160" height="60" rx="10" class="green"/>
<text x="620.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">container</text>
<text x="620.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="code">nginx on 80</text>
<path d="M182,110 L318,120" class="arrow blue" marker-end="url(#port-map-h-blue)"/>
<path d="M452,120 L538,120" class="arrow green" marker-end="url(#port-map-h-green)"/>
<text x="495" y="102" text-anchor="middle" dominant-baseline="middle" class="small">-p 8088:80</text>
