<svg class="dg" viewBox="0 0 760 300" role="img" aria-labelledby="vm-vs-container-t vm-vs-container-d" xmlns="http://www.w3.org/2000/svg">
<title id="vm-vs-container-t">Virtual machines versus containers</title>
<desc id="vm-vs-container-d">Each virtual machine carries its own operating system. Containers share the host&#x27;s kernel, so they are smaller and start faster.</desc>
<defs><marker id="vm-vs-container-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="vm-vs-container-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="vm-vs-container-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="vm-vs-container-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="15" width="340" height="34" rx="10" class="amber"/>
<text x="190.0" y="32.0" text-anchor="middle" dominant-baseline="middle" class="bold">Virtual machines</text>
<rect x="20" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="70.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App A</text>
<text x="70.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="130" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="180.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App B</text>
<text x="180.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="240" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="290.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App C</text>
<text x="290.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="20" y="126" width="100" height="34" rx="10" class="red"/>
<text x="70.0" y="143.0" text-anchor="middle" dominant-baseline="middle" class="small">Guest OS</text>
<rect x="130" y="126" width="100" height="34" rx="10" class="red"/>
<text x="180.0" y="143.0" text-anchor="middle" dominant-baseline="middle" class="small">Guest OS</text>
<rect x="240" y="126" width="100" height="34" rx="10" class="red"/>
<text x="290.0" y="143.0" text-anchor="middle" dominant-baseline="middle" class="small">Guest OS</text>
<rect x="20" y="166" width="320" height="34" rx="10" class="box"/>
<text x="180.0" y="183.0" text-anchor="middle" dominant-baseline="middle" class="bold">Hypervisor</text>
<rect x="20" y="206" width="320" height="34" rx="10" class="ghost"/>
<text x="180.0" y="223.0" text-anchor="middle" dominant-baseline="middle" class="bold">Host OS + hardware</text>
<rect x="400" y="15" width="340" height="34" rx="10" class="green"/>
<text x="570.0" y="32.0" text-anchor="middle" dominant-baseline="middle" class="bold">Containers</text>
<rect x="400" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="450.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App A</text>
<text x="450.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="510" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="560.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App B</text>
<text x="560.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="620" y="60" width="100" height="60" rx="10" class="blue"/>
<text x="670.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">App C</text>
<text x="670.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">+ libs</text>
<rect x="400" y="126" width="320" height="34" rx="10" class="green"/>
<text x="560.0" y="143.0" text-anchor="middle" dominant-baseline="middle" class="bold">Docker Engine</text>
<rect x="400" y="166" width="320" height="34" rx="10" class="box"/>

<text x="190" y="275" text-anchor="middle" dominant-baseline="middle" class="small">heavy: gigabytes, minutes to boot</text>
<text x="560" y="275" text-anchor="middle" dominant-baseline="middle" class="small">light: megabytes, about a second to start</text>
</svg>
<figcaption>Each virtual machine carries its own operating system. Containers share the host&#x27;s kernel, so they are smaller and start faster.</figcaption>
</figure>
