<desc id="git-concepts-d">Your computer has a repository with commits and branches. A remote repository is a copy on a server; clone, push and pull move commits between them.</desc>
<defs><marker id="git-concepts-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="git-concepts-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="git-concepts-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="git-concepts-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>

<rect x="40" y="85" width="300" height="50" rx="10" class="green"/>

<text x="610.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">Remote repository</text>

<path d="M342,100 L478,100" class="arrow blue" marker-end="url(#git-concepts-h-blue)"/>
<text x="410" y="82" text-anchor="middle" dominant-baseline="middle" class="small">push</text>
