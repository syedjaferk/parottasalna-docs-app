<figure class="diagram">
<svg class="dg" viewBox="0 0 760 230" role="img" aria-labelledby="vcs-generations-t vcs-generations-d" xmlns="http://www.w3.org/2000/svg">
<title id="vcs-generations-t">Three generations of version control</title>
<desc id="vcs-generations-d">Local tools (RCS) kept history on one computer. Central servers (CVS, Subversion) shared it. Distributed tools (Git) give everyone the full history.</desc>
<defs><marker id="vcs-generations-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="vcs-generations-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="vcs-generations-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="vcs-generations-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="220" height="130" rx="10" class="amber"/>
<text x="130.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Local</text>
<text x="130.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">RCS</text>
<text x="130.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">history on one computer</text>
<rect x="265" y="30" width="220" height="130" rx="10" class="blue"/>
<text x="375.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Centralized</text>
<text x="375.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">CVS · Subversion</text>
<text x="375.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">one server, everyone connects</text>
<path d="M243,95 L263,95" class="arrow blue" marker-end="url(#vcs-generations-h-blue)"/>
<rect x="510" y="30" width="220" height="130" rx="10" class="green"/>
<text x="620.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Distributed</text>
<text x="620.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">Git · Mercurial</text>
<text x="620.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">everyone has the full history</text>
<path d="M488,95 L508,95" class="arrow blue" marker-end="url(#vcs-generations-h-blue)"/>
<text x="380" y="195" text-anchor="middle" dominant-baseline="middle" class="small">each step fixed a weakness of the one before</text>
</svg>
<figcaption>Local tools (RCS) kept history on one computer. Central servers (CVS, Subversion) shared it. Distributed tools (Git) give everyone the full history.</figcaption>
</figure>
