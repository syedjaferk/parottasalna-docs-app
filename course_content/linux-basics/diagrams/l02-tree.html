<figure class="diagram">
<svg class="dg" viewBox="0 0 720 300" role="img" aria-labelledby="l02-tree-t l02-tree-d" xmlns="http://www.w3.org/2000/svg">
<title id="l02-tree-t">The Linux file tree</title>
<desc id="l02-tree-d">One tree starting at / (root). Your files live under /home; settings under /etc; logs under /var/log.</desc>
<defs><marker id="l02-tree-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l02-tree-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l02-tree-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l02-tree-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="310" y="10" width="100" height="36" rx="10" class="blue"/>
<text x="360.0" y="28.0" text-anchor="middle" dominant-baseline="middle" class="bold">/</text>
<rect x="20" y="90" width="105" height="50" rx="10" class="box"/>
<text x="72.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/home</text>
<text x="72.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">your files</text>
<path d="M360,46 L72,88" class="arrow blue"/>
<rect x="135" y="90" width="105" height="50" rx="10" class="box"/>
<text x="187.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/etc</text>
<text x="187.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">settings</text>
<path d="M360,46 L187,88" class="arrow blue"/>
<rect x="250" y="90" width="105" height="50" rx="10" class="box"/>
<text x="302.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/var</text>
<text x="302.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">logs, data</text>
<path d="M360,46 L302,88" class="arrow blue"/>
<rect x="365" y="90" width="105" height="50" rx="10" class="box"/>
<text x="417.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/usr</text>
<text x="417.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">programs</text>
<path d="M360,46 L417,88" class="arrow blue"/>
<rect x="480" y="90" width="105" height="50" rx="10" class="box"/>
<text x="532.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/tmp</text>
<text x="532.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">temporary</text>
<path d="M360,46 L532,88" class="arrow blue"/>
<rect x="595" y="90" width="105" height="50" rx="10" class="box"/>
<text x="647.5" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">/dev</text>
<text x="647.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">devices</text>
<path d="M360,46 L647,88" class="arrow blue"/>
<rect x="20" y="190" width="105" height="36" rx="10" class="green"/>
<text x="72.5" y="208.0" text-anchor="middle" dominant-baseline="middle" class="code">asha</text>
<path d="M72,140 L72,188" class="arrow blue"/>
<rect x="20" y="245" width="105" height="40" rx="10" class="amber"/>
<text x="72.5" y="265.0" text-anchor="middle" dominant-baseline="middle" class="code">linux-lab</text>
<path d="M72,226 L72,243" class="arrow blue"/>
<rect x="250" y="190" width="105" height="36" rx="10" class="ghost"/>
<text x="302.5" y="208.0" text-anchor="middle" dominant-baseline="middle" class="code">/var/log</text>
<path d="M302,140 L302,188" class="arrow blue"/>
<text x="480" y="215" text-anchor="middle" dominant-baseline="middle" class="small">no C: or D: drives: everything is in one tree</text>
</svg>
<figcaption>One tree starting at / (root). Your files live under /home; settings under /etc; logs under /var/log.</figcaption>
</figure>
