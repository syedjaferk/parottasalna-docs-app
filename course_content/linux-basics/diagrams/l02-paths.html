<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="l02-paths-t l02-paths-d" xmlns="http://www.w3.org/2000/svg">
<title id="l02-paths-t">Absolute and relative paths</title>
<desc id="l02-paths-d">An absolute path starts at / and works from anywhere. A relative path starts from where you are now.</desc>
<defs><marker id="l02-paths-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l02-paths-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l02-paths-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l02-paths-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="330" height="90" rx="10" class="blue"/>
<text x="185.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="title">ABSOLUTE</text>
<text x="185.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">/home/asha/linux-lab/data/fruits.txt</text>
<text x="185.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">works from anywhere</text>
<rect x="370" y="20" width="330" height="90" rx="10" class="green"/>
<text x="535.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="title">RELATIVE (from ~/linux-lab)</text>
<text x="535.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">data/fruits.txt</text>
<text x="535.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">depends on where you are</text>
<text x="360" y="140" text-anchor="middle" dominant-baseline="middle" class="title">Shortcuts</text>
<rect x="20" y="160" width="125" height="60" rx="10" class="amber"/>
<text x="82.5" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">.</text>
<text x="82.5" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">here</text>
<rect x="160" y="160" width="125" height="60" rx="10" class="amber"/>
<text x="222.5" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">..</text>
<text x="222.5" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">parent folder</text>
<rect x="300" y="160" width="125" height="60" rx="10" class="amber"/>
<text x="362.5" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">~</text>
<text x="362.5" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">home</text>
<rect x="440" y="160" width="125" height="60" rx="10" class="amber"/>
<text x="502.5" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">-</text>
<text x="502.5" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">previous folder</text>
<rect x="580" y="160" width="125" height="60" rx="10" class="amber"/>
<text x="642.5" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">/</text>
<text x="642.5" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">root</text>
</svg>
<figcaption>An absolute path starts at / and works from anywhere. A relative path starts from where you are now.</figcaption>
</figure>
