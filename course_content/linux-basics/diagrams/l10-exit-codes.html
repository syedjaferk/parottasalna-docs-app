<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="l10-exit-codes-t l10-exit-codes-d" xmlns="http://www.w3.org/2000/svg">
<title id="l10-exit-codes-t">if and exit codes</title>
<desc id="l10-exit-codes-d">Every command returns an exit code: 0 means success, anything else means failure. if uses it to decide.</desc>
<defs><marker id="l10-exit-codes-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l10-exit-codes-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l10-exit-codes-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l10-exit-codes-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="80" width="150" height="60" rx="10" class="blue"/>
<text x="95.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">run a command</text>
<rect x="240" y="80" width="150" height="60" rx="10" class="amber"/>
<text x="315.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="bold">exit code?</text>
<text x="315.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="code">$?</text>
<path d="M170,110 L238,110" class="arrow blue" marker-end="url(#l10-exit-codes-h-blue)"/>
<rect x="480" y="25" width="220" height="56" rx="10" class="green"/>
<text x="590.0" y="43.0" text-anchor="middle" dominant-baseline="middle" class="bold">0 → success</text>
<text x="590.0" y="63.0" text-anchor="middle" dominant-baseline="middle" class="small">then-branch runs</text>
<rect x="480" y="140" width="220" height="56" rx="10" class="red"/>
<text x="590.0" y="158.0" text-anchor="middle" dominant-baseline="middle" class="bold">not 0 → failure</text>
<text x="590.0" y="178.0" text-anchor="middle" dominant-baseline="middle" class="small">else-branch / exit 1</text>
<path d="M390,95 L478,55" class="arrow green" marker-end="url(#l10-exit-codes-h-green)"/>
<path d="M390,125 L478,168" class="arrow red" marker-end="url(#l10-exit-codes-h-red)"/>
</svg>
<figcaption>Every command returns an exit code: 0 means success, anything else means failure. if uses it to decide.</figcaption>
</figure>
