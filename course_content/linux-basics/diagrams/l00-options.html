<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="l00-options-t l00-options-d" xmlns="http://www.w3.org/2000/svg">
<title id="l00-options-t">Four ways to get a Linux terminal</title>
<desc id="l00-options-d">WSL on Windows, the built-in terminal on Linux and macOS, a virtual machine, or Docker.</desc>
<defs><marker id="l00-options-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l00-options-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l00-options-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l00-options-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="40" width="160" height="100" rx="10" class="blue"/>
<text x="95.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Windows</text>
<text x="95.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">WSL: wsl --install</text>
<rect x="193" y="40" width="160" height="100" rx="10" class="green"/>
<text x="273.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Linux / macOS</text>
<text x="273.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">open Terminal</text>
<rect x="371" y="40" width="160" height="100" rx="10" class="amber"/>
<text x="451.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Any computer</text>
<text x="451.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">VirtualBox + Ubuntu</text>
<rect x="549" y="40" width="160" height="100" rx="10" class="ghost"/>
<text x="629.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Docker</text>
<text x="629.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">docker run -it ubuntu</text>
<text x="360" y="175" text-anchor="middle" dominant-baseline="middle" class="small">All give you the same bash terminal and the same commands</text>
