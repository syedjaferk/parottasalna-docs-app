<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="l10-script-flow-t l10-script-flow-d" xmlns="http://www.w3.org/2000/svg">
<title id="l10-script-flow-t">From idea to script</title>
<desc id="l10-script-flow-d">Type the commands in a file, add the shebang line, make it executable, then run it.</desc>
<defs><marker id="l10-script-flow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l10-script-flow-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l10-script-flow-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l10-script-flow-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="60" width="160" height="70" rx="10" class="blue"/>
<text x="95.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 Write</text>
<text x="95.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">nano script.sh</text>
<path d="M175,95 L191,95" class="arrow blue" marker-end="url(#l10-script-flow-h-blue)"/>
<rect x="193" y="60" width="160" height="70" rx="10" class="amber"/>
<text x="273.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 Shebang</text>
<text x="273.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">first line</text>
<path d="M353,95 L369,95" class="arrow blue" marker-end="url(#l10-script-flow-h-blue)"/>
<rect x="371" y="60" width="160" height="70" rx="10" class="green"/>
<text x="451.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 chmod +x</text>
<text x="451.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">make executable</text>
<path d="M531,95 L547,95" class="arrow blue" marker-end="url(#l10-script-flow-h-blue)"/>
<rect x="549" y="60" width="160" height="70" rx="10" class="ghost"/>
<text x="629.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 Run</text>
<text x="629.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="code">./script.sh</text>
<text x="360" y="175" text-anchor="middle" dominant-baseline="middle" class="small">Later: schedule it with cron</text>
