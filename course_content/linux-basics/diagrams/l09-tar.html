<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="l09-tar-t l09-tar-d" xmlns="http://www.w3.org/2000/svg">
<title id="l09-tar-t">tar: bundle and compress</title>
<desc id="l09-tar-d">tar -czf creates a compressed archive; tar -tzf lists it; tar -xzf extracts it.</desc>
<defs><marker id="l09-tar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l09-tar-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l09-tar-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l09-tar-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="50" width="160" height="70" rx="10" class="blue"/>
<text x="100.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">folder</text>
<text x="100.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">docs/  data/</text>
<path d="M180,85 L270,85" class="arrow green" marker-end="url(#l09-tar-h-green)"/>
<text x="225" y="70" text-anchor="middle" dominant-baseline="middle" class="small">tar -czf</text>
<rect x="270" y="50" width="180" height="70" rx="10" class="amber"/>
<text x="360.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="code">archive.tar.gz</text>
<text x="360.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">one small file</text>
<path d="M450,85 L540,85" class="arrow green" marker-end="url(#l09-tar-h-green)"/>
<text x="495" y="70" text-anchor="middle" dominant-baseline="middle" class="small">tar -xzf</text>
<rect x="540" y="50" width="160" height="70" rx="10" class="blue"/>
<text x="620.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">folder again</text>
<text x="620.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">docs/  data/</text>
<text x="360" y="160" text-anchor="middle" dominant-baseline="middle" class="small">c = create · x = extract · t = test/list · z = gzip · f = file name</text>
</svg>
<figcaption>tar -czf creates a compressed archive; tar -tzf lists it; tar -xzf extracts it.</figcaption>
</figure>
