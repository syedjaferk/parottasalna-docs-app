<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="l03-copy-move-t l03-copy-move-d" xmlns="http://www.w3.org/2000/svg">
<title id="l03-copy-move-t">cp, mv and rm</title>
<desc id="l03-copy-move-d">cp leaves the original and makes a copy; mv moves or renames (the original disappears); rm deletes for good.</desc>
<defs><marker id="l03-copy-move-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l03-copy-move-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l03-copy-move-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l03-copy-move-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="125" y="18" text-anchor="middle" dominant-baseline="middle" class="code">cp a.txt b.txt</text>
<rect x="20" y="30" width="100" height="40" rx="10" class="box"/>
<text x="70.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">a.txt</text>
<path d="M120,50 L150,50" class="arrow blue" marker-end="url(#l03-copy-move-h-blue)"/>
<rect x="152" y="30" width="80" height="40" rx="10" class="blue"/>
<text x="192.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">b.txt</text>
<text x="125" y="100" text-anchor="middle" dominant-baseline="middle" class="small">before: a.txt</text>
<rect x="20" y="120" width="210" height="40" rx="10" class="blue"/>
<text x="125.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">after: a.txt AND b.txt</text>
<text x="125" y="190" text-anchor="middle" dominant-baseline="middle" class="small">copy</text>
<text x="360" y="18" text-anchor="middle" dominant-baseline="middle" class="code">mv a.txt b.txt</text>
<rect x="255" y="30" width="100" height="40" rx="10" class="ghost"/>
<text x="305.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">a.txt</text>
<path d="M355,50 L385,50" class="arrow green" marker-end="url(#l03-copy-move-h-green)"/>
<rect x="387" y="30" width="80" height="40" rx="10" class="green"/>
<text x="427.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">b.txt</text>
<text x="360" y="100" text-anchor="middle" dominant-baseline="middle" class="small">before: a.txt</text>
<rect x="255" y="120" width="210" height="40" rx="10" class="green"/>
<text x="360.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">after: only b.txt</text>
<text x="360" y="190" text-anchor="middle" dominant-baseline="middle" class="small">move / rename</text>
<text x="595" y="18" text-anchor="middle" dominant-baseline="middle" class="code">rm a.txt</text>
<rect x="490" y="30" width="100" height="40" rx="10" class="ghost"/>
<text x="540.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">a.txt</text>
<path d="M590,50 L620,50" class="arrow red" marker-end="url(#l03-copy-move-h-red)"/>
<rect x="622" y="30" width="80" height="40" rx="10" class="ghost"/>
<text x="662.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="small">(gone)</text>
<text x="595" y="100" text-anchor="middle" dominant-baseline="middle" class="small">before: a.txt</text>
<rect x="490" y="120" width="210" height="40" rx="10" class="red"/>
<text x="595.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">after: nothing</text>
<text x="595" y="190" text-anchor="middle" dominant-baseline="middle" class="small">delete (no undo)</text>
<text x="360" y="230" text-anchor="middle" dominant-baseline="middle" class="small">cp -r and rm -r work on whole folders (r = recursive)</text>
</svg>
<figcaption>cp leaves the original and makes a copy; mv moves or renames (the original disappears); rm deletes for good.</figcaption>
</figure>
