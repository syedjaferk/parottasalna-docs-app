<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="l06-find-grep-t l06-find-grep-d" xmlns="http://www.w3.org/2000/svg">
<title id="l06-find-grep-t">find vs grep</title>
<desc id="l06-find-grep-d">find searches by what a file is called or looks like; grep searches inside files for text.</desc>
<defs><marker id="l06-find-grep-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l06-find-grep-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l06-find-grep-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l06-find-grep-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="330" height="120" rx="10" class="blue"/>
<text x="185.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">find</text>
<text x="185.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="bold">by NAME · TYPE · SIZE · AGE</text>
<text x="185.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">find . -name &#x27;*.log&#x27; -mtime -7</text>
<rect x="370" y="30" width="330" height="120" rx="10" class="green"/>
<text x="535.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">grep -r</text>
<text x="535.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="bold">by CONTENT</text>
<text x="535.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">grep -rl &#x27;ERROR&#x27; .</text>
<text x="360" y="185" text-anchor="middle" dominant-baseline="middle" class="code">Combine: find . -name &#x27;*.log&#x27; | xargs grep ERROR</text>
</svg>
<figcaption>find searches by what a file is called or looks like; grep searches inside files for text.</figcaption>
</figure>
