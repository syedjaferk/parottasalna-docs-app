<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="l08-signals-t l08-signals-d" xmlns="http://www.w3.org/2000/svg">
<title id="l08-signals-t">Signals</title>
<desc id="l08-signals-d">kill sends a signal: TERM asks politely, KILL forces, STOP pauses and CONT resumes.</desc>
<defs><marker id="l08-signals-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l08-signals-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l08-signals-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l08-signals-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="40" width="160" height="100" rx="10" class="green"/>
<text x="95.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">kill PID</text>
<text x="95.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">TERM (15): please stop</text>
<rect x="193" y="40" width="160" height="100" rx="10" class="red"/>
<text x="273.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">kill -9 PID</text>
<text x="273.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">KILL (9): stop NOW</text>
<rect x="371" y="40" width="160" height="100" rx="10" class="amber"/>
<text x="451.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">Ctrl + C</text>
<text x="451.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">INT: interrupt</text>
<rect x="549" y="40" width="160" height="100" rx="10" class="blue"/>
<text x="629.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">Ctrl + Z</text>
<text x="629.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">STOP: pause</text>
<text x="360" y="180" text-anchor="middle" dominant-baseline="middle" class="small">Try the polite one first. Use -9 only as a last resort.</text>
</svg>
<figcaption>kill sends a signal: TERM asks politely, KILL forces, STOP pauses and CONT resumes.</figcaption>
</figure>
