<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="l08-cron-t l08-cron-d" xmlns="http://www.w3.org/2000/svg">
<title id="l08-cron-t">A cron schedule line</title>
<desc id="l08-cron-d">Five time fields (minute, hour, day of month, month, day of week) then the command.</desc>
<defs><marker id="l08-cron-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l08-cron-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l08-cron-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l08-cron-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="70.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">30</text>
<text x="70" y="110" text-anchor="middle" dominant-baseline="middle" class="small">minute</text>
<rect x="130" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="180.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">2</text>
<text x="180" y="110" text-anchor="middle" dominant-baseline="middle" class="small">hour</text>
<rect x="240" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="290.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">*</text>
<text x="290" y="110" text-anchor="middle" dominant-baseline="middle" class="small">day of month</text>
<rect x="350" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="400.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">*</text>
<text x="400" y="110" text-anchor="middle" dominant-baseline="middle" class="small">month</text>
<rect x="460" y="40" width="100" height="50" rx="10" class="blue"/>
<text x="510.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">*</text>
<text x="510" y="110" text-anchor="middle" dominant-baseline="middle" class="small">day of week</text>
<rect x="580" y="40" width="120" height="50" rx="10" class="green"/>
<text x="640.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">command</text>
<text x="360" y="160" text-anchor="middle" dominant-baseline="middle" class="bold">30 2 * * *  → every day at 02:30</text>
</svg>
<figcaption>Five time fields (minute, hour, day of month, month, day of week) then the command.</figcaption>
</figure>
