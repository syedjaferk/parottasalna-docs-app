<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="l05-pipe-t l05-pipe-d" xmlns="http://www.w3.org/2000/svg">
<title id="l05-pipe-t">The pipe</title>
<desc id="l05-pipe-d">The pipe connects the output of one command to the input of the next, like an assembly line.</desc>
<defs><marker id="l05-pipe-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l05-pipe-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l05-pipe-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l05-pipe-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="60" width="130" height="56" rx="10" class="blue"/>
<text x="80.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">cat access.log</text>
<text x="80.0" y="98.0" text-anchor="middle" dominant-baseline="middle" class="small">read</text>
<path d="M145,88 L191,88" class="arrow blue" marker-end="url(#l05-pipe-h-blue)"/>
<text x="168" y="74" text-anchor="middle" dominant-baseline="middle" class="small">|</text>
<rect x="193" y="60" width="130" height="56" rx="10" class="green"/>
<text x="258.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">grep &#x27; 404 &#x27;</text>
<text x="258.0" y="98.0" text-anchor="middle" dominant-baseline="middle" class="small">filter</text>
<path d="M323,88 L369,88" class="arrow blue" marker-end="url(#l05-pipe-h-blue)"/>
<text x="346" y="74" text-anchor="middle" dominant-baseline="middle" class="small">|</text>
<rect x="371" y="60" width="130" height="56" rx="10" class="amber"/>
<text x="436.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">sort | uniq -c</text>
<text x="436.0" y="98.0" text-anchor="middle" dominant-baseline="middle" class="small">count</text>
<path d="M501,88 L547,88" class="arrow blue" marker-end="url(#l05-pipe-h-blue)"/>
<text x="524" y="74" text-anchor="middle" dominant-baseline="middle" class="small">|</text>
<rect x="549" y="60" width="130" height="56" rx="10" class="ghost"/>
<text x="614.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">head -n 3</text>
<text x="614.0" y="98.0" text-anchor="middle" dominant-baseline="middle" class="small">top 3</text>
<text x="360" y="160" text-anchor="middle" dominant-baseline="middle" class="small">small tools, one job each, chained together</text>
</svg>
<figcaption>The pipe connects the output of one command to the input of the next, like an assembly line.</figcaption>
</figure>
