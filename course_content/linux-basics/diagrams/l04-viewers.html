<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="l04-viewers-t l04-viewers-d" xmlns="http://www.w3.org/2000/svg">
<title id="l04-viewers-t">Choosing a file viewer</title>
<desc id="l04-viewers-d">cat shows everything, less shows page by page, head the first lines, tail the last lines (tail -f follows).</desc>
<defs><marker id="l04-viewers-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l04-viewers-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l04-viewers-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l04-viewers-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="30" width="160" height="110" rx="10" class="blue"/>
<text x="95.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">cat</text>
<text x="95.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">whole file</text>
<text x="95.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">short files</text>
<rect x="193" y="30" width="160" height="110" rx="10" class="green"/>
<text x="273.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">less</text>
<text x="273.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">page by page</text>
<text x="273.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">long files (q quits)</text>
<rect x="371" y="30" width="160" height="110" rx="10" class="amber"/>
<text x="451.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">head</text>
<text x="451.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">first lines</text>
<text x="451.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">peek at the start</text>
<rect x="549" y="30" width="160" height="110" rx="10" class="amber"/>
<text x="629.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="code">tail</text>
<text x="629.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">last lines</text>
<text x="629.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">-f follows a live log</text>
<text x="360" y="180" text-anchor="middle" dominant-baseline="middle" class="small">Count with wc -l · identify with file · edit with nano</text>
</svg>
<figcaption>cat shows everything, less shows page by page, head the first lines, tail the last lines (tail -f follows).</figcaption>
</figure>
