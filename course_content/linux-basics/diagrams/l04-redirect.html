<rect x="20" y="40" width="150" height="50" rx="10" class="blue"/>

<text x="235" y="40" text-anchor="middle" dominant-baseline="middle" class="small">&gt;  overwrite</text>

<rect x="300" y="40" width="150" height="50" rx="10" class="box"/>
