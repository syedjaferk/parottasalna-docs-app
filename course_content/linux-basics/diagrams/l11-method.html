<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="l11-method-t l11-method-d" xmlns="http://www.w3.org/2000/svg">
<title id="l11-method-t">A calm troubleshooting method</title>
<desc id="l11-method-d">Describe the problem, check the vital signs, read the logs, test one idea, then confirm and write it down.</desc>
<defs><marker id="l11-method-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="l11-method-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="l11-method-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="l11-method-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="60" width="128" height="70" rx="10" class="ghost"/>
<text x="74.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 Describe</text>
<text x="74.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">what, since when?</text>
<path d="M138,95 L150,95" class="arrow blue" marker-end="url(#l11-method-h-blue)"/>
<rect x="152" y="60" width="128" height="70" rx="10" class="blue"/>
<text x="216.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 Vital signs</text>
<text x="216.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">df · free · top</text>
<path d="M280,95 L292,95" class="arrow blue" marker-end="url(#l11-method-h-blue)"/>
<rect x="294" y="60" width="128" height="70" rx="10" class="green"/>
<text x="358.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 Logs</text>
<text x="358.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">journalctl · tail</text>
<path d="M422,95 L434,95" class="arrow blue" marker-end="url(#l11-method-h-blue)"/>
<rect x="436" y="60" width="128" height="70" rx="10" class="amber"/>
<text x="500.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 One change</text>
<text x="500.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">test one idea</text>
<path d="M564,95 L576,95" class="arrow blue" marker-end="url(#l11-method-h-blue)"/>
<rect x="578" y="60" width="128" height="70" rx="10" class="ghost"/>
<text x="642.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="bold">5 Confirm</text>
<text x="642.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">note the cause</text>
<text x="360" y="175" text-anchor="middle" dominant-baseline="middle" class="small">read the whole error · change one thing at a time · copy before editing</text>
</svg>
<figcaption>Describe the problem, check the vital signs, read the logs, test one idea, then confirm and write it down.</figcaption>
</figure>
