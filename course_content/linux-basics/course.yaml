title: Linux Basics
description: The Linux commands every beginner needs, taught by doing. Learn the terminal, files and folders, text processing with pipes, finding things, permissions, processes, packages and networking. Then write shell scripts and troubleshoot logs and disks. Includes a ready-made practice lab, tryouts that a checker script marks for you, quizzes in every session and a timed final exam.
common: false

level: beginner
hours: 12
audience: Beginners who want to feel at home in the Linux terminal.
outcomes:
- Navigate and edit files
- Manage permissions and processes
- Write simple shell scripts
