<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s04-cgroups-t s04-cgroups-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-cgroups-t">cgroups: how much a container is allowed to use</title>
<desc id="s04-cgroups-d">Namespaces limit what a container can see; cgroups limit how much CPU and memory it can use. Go over the memory limit and the kernel&#x27;s OOM killer stops it.</desc>
<defs><marker id="s04-cgroups-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-cgroups-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-cgroups-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-cgroups-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="15" width="200" height="70" rx="10" class="blue"/>
<text x="120.0" y="30.0" text-anchor="middle" dominant-baseline="middle">docker run</text>
<text x="120.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">--memory=100m</text>
<text x="120.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">--cpus=0.5</text>
<path d="M220,50 L268,50" class="arrow" marker-end="url(#s04-cgroups-h)"/>
<rect x="270" y="15" width="180" height="70" rx="10" class="purple"/>
<text x="360.0" y="30.0" text-anchor="middle" dominant-baseline="middle">cgroup</text>
<text x="360.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">memory.max = 100 MB</text>
<text x="360.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">cpu.max = half a CPU</text>
<path d="M450,50 L498,50" class="arrow" marker-end="url(#s04-cgroups-h)"/>
<rect x="500" y="20" width="200" height="60" rx="10" class="green"/>
<text x="600.0" y="40.0" text-anchor="middle" dominant-baseline="middle">Container</text>
<text x="600.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">its processes</text>
<text x="360" y="115" text-anchor="middle" dominant-baseline="middle" class="small">If the container tries to use more than 100 MB:</text>
<rect x="110" y="140" width="160" height="50" rx="10" class="amber"/>
<text x="190.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Kernel OOM killer</text>
<text x="190.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="small">picks the process</text>
<path d="M270,165 L318,165" class="arrow red" marker-end="url(#s04-cgroups-h-red)"/>
<rect x="320" y="140" width="140" height="50" rx="10" class="red"/>
<text x="390.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="bold">SIGKILL</text>
<path d="M460,165 L508,165" class="arrow red" marker-end="url(#s04-cgroups-h-red)"/>
<rect x="510" y="140" width="190" height="50" rx="10" class="red"/>
<text x="605.0" y="155.0" text-anchor="middle" dominant-baseline="middle">Exited (137)</text>
<text x="605.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="code">OOMKilled = true</text>
</svg>
<figcaption>Namespaces limit what a container can see; cgroups limit how much CPU and memory it can use. Go over the memory limit and the kernel&#x27;s OOM killer stops it.</figcaption>
</figure>
