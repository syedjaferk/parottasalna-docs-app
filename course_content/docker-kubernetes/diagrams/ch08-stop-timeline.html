<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="ch08-stop-timeline-t ch08-stop-timeline-d" xmlns="http://www.w3.org/2000/svg">
<title id="ch08-stop-timeline-t">What docker stop does, second by second</title>
<desc id="ch08-stop-timeline-d">SIGTERM is a polite request. Docker waits (10 seconds by default), then sends SIGKILL, which cannot be caught.</desc>
<defs><marker id="ch08-stop-timeline-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ch08-stop-timeline-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="ch08-stop-timeline-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="ch08-stop-timeline-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<line x1="60" y1="118" x2="690" y2="118" class="line"/>
<circle cx="60" cy="118" r="7" class="blue"/>
<circle cx="560" cy="118" r="7" class="red"/>
<rect x="10" y="20" width="170" height="56" rx="10" class="blue"/>
<text x="95.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="code">docker stop</text>
<text x="95.0" y="58.0" text-anchor="middle" dominant-baseline="middle" class="small">SIGTERM → PID 1</text>
<path d="M60,76 L60,109" class="arrow blue" marker-end="url(#ch08-stop-timeline-h-blue)"/>
<rect x="450" y="20" width="230" height="56" rx="10" class="red"/>
<text x="565.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="code">SIGKILL</text>
<text x="565.0" y="58.0" text-anchor="middle" dominant-baseline="middle" class="small">cannot be caught or ignored</text>
<path d="M560,76 L560,109" class="arrow red" marker-end="url(#ch08-stop-timeline-h-red)"/>
<text x="60" y="140" text-anchor="middle" dominant-baseline="middle" class="small">t = 0</text>
<text x="560" y="140" text-anchor="middle" dominant-baseline="middle" class="small">t = 10 s</text>
<rect x="80" y="111" width="460" height="14" rx="4" class="green"/>
<text x="310" y="118" text-anchor="middle" dominant-baseline="middle" class="small">grace period: the app finishes its work and exits</text>
<rect x="100" y="166" width="380" height="66" rx="10" class="green"/>
<text x="290.0" y="179.0" text-anchor="middle" dominant-baseline="middle" class="bold">App exits inside the grace period</text>
<text x="290.0" y="199.0" text-anchor="middle" dominant-baseline="middle" class="code">exit code 0 (or 143)</text>
<text x="290.0" y="219.0" text-anchor="middle" dominant-baseline="middle" class="small">clean shutdown, cleanup ran</text>
<rect x="500" y="166" width="190" height="66" rx="10" class="red"/>
<text x="595.0" y="179.0" text-anchor="middle" dominant-baseline="middle" class="bold">Still running: killed</text>
<text x="595.0" y="199.0" text-anchor="middle" dominant-baseline="middle" class="code">exit code 137</text>
<text x="595.0" y="219.0" text-anchor="middle" dominant-baseline="middle" class="small">no cleanup ran</text>
</svg>
<figcaption>SIGTERM is a polite request. Docker waits (10 seconds by default), then sends SIGKILL, which cannot be caught.</figcaption>
</figure>
