<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="s02-stop-t s02-stop-d" xmlns="http://www.w3.org/2000/svg">
<title id="s02-stop-t">What docker stop does</title>
<desc id="s02-stop-d">docker stop asks politely with SIGTERM, waits 10 seconds, then forces it with SIGKILL.</desc>
<defs><marker id="s02-stop-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s02-stop-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s02-stop-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s02-stop-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="70" width="130" height="50" rx="10" class="blue"/>
<text x="85.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">docker stop</text>
<path d="M150,95 L198,95" class="arrow" marker-end="url(#s02-stop-h)"/>
<rect x="200" y="70" width="150" height="50" rx="10" class="amber"/>
<text x="275.0" y="85.0" text-anchor="middle" dominant-baseline="middle">SIGTERM</text>
<text x="275.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">&quot;please shut down&quot;</text>
<path d="M350,80 L420,40" class="arrow green" marker-end="url(#s02-stop-h-green)"/>
<rect x="422" y="15" width="278" height="50" rx="10" class="green"/>
<text x="561.0" y="30.0" text-anchor="middle" dominant-baseline="middle">App cleans up and exits</text>
<text x="561.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="small">exit code 0 (or 143)</text>
<path d="M350,110 L420,150" class="arrow red" marker-end="url(#s02-stop-h-red)"/>
<text x="360" y="150" text-anchor="middle" dominant-baseline="middle" class="small">ignored for 10 s</text>
<rect x="422" y="125" width="278" height="50" rx="10" class="red"/>
<text x="561.0" y="140.0" text-anchor="middle" dominant-baseline="middle">SIGKILL: killed instantly</text>
<text x="561.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="small">no cleanup · exit code 137</text>
</svg>
<figcaption>docker stop asks politely with SIGTERM, waits 10 seconds, then forces it with SIGKILL.</figcaption>
</figure>
