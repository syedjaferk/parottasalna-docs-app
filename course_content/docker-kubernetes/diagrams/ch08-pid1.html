<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="ch08-pid1-t ch08-pid1-d" xmlns="http://www.w3.org/2000/svg">
<title id="ch08-pid1-t">Who is PID 1 in the container?</title>
<desc id="ch08-pid1-d">docker stop sends SIGTERM to PID 1 only. If PID 1 is a shell, or an app with no handler, the signal is lost and Docker falls back to SIGKILL.</desc>
<defs><marker id="ch08-pid1-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ch08-pid1-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="ch08-pid1-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="ch08-pid1-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="15" width="222" height="36" rx="10" class="red"/>
<text x="126.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">Shell form</text>
<rect x="15" y="59" width="222" height="34" rx="10" class="box"/>
<text x="126.0" y="76.0" text-anchor="middle" dominant-baseline="middle" class="code">CMD uvicorn main:app</text>
<rect x="15" y="101" width="222" height="62" rx="10" class="box"/>
<text x="126.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="code">PID 1  /bin/sh -c</text>
<text x="126.0" y="142.0" text-anchor="middle" dominant-baseline="middle" class="code">└ PID 7  uvicorn</text>
<path d="M126,163 L126,183" class="arrow red" marker-end="url(#ch08-pid1-h-red)"/>
<rect x="15" y="185" width="222" height="50" rx="10" class="red"/>
<text x="126.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">SIGTERM stops at the shell</text>
<rect x="253" y="15" width="222" height="36" rx="10" class="green"/>
<text x="364.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">Exec form</text>
<rect x="253" y="59" width="222" height="34" rx="10" class="box"/>
<text x="364.0" y="76.0" text-anchor="middle" dominant-baseline="middle" class="code">CMD [&quot;uvicorn&quot;, …]</text>
<rect x="253" y="101" width="222" height="62" rx="10" class="box"/>
<text x="364.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="code">PID 1  uvicorn</text>
<text x="364.0" y="142.0" text-anchor="middle" dominant-baseline="middle" class="code">(has a SIGTERM handler)</text>
<path d="M364,163 L364,183" class="arrow green" marker-end="url(#ch08-pid1-h-green)"/>
<rect x="253" y="185" width="222" height="50" rx="10" class="green"/>
<text x="364.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">uvicorn hears SIGTERM, shuts down</text>
<rect x="491" y="15" width="222" height="36" rx="10" class="blue"/>
<text x="602.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">Exec form + --init</text>
<rect x="491" y="59" width="222" height="34" rx="10" class="box"/>
<text x="602.0" y="76.0" text-anchor="middle" dominant-baseline="middle" class="code">docker run --init</text>
<rect x="491" y="101" width="222" height="62" rx="10" class="box"/>
<text x="602.0" y="122.0" text-anchor="middle" dominant-baseline="middle" class="code">PID 1  docker-init (tini)</text>
<text x="602.0" y="142.0" text-anchor="middle" dominant-baseline="middle" class="code">└ PID 7  your app</text>
<path d="M602,163 L602,183" class="arrow blue" marker-end="url(#ch08-pid1-h-blue)"/>
<rect x="491" y="185" width="222" height="50" rx="10" class="blue"/>
<text x="602.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">tini forwards the signal</text>
<text x="360" y="250" text-anchor="middle" dominant-baseline="middle" class="small">Rule: exec form for CMD / ENTRYPOINT, and make sure the app handles SIGTERM</text>
</svg>
<figcaption>docker stop sends SIGTERM to PID 1 only. If PID 1 is a shell, or an app with no handler, the signal is lost and Docker falls back to SIGKILL.</figcaption>
</figure>
