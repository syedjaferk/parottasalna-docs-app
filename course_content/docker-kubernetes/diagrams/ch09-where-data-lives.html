<div style="max-width:760px;margin:1rem auto;font-family:system-ui,sans-serif;color:currentColor">
<svg viewBox="0 0 720 360" width="100%" role="img" aria-label="Where a container's data can live: writable layer, volume, bind mount, tmpfs">
<defs><marker id="a91" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
<rect x="20" y="20" width="330" height="320" rx="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
<text x="35" y="44" font-size="15" font-weight="700" fill="currentColor">Container</text>
<rect x="35" y="60" width="150" height="150" rx="8" fill="#888" fill-opacity=".15" stroke="#888"/>
<text x="110" y="80" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">Image layers</text>
<text x="110" y="96" font-size="11" text-anchor="middle" fill="currentColor">(read-only, shared)</text>
<text x="110" y="130" font-size="11" text-anchor="middle" fill="currentColor">python:3.12-slim</text>
<text x="110" y="156" font-size="11" text-anchor="middle" fill="currentColor">RUN pip install</text>
<text x="110" y="182" font-size="11" text-anchor="middle" fill="currentColor">COPY main.py</text>
<rect x="35" y="222" width="150" height="75" rx="8" fill="#EF9F27" fill-opacity=".25" stroke="#EF9F27"/>
<text x="110" y="246" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">Writable layer</text>
<text x="110" y="264" font-size="11" text-anchor="middle" fill="currentColor">one per container</text>
<text x="110" y="282" font-size="11" text-anchor="middle" fill="#E24B4A">deleted by docker rm</text>
<rect x="200" y="60" width="135" height="60" rx="8" fill="#1D9E75" fill-opacity=".2" stroke="#1D9E75"/>
<text x="267" y="86" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">/data</text>
<text x="267" y="104" font-size="11" text-anchor="middle" fill="currentColor">volume mount</text>
<rect x="200" y="140" width="135" height="60" rx="8" fill="#378ADD" fill-opacity=".2" stroke="#378ADD"/>
<text x="267" y="166" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">/app</text>
<text x="267" y="184" font-size="11" text-anchor="middle" fill="currentColor">bind mount</text>
<rect x="200" y="220" width="135" height="60" rx="8" fill="#7F77DD" fill-opacity=".2" stroke="#7F77DD"/>
<text x="267" y="246" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">/tmp</text>
<text x="267" y="264" font-size="11" text-anchor="middle" fill="currentColor">tmpfs mount</text>
<line x1="335" y1="90" x2="468" y2="90" stroke="currentColor" stroke-width="1.5" marker-end="url(#a91)"/>
<line x1="335" y1="170" x2="468" y2="170" stroke="currentColor" stroke-width="1.5" marker-end="url(#a91)"/>

<text x="585" y="98" font-size="10" text-anchor="middle" fill="currentColor">/var/lib/docker/volumes/appdata</text>
<text x="585" y="114" font-size="11" text-anchor="middle" fill="currentColor">survives docker rm</text>
<rect x="470" y="135" width="230" height="70" rx="8" fill="#378ADD" fill-opacity=".2" stroke="#378ADD"/>
<text x="585" y="160" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">A folder you choose on the host</text>
<text x="585" y="178" font-size="10" text-anchor="middle" fill="currentColor">/home/you/project/app</text>
<text x="585" y="194" font-size="11" text-anchor="middle" fill="currentColor">you can edit it directly</text>
<rect x="470" y="215" width="230" height="70" rx="8" fill="#7F77DD" fill-opacity=".2" stroke="#7F77DD"/>
<text x="585" y="240" font-size="12" text-anchor="middle" font-weight="600" fill="currentColor">Host memory (RAM)</text>

<text x="585" y="320" font-size="11" text-anchor="middle" fill="currentColor" opacity=".7">The app sees ordinary folders in all four cases.</text>
