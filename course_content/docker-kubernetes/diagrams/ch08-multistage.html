<figure class="diagram">
<svg class="dg" viewBox="0 0 720 270" role="img" aria-labelledby="ch08-multistage-t ch08-multistage-d" xmlns="http://www.w3.org/2000/svg">
<title id="ch08-multistage-t">A multi-stage build</title>
<desc id="ch08-multistage-d">Stage 1 has the build tools and does the work. Stage 2 starts fresh and copies in only the finished result. Only the last stage becomes the image.</desc>
<defs><marker id="ch08-multistage-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="ch08-multistage-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="ch08-multistage-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="ch08-multistage-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="280" height="40" rx="10" class="amber"/>
<text x="160.0" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">Stage 1 · builder  (FROM … AS builder)</text>
<rect x="20" y="66" width="280" height="112" rx="10" class="box"/>
<text x="160.0" y="92.0" text-anchor="middle" dominant-baseline="middle">pip, compilers, headers</text>
<text x="160.0" y="112.0" text-anchor="middle" dominant-baseline="middle">downloaded wheels, caches</text>
<text x="160.0" y="132.0" text-anchor="middle" dominant-baseline="middle" class="code">RUN pip install …</text>
<text x="160.0" y="152.0" text-anchor="middle" dominant-baseline="middle" class="small">big, and never shipped</text>
<rect x="420" y="20" width="280" height="40" rx="10" class="green"/>
<text x="560.0" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">Stage 2 · runtime  (FROM … AS runtime)</text>
<rect x="420" y="66" width="280" height="112" rx="10" class="box"/>
<text x="560.0" y="92.0" text-anchor="middle" dominant-baseline="middle">clean slim base image</text>
<text x="560.0" y="112.0" text-anchor="middle" dominant-baseline="middle" class="code">COPY --from=builder …</text>
<text x="560.0" y="132.0" text-anchor="middle" dominant-baseline="middle" class="small">your code · non-root USER</text>
<text x="560.0" y="152.0" text-anchor="middle" dominant-baseline="middle" class="small">small, and this is the image</text>
<path d="M300,122 L418,122" class="arrow green" marker-end="url(#ch08-multistage-h-green)"/>
<text x="359" y="106" text-anchor="middle" dominant-baseline="middle" class="small">only the result</text>
<rect x="20" y="196" width="280" height="40" rx="10" class="red"/>
<text x="160.0" y="216.0" text-anchor="middle" dominant-baseline="middle" class="small">thrown away after the build</text>
<path d="M160,178 L160,194" class="arrow red" marker-end="url(#ch08-multistage-h-red)"/>
<rect x="420" y="196" width="280" height="40" rx="10" class="green"/>
<text x="560.0" y="216.0" text-anchor="middle" dominant-baseline="middle" class="small">docker run / push / deploy this</text>
<path d="M560,178 L560,194" class="arrow green" marker-end="url(#ch08-multistage-h-green)"/>
<text x="360" y="256" text-anchor="middle" dominant-baseline="middle" class="small">docker build --target builder  stops after stage 1, so you can inspect it</text>
</svg>
<figcaption>Stage 1 has the build tools and does the work. Stage 2 starts fresh and copies in only the finished result. Only the last stage becomes the image.</figcaption>
</figure>
