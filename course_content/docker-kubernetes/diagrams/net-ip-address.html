<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="net-ip-address-t net-ip-address-d" xmlns="http://www.w3.org/2000/svg">
<title id="net-ip-address-t">An IPv4 address and its subnet</title>
<desc id="net-ip-address-d">An IPv4 address is 4 numbers (0–255), 32 bits in total. The /24 says the first 24 bits name the network and the rest name the host.</desc>
<defs><marker id="net-ip-address-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="net-ip-address-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="net-ip-address-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="net-ip-address-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="60" y="30" width="130" height="50" rx="10" class="green"/>
<text x="125.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">192</text>
<text x="125" y="98" text-anchor="middle" dominant-baseline="middle" class="code">11000000</text>
<text x="202" y="55" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="215" y="30" width="130" height="50" rx="10" class="green"/>
<text x="280.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">168</text>
<text x="280" y="98" text-anchor="middle" dominant-baseline="middle" class="code">10101000</text>
<text x="357" y="55" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="370" y="30" width="130" height="50" rx="10" class="green"/>
<text x="435.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">1</text>
<text x="435" y="98" text-anchor="middle" dominant-baseline="middle" class="code">00000001</text>
<text x="512" y="55" text-anchor="middle" dominant-baseline="middle" class="bold">.</text>
<rect x="525" y="30" width="130" height="50" rx="10" class="amber"/>
<text x="590.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="bold">10</text>
<text x="590" y="98" text-anchor="middle" dominant-baseline="middle" class="code">00001010</text>
<line x1="60" y1="120" x2="500" y2="120" class="line"/>
<text x="280" y="138" text-anchor="middle" dominant-baseline="middle" class="small">network part (24 bits): 192.168.1</text>
<line x1="525" y1="120" x2="655" y2="120" class="line"/>
<text x="590" y="138" text-anchor="middle" dominant-baseline="middle" class="small">host part (8 bits)</text>
<rect x="60" y="165" width="290" height="72" rx="10" class="blue"/>
<text x="205.0" y="181.0" text-anchor="middle" dominant-baseline="middle">192.168.1.0/24</text>
<text x="205.0" y="201.0" text-anchor="middle" dominant-baseline="middle" class="small">mask 255.255.255.0</text>
<text x="205.0" y="221.0" text-anchor="middle" dominant-baseline="middle" class="small">256 addresses, 254 usable</text>
<rect x="370" y="165" width="290" height="72" rx="10" class="purple"/>
<text x="515.0" y="181.0" text-anchor="middle" dominant-baseline="middle">172.17.0.0/16</text>
<text x="515.0" y="201.0" text-anchor="middle" dominant-baseline="middle" class="small">mask 255.255.0.0</text>
<text x="515.0" y="221.0" text-anchor="middle" dominant-baseline="middle" class="small">Docker&#x27;s default bridge: 65,536</text>
</svg>
<figcaption>An IPv4 address is 4 numbers (0–255), 32 bits in total. The /24 says the first 24 bits name the network and the rest name the host.</figcaption>
</figure>
