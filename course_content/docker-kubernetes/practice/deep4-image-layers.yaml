chapter: deep-dives/image-mechanics

quizzes:
  - title: "Under the hood · Image layers · Concepts"
    renamed_from: ["Session 7 · Concepts"]
    description: Layers, copy-on-write, overlay2, image IDs and digests.
    questions:
      - text: What is a Docker image made of?
        choices: |
          One big compressed file that changes as containers run
          *A stack of read-only layers plus a config
          A virtual disk with an OS
          A list of commands that run every time
        explanation: "An image is an ordered stack of read-only filesystem layers plus a config (env, CMD, entrypoint…), tied together by a manifest."

      - text: A container changes a file that comes from an image layer. What happens?
        choices: |
          The image layer is edited
          *The file is copied up into the container's writable layer and changed there (copy-on-write)
          Docker refuses the change
          A new image is created automatically
        explanation: "Copy-on-write: overlay2 copies the file up into the container's writable layer and changes it there. The image layer never changes."

      - text: What happens to the writable layer when you remove the container?
        choices: |
          It is merged into the image
          *It is deleted; the image is untouched
          It becomes a new layer of the image
          It is saved to Docker Hub
        explanation: "The writable layer belongs to the container and is deleted with it. Use volumes for data that must survive."

      - text: Which storage driver does modern Linux Docker use by default?
        choices: |
          aufs
          devicemapper
          *overlay2
          zfs
        explanation: "overlay2 (OverlayFS) is the default storage driver on modern Linux kernels. aufs and devicemapper are deprecated."

      - text: What is the image **digest**?
        choices: |
          A hash of the image's config on your machine
          *A hash of the image's manifest in a registry, used to pull exactly the same image anywhere
          The image's tag
          The image's size
        explanation: "The digest (sha256:…) is the hash of the manifest, a content address that identifies exactly the same image in any registry."

      - text: Why pin an image by digest (or a specific tag) instead of `latest` in production?
        choices: |
          Digests download faster
          *A tag can be moved to a new image; a digest always means the exact same bytes
          `latest` images are not allowed in production
          Digests are smaller
        explanation: "Tags are movable labels (latest especially). A digest can't change, so every deploy runs exactly the same bytes."

      - text: "\"Updating\" an image really means…"
        choices: |
          Editing its layers in place
          *Building a new image (new ID) and moving the tag to it
          Running `docker update`
          Restarting all containers
        explanation: Images are immutable. That's also why rollback is easy; run the previous image.

  - title: "Under the hood · Image layers · Hands-on"
    renamed_from: ["Session 7 · Hands-on"]
    questions:
      - text: "After `docker exec cow sh -c 'echo hi > /tmp/new.txt'`, `docker diff cow` shows `A /tmp/new.txt`. What does `A` mean?"
        choices: |
          *Added
          Archived
          Accessed
          Attached
        explanation: "docker diff marks paths as A (added), C (changed) or D (deleted) compared with the image."

      - text: "In `docker diff`, what does `C /tmp` mean?"
        choices: |
          Copied
          *Changed
          Cached
          Created by the image
        explanation: "C means changed. The /tmp directory changed because a new file was added inside it."

      - text: You create a file in container 1, then start container 2 from the same image. Is the file in container 2?
        choices: |
          Yes, they share the image
          *No, each container has its own writable layer
          Only if container 1 is still running
          Only with --volumes-from
        explanation: "Each container gets its own empty writable layer on top of the shared read-only image, so changes aren't shared."

      - text: Which command shows image digests?
        choices: |
          docker images
          *docker images --digests
          docker digest ls
          docker history
        explanation: "docker images --digests adds a DIGEST column to the image list."

      - text: Which command removes untagged (dangling) leftover images?
        choices: |
          docker rmi --all
          *docker image prune
          docker system reset
          docker images -f dangling=true
        explanation: "docker image prune removes dangling images (untagged leftovers from rebuilds). -a also removes unused tagged ones."

      - text: Which command shows how much disk images, containers and volumes use?
        choices: |
          df -h
          docker info
          *docker system df
          docker stats
        explanation: "docker system df summarises disk use by images, containers, local volumes and the build cache."

      - text: "Which Dockerfile instructions add real bytes to an image? (Pick all that apply.)"
        choices: |
          *RUN
          *COPY
          *ADD
          ENV
        explanation: ENV, WORKDIR, EXPOSE, CMD and similar only change the image's settings (0B layers).

decks:
  - title: "Under the hood · Image layers · Flashcards"
    renamed_from: ["Session 7 · Flashcards"]
    cards:
      - front: Layer
        back: A **read-only** set of file changes from one build step.
      - front: Writable layer
        back: A thin layer on top for each **container**. Deleted with the container.
      - front: Copy-on-write
        back: Changing a lower-layer file first **copies it up** to the writable layer, then changes the copy.
      - front: overlay2
        back: The default storage driver. Lower dirs = image layers, upper dir = writable layer, **merged** = what the container sees.
      - front: Image ID
        back: SHA-256 of the image's **config**. Identifies it on your machine.
      - front: Digest
        back: SHA-256 of the image's **manifest** in a registry. Pull exactly these bytes anywhere.
      - front: Tag
        back: A **movable label** (`alpine:3.20`). The publisher can point it at a new image.
      - front: Immutable image
        back: Never changes after it's built. Updates = a new image; rollback = run the old one.
      - front: docker diff
        back: "Shows a container's changes. `A` added, `C` changed, `D` deleted."
      - front: docker history
        back: Lists an image's layers with the instruction and size of each.
      - front: docker image prune
        back: Removes **dangling** (untagged) images.
      - front: docker system df
        back: Disk used by images, containers, volumes and build cache.
      - front: Projector-sheet analogy
        back: Stacked transparent sheets you can't edit; you draw on a **fresh top sheet**.
