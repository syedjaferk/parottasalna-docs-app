chapter: sessions/04-docker-commands

quizzes:
  - title: "Chapter 4 · Concepts"
    renamed_from: ["Session 6 · Concepts"]
    description: Image names, the container lifecycle and everyday commands.
    questions:
      - text: "In `nginx:alpine`, what is `alpine`?"
        choices: |
          The registry
          The repository
          *The tag
          The digest
        explanation: "In name:tag, the part after the colon is the tag. nginx is the repository, and the registry (docker.io) is implied."

      - text: You run `docker pull nginx` with no tag. Which tag do you get?
        choices: |
          stable
          *latest
          alpine
          The newest numbered version, always pinned
        explanation: "With no tag, Docker uses :latest, which is just a default tag name, not necessarily the newest version."

      - text: What does `docker run` do?
        choices: |
          Only starts an existing container
          *Pulls the image if needed, creates a container and starts it
          Builds an image
          Only creates a container
        explanation: "docker run = pull (if the image is missing) + create + start, all in one command."

      - text: "What does `docker stop` do?"
        choices: |
          Sends SIGKILL immediately
          *Sends SIGTERM, waits 10 seconds, then sends SIGKILL
          Pauses the container
          Removes the container
        explanation: "docker stop sends SIGTERM for a graceful shutdown, then SIGKILL after the grace period (10 s by default, change it with -t)."

      - text: What does `-p 8080:80` mean in `docker run`?
        choices: |
          *Host port 8080 is mapped to container port 80
          Container port 8080 is mapped to host port 80
          The container may use ports 80 to 8080
          It opens port 8080 in the host firewall only
        explanation: "The format is -p HOST:CONTAINER, so traffic to host port 8080 goes to port 80 in the container."

  - title: "Chapter 4 · Hands-on"
    renamed_from: ["Session 6 · Hands-on"]
    description: Commands from the nginx demo.
    questions:
      - text: "You run `docker run -d --name web -p 8080:80 -v \"$PWD/html:/usr/share/nginx/html:ro\" nginx:alpine` and then edit `html/index.html` on your laptop. What does `curl localhost:8080` show?"
        choices: |
          The old page until you rebuild the image
          *The new content right away, because it's a bind mount
          An error, because the mount is read-only
          The nginx welcome page
        explanation: "`:ro` only stops the **container** from writing. Your laptop can still edit the folder."

      - text: Which command opens a shell inside a running container named web?
        choices: |
          docker run -it web sh
          *docker exec -it web sh
          docker attach web sh
          docker shell web
        explanation: "docker exec runs a new process inside a running container. -it gives you an interactive terminal."

      - text: Which command shows stopped containers too?
        choices: |
          docker ps
          *docker ps -a
          docker images -a
          docker ls
        explanation: "docker ps shows only running containers. -a includes stopped (exited) ones too."

      - text: "`docker run` fails with \"port is already allocated\". What is the fix?"
        choices: |
          Restart Docker
          *Use another host port, like -p 8081:80, or stop whatever uses 8080
          Change the container port
          Remove the image
        explanation: "Only one process can bind a host port. Choose a free host port or stop whatever already holds it. The container port can stay 80."

      - text: You run `docker run alpine` and it exits immediately. Why?
        choices: |
          Alpine is broken
          *A container lives only as long as its main process; `sh` exits with no terminal attached
          You forgot -p
          Docker needs sudo
        explanation: "Alpine's default command is sh. With no terminal (-it), sh reads end-of-input and exits, and the container stops with it."

      - text: Which command removes a running container in one step?
        choices: |
          docker rm web
          *docker rm -f web
          docker rmi web
          docker stop --rm web
        explanation: "-f force-removes the container: Docker kills it and removes it in one step. docker rmi removes images."

      - text: Put the lifecycle in order.
        choices: |
          running → created → stopped → removed
          *created → running → stopped → removed
          created → stopped → running → removed
          pulled → removed → running → stopped
        explanation: "A container is created, then started (running), then stopped (exited), and finally removed."

decks:
  - title: "Chapter 4 · Flashcards"
    renamed_from: ["Session 6 · Flashcards"]
    cards:
      - front: "docker.io/library/nginx:alpine"
        back: Registry `docker.io`, repository `library/nginx` (official), tag `alpine`.
      - front: docker run
        back: "**pull + create + start** in one step."
      - front: "-d"
        back: Detached; run in the background.
      - front: "-p 8080:80"
        back: Host port **8080** → container port **80**.
      - front: "-v /host/dir:/container/dir:ro"
        back: Bind mount a folder; `:ro` = read-only inside the container.
      - front: "-e KEY=value"
        back: Set an environment variable.
      - front: "--rm"
        back: Delete the container when it exits.
      - front: docker exec -it web sh
        back: Open a shell inside a **running** container.
      - front: docker logs -f web
        back: Follow a container's output.
      - front: docker stop
        back: SIGTERM, wait **10 s**, then SIGKILL.
      - front: Container lifecycle
        back: created → running → (paused) → stopped → removed.
