<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s09-confidence-t s09-confidence-d" xmlns="http://www.w3.org/2000/svg">
<title id="s09-confidence-t">Trust Laya only when it is sure</title>
<desc id="s09-confidence-d">High confidence: act immediately. Low confidence: ask the LLM (or a human) instead of guessing.</desc>
<defs><marker id="s09-confidence-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s09-confidence-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s09-confidence-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s09-confidence-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="80" width="140" height="60" rx="10" class="green"/>
<text x="90.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="bold">Laya answer</text>
<text x="90.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">label + confidence</text>
<rect x="230" y="80" width="150" height="60" rx="10" class="amber"/>
<text x="305.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">confidence ≥ 0.70?</text>
<path d="M160,110 L228,110" class="arrow blue" marker-end="url(#s09-confidence-h-blue)"/>
<rect x="470" y="20" width="230" height="56" rx="10" class="green"/>
<text x="585.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="bold">Yes → trust it, act now</text>
<text x="585.0" y="58.0" text-anchor="middle" dominant-baseline="middle" class="small">route · block · reply</text>
<rect x="470" y="140" width="230" height="56" rx="10" class="red"/>
<text x="585.0" y="158.0" text-anchor="middle" dominant-baseline="middle" class="bold">No → ask the LLM / a human</text>
<text x="585.0" y="178.0" text-anchor="middle" dominant-baseline="middle" class="small">don&#x27;t guess</text>
<path d="M380,95 L468,50" class="arrow green" marker-end="url(#s09-confidence-h-green)"/>
<text x="420" y="60" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M380,125 L468,168" class="arrow red" marker-end="url(#s09-confidence-h-red)"/>
<text x="420" y="160" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
</svg>
<figcaption>High confidence: act immediately. Low confidence: ask the LLM (or a human) instead of guessing.</figcaption>
</figure>
