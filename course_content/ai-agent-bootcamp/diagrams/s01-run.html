<title id="s01-run-t">How Python runs a file</title>
<desc id="s01-run-d">Python reads the file from top to bottom, one line at a time, and does each instruction in order.</desc>
<defs><marker id="s01-run-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-run-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-run-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-run-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="30" y="20" width="250" height="150" rx="10" class="box"/>
<text x="50" y="48" text-anchor="start" dominant-baseline="middle" class="code">1  name = &quot;Asha&quot;</text>
<text x="50" y="82" text-anchor="start" dominant-baseline="middle" class="code">2  age = 21</text>
<text x="50" y="116" text-anchor="start" dominant-baseline="middle" class="code">3  print(&quot;Hello,&quot;, name)</text>
<text x="50" y="150" text-anchor="start" dominant-baseline="middle" class="code">4  print(age)</text>

<rect x="380" y="30" width="140" height="50" rx="10" class="blue"/>

<text x="450.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="small">(the reader)</text>
<path d="M280,55 L378,55" class="arrow blue" marker-end="url(#s01-run-h-blue)"/>
<text x="330" y="42" text-anchor="middle" dominant-baseline="middle" class="small">reads</text>
<rect x="380" y="110" width="300" height="50" rx="10" class="green"/>
