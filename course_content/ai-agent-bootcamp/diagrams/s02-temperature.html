<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s02-temperature-t s02-temperature-d" xmlns="http://www.w3.org/2000/svg">
<title id="s02-temperature-t">Temperature</title>
<desc id="s02-temperature-d">Low temperature always picks the most likely word (steady). High temperature gives other words a chance (creative, riskier).</desc>
<defs><marker id="s02-temperature-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s02-temperature-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s02-temperature-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s02-temperature-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="180" y="20" text-anchor="middle" dominant-baseline="middle" class="title">temperature 0  (steady)</text>
<rect x="30" y="40" width="80" height="34" rx="10" class="box"/>
<text x="70.0" y="57.0" text-anchor="middle" dominant-baseline="middle" class="code">Delhi</text>
<rect x="120" y="44" width="190.0" height="26" rx="4" class="green"/>
<rect x="30" y="90" width="80" height="34" rx="10" class="box"/>
<text x="70.0" y="107.0" text-anchor="middle" dominant-baseline="middle" class="code">Mumbai</text>
<rect x="120" y="94" width="6.0" height="26" rx="4" class="green"/>
<rect x="30" y="140" width="80" height="34" rx="10" class="box"/>
<text x="70.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="code">Chennai</text>
<rect x="120" y="144" width="4.0" height="26" rx="4" class="green"/>
<text x="530" y="20" text-anchor="middle" dominant-baseline="middle" class="title">temperature 1.5  (creative)</text>
<rect x="380" y="40" width="80" height="34" rx="10" class="box"/>
<text x="420.0" y="57.0" text-anchor="middle" dominant-baseline="middle" class="code">Delhi</text>
<rect x="470" y="44" width="90.0" height="26" rx="4" class="amber"/>

<rect x="470" y="94" width="66.0" height="26" rx="4" class="amber"/>
<rect x="380" y="140" width="80" height="34" rx="10" class="box"/>
<text x="420.0" y="157.0" text-anchor="middle" dominant-baseline="middle" class="code">Chennai</text>
<rect x="470" y="144" width="44.0" height="26" rx="4" class="amber"/>
<text x="360" y="215" text-anchor="middle" dominant-baseline="middle" class="small">Same question → temperature 0 repeats itself; temperature 1.5 varies each time</text>
</svg>
<figcaption>Low temperature always picks the most likely word (steady). High temperature gives other words a chance (creative, riskier).</figcaption>
</figure>
