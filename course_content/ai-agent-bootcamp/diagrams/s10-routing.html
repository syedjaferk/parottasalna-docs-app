<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s10-routing-t s10-routing-d" xmlns="http://www.w3.org/2000/svg">
<title id="s10-routing-t">Model routing</title>
<desc id="s10-routing-d">Easy and calm messages go to a cheap model; hard, urgent, upset or unsure ones go to the strong model.</desc>
<defs><marker id="s10-routing-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s10-routing-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s10-routing-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s10-routing-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="80" width="150" height="60" rx="10" class="amber"/>
<text x="95.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="bold">Analysis</text>
<text x="95.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">hard? urgent? angry?</text>
<rect x="280" y="20" width="190" height="64" rx="10" class="blue"/>
<text x="375.0" y="42.0" text-anchor="middle" dominant-baseline="middle" class="bold">Cheap model</text>
<text x="375.0" y="62.0" text-anchor="middle" dominant-baseline="middle" class="small">1 unit per message</text>
<rect x="280" y="140" width="190" height="64" rx="10" class="green"/>
<text x="375.0" y="162.0" text-anchor="middle" dominant-baseline="middle" class="bold">Strong model</text>
<text x="375.0" y="182.0" text-anchor="middle" dominant-baseline="middle" class="small">20 units per message</text>
<path d="M170,100 L278,55" class="arrow blue" marker-end="url(#s10-routing-h-blue)"/>
<text x="200" y="34" text-anchor="middle" dominant-baseline="middle" class="small">easy + calm</text>
<path d="M170,125 L278,170" class="arrow green" marker-end="url(#s10-routing-h-green)"/>
<text x="130" y="196" text-anchor="middle" dominant-baseline="middle" class="small">hard · urgent · upset · unsure</text>
<rect x="540" y="80" width="160" height="60" rx="10" class="ghost"/>
<text x="620.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">Reply</text>
<path d="M470,52 L540,100" class="arrow blue" marker-end="url(#s10-routing-h-blue)"/>
<path d="M470,172 L540,125" class="arrow green" marker-end="url(#s10-routing-h-green)"/>
</svg>
<figcaption>Easy and calm messages go to a cheap model; hard, urgent, upset or unsure ones go to the strong model.</figcaption>
</figure>
