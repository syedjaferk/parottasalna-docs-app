<figure class="diagram">
<svg class="dg" viewBox="0 0 720 210" role="img" aria-labelledby="s02-models-t s02-models-d" xmlns="http://www.w3.org/2000/svg">
<title id="s02-models-t">Choosing a model</title>
<desc id="s02-models-d">Bigger models are smarter but slower and pricier; small models are fast and cheap. Pick the smallest that does the job.</desc>
<defs><marker id="s02-models-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s02-models-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s02-models-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s02-models-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="30" y="50" width="200" height="110" rx="10" class="green"/>
<text x="130.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Small / fast</text>
<text x="130.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">8B parameters</text>
<text x="130.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">cheap, quick</text>
<text x="130.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="small">simple tasks</text>
<rect x="260" y="50" width="200" height="110" rx="10" class="blue"/>
<text x="360.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Medium</text>
<text x="360.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">70B parameters</text>
<text x="360.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">balanced</text>
<text x="360.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="small">most agent work</text>
<rect x="490" y="50" width="200" height="110" rx="10" class="amber"/>
<text x="590.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">Large / frontier</text>
<text x="590.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">paid, biggest</text>
<text x="590.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">best reasoning</text>
<text x="590.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="small">hard problems</text>
<path d="M30,185 L690,185" class="arrow blue" marker-end="url(#s02-models-h-blue)"/>
<text x="130" y="200" text-anchor="middle" dominant-baseline="middle" class="small">cheaper &amp; faster</text>
<text x="600" y="200" text-anchor="middle" dominant-baseline="middle" class="small">smarter &amp; costlier</text>
</svg>
<figcaption>Bigger models are smarter but slower and pricier; small models are fast and cheap. Pick the smallest that does the job.</figcaption>
</figure>
