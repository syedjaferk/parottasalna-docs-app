<title id="s09-two-systems-t">System 1 and System 2 AI</title>
<desc id="s09-two-systems-d">A small classifier answers fast with labels; an LLM thinks slowly and writes text. Use each for what it is good at.</desc>
<defs><marker id="s09-two-systems-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s09-two-systems-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s09-two-systems-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s09-two-systems-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="330" height="200" rx="10" class="box"/>

<text x="185.0" y="73.0" text-anchor="middle" dominant-baseline="middle">Laya: label + probability</text>

<text x="185.0" y="163.0" text-anchor="middle" dominant-baseline="middle">sort · block · route</text>

<rect x="370" y="20" width="330" height="200" rx="10" class="box"/>
