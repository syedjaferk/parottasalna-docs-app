<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s03-chat-loop-t s03-chat-loop-d" xmlns="http://www.w3.org/2000/svg">
<title id="s03-chat-loop-t">The chatbot loop</title>
<desc id="s03-chat-loop-d">Read your input, add it to the history, send the history to the model, add the reply to the history, print it, repeat.</desc>
<defs><marker id="s03-chat-loop-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s03-chat-loop-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s03-chat-loop-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s03-chat-loop-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="14" y="60" width="124" height="66" rx="10" class="blue"/>
<text x="76.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 Read</text>
<text x="76.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">your input</text>
<path d="M138,93 L152,93" class="arrow blue" marker-end="url(#s03-chat-loop-h-blue)"/>
<rect x="154" y="60" width="124" height="66" rx="10" class="box"/>
<text x="216.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 Append to</text>
<text x="216.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">history</text>
<path d="M278,93 L292,93" class="arrow blue" marker-end="url(#s03-chat-loop-h-blue)"/>
<rect x="294" y="60" width="124" height="66" rx="10" class="amber"/>
<text x="356.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 Send history</text>
<text x="356.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">to the model</text>
<path d="M418,93 L432,93" class="arrow blue" marker-end="url(#s03-chat-loop-h-blue)"/>
<rect x="434" y="60" width="124" height="66" rx="10" class="box"/>
<text x="496.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 Append reply</text>
<text x="496.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">to history</text>
<path d="M558,93 L572,93" class="arrow blue" marker-end="url(#s03-chat-loop-h-blue)"/>
<rect x="574" y="60" width="124" height="66" rx="10" class="green"/>
<text x="636.0" y="83.0" text-anchor="middle" dominant-baseline="middle" class="bold">5 Print</text>
<text x="636.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">reply</text>
<path d="M640,126 L640,180 L75,180 L75,128" class="arrow blue dashed" marker-end="url(#s03-chat-loop-h-blue)"/>
<text x="360" y="200" text-anchor="middle" dominant-baseline="middle" class="small">repeat until the user types &#x27;quit&#x27;</text>
</svg>
<figcaption>Read your input, add it to the history, send the history to the model, add the reply to the history, print it, repeat.</figcaption>
</figure>
