<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="s05-memory-t s05-memory-d" xmlns="http://www.w3.org/2000/svg">
<title id="s05-memory-t">Three kinds of agent memory</title>
<desc id="s05-memory-d">Short-term keeps recent messages; summary squeezes old ones; notes live in a file and survive restarts.</desc>
<defs><marker id="s05-memory-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s05-memory-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s05-memory-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s05-memory-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="210" height="160" rx="10" class="blue"/>
<text x="125.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Short-term</text>
<text x="125.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">last ~12 messages</text>
<text x="125.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">exact words</text>
<text x="125.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">lost when cut</text>
<rect x="255" y="30" width="210" height="160" rx="10" class="amber"/>
<text x="360.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Summary</text>
<text x="360.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">old chat → 80 words</text>
<text x="360.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">names, preferences</text>
<text x="360.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">detail is lost</text>
<rect x="490" y="30" width="210" height="160" rx="10" class="green"/>
<text x="595.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="bold">Notes file</text>
<text x="595.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">notes.txt</text>
<text x="595.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">survives restart</text>
<text x="595.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">agent must choose to save</text>
<path d="M230,110 L253,110" class="arrow blue" marker-end="url(#s05-memory-h-blue)"/>
<text x="242" y="95" text-anchor="middle" dominant-baseline="middle" class="small">too long</text>
<text x="360" y="225" text-anchor="middle" dominant-baseline="middle" class="small">In the prompt every time          ·          Written to disk</text>
</svg>
<figcaption>Short-term keeps recent messages; summary squeezes old ones; notes live in a file and survive restarts.</figcaption>
</figure>
