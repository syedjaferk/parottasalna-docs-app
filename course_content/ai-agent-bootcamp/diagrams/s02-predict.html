<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s02-predict-t s02-predict-d" xmlns="http://www.w3.org/2000/svg">
<title id="s02-predict-t">An LLM predicts the next word</title>
<desc id="s02-predict-d">Given the words so far, the model scores every possible next token and picks one. It repeats this over and over.</desc>
<defs><marker id="s02-predict-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s02-predict-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s02-predict-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s02-predict-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="330" height="50" rx="10" class="blue"/>
<text x="185.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;The capital of India is&quot;</text>
<path d="M185,70 L185,100" class="arrow blue" marker-end="url(#s02-predict-h-blue)"/>
<rect x="100" y="100" width="170" height="40" rx="10" class="amber"/>
<text x="185.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="bold">LLM (the model)</text>
<path d="M270,120 L400,120" class="arrow blue" marker-end="url(#s02-predict-h-blue)"/>
<text x="560" y="24" text-anchor="middle" dominant-baseline="middle" class="title">scores for the next token</text>
<rect x="405" y="40" width="70" height="30" rx="10" class="box"/>
<text x="440.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code"> New</text>
<rect x="480" y="43" width="180.39999999999998" height="24" rx="4" class="green"/>
<text x="669.4" y="55" text-anchor="start" dominant-baseline="middle" class="small">82%</text>
<rect x="405" y="82" width="70" height="30" rx="10" class="box"/>
<text x="440.0" y="97.0" text-anchor="middle" dominant-baseline="middle" class="code"> Delhi</text>
<rect x="480" y="85" width="22.0" height="24" rx="4" class="blue"/>
<text x="511.0" y="97" text-anchor="start" dominant-baseline="middle" class="small">10%</text>
<rect x="405" y="124" width="70" height="30" rx="10" class="box"/>
<text x="440.0" y="139.0" text-anchor="middle" dominant-baseline="middle" class="code"> the</text>
<rect x="480" y="127" width="8.8" height="24" rx="4" class="blue"/>
<text x="497.8" y="139" text-anchor="start" dominant-baseline="middle" class="small">4%</text>
<rect x="405" y="166" width="70" height="30" rx="10" class="box"/>
<text x="440.0" y="181.0" text-anchor="middle" dominant-baseline="middle" class="code"> a</text>
<rect x="480" y="169" width="4.4" height="24" rx="4" class="blue"/>
<text x="493.4" y="181" text-anchor="start" dominant-baseline="middle" class="small">2%</text>
<text x="360" y="215" text-anchor="middle" dominant-baseline="middle" class="small">It then adds the chosen token and asks again, until the answer is complete.</text>
</svg>
<figcaption>Given the words so far, the model scores every possible next token and picks one. It repeats this over and over.</figcaption>
</figure>
