<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s04-prompt-levels-t s04-prompt-levels-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-prompt-levels-t">Three prompt techniques</title>
<desc id="s04-prompt-levels-d">Each step makes the output more predictable: say what you want, limit the format, then show examples.</desc>
<defs><marker id="s04-prompt-levels-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-prompt-levels-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-prompt-levels-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-prompt-levels-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="125" y="20" text-anchor="middle" dominant-baseline="middle" class="title">1 Instructions</text>
<rect x="20" y="35" width="210" height="90" rx="10" class="ghost"/>
<text x="125.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">Classify the</text>
<text x="125.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">sentiment.</text>
<path d="M125,125 L125,150" class="arrow blue" marker-end="url(#s04-prompt-levels-h-blue)"/>
<rect x="20" y="150" width="210" height="50" rx="10" class="box"/>
<text x="125.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">→ long paragraph</text>
<text x="360" y="20" text-anchor="middle" dominant-baseline="middle" class="title">2 + Constraints</text>
<rect x="255" y="35" width="210" height="90" rx="10" class="blue"/>
<text x="360.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">Reply with ONE</text>
<text x="360.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">word only.</text>
<path d="M360,125 L360,150" class="arrow blue" marker-end="url(#s04-prompt-levels-h-blue)"/>
<rect x="255" y="150" width="210" height="50" rx="10" class="box"/>
<text x="360.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">→ &quot;mixed&quot;</text>
<text x="595" y="20" text-anchor="middle" dominant-baseline="middle" class="title">3 + Examples</text>
<rect x="490" y="35" width="210" height="90" rx="10" class="green"/>
<text x="595.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Loved it&quot; → positive</text>
<text x="595.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Awful&quot; → negative</text>
<path d="M595,125 L595,150" class="arrow blue" marker-end="url(#s04-prompt-levels-h-blue)"/>
<rect x="490" y="150" width="210" height="50" rx="10" class="box"/>
<text x="595.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">→ &quot;mixed&quot; (reliable)</text>
<text x="360" y="225" text-anchor="middle" dominant-baseline="middle" class="small">More specific prompt  =  more reliable answer</text>
</svg>
<figcaption>Each step makes the output more predictable: say what you want, limit the format, then show examples.</figcaption>
</figure>
