<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s04-structured-t s04-structured-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-structured-t">Free text vs JSON</title>
<desc id="s04-structured-d">Free text is for humans. JSON lets your code read each value directly.</desc>
<defs><marker id="s04-structured-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-structured-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-structured-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-structured-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="300" height="100" rx="10" class="ghost"/>
<text x="170.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="bold">Free text</text>
<text x="170.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="small">&quot;Mostly positive, I&#x27;d say 7/10,</text>
<text x="170.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">about food and service.&quot;</text>
<rect x="400" y="30" width="300" height="100" rx="10" class="green"/>
<text x="550.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="bold">JSON</text>
<text x="550.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">{&quot;sentiment&quot;: &quot;mixed&quot;,</text>
<text x="550.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code"> &quot;score&quot;: 7, &quot;topics&quot;: [...]}</text>
<path d="M322,80 L398,80" class="arrow blue" marker-end="url(#s04-structured-h-blue)"/>
<text x="360" y="66" text-anchor="middle" dominant-baseline="middle" class="small">ask for JSON</text>
<rect x="20" y="160" width="300" height="50" rx="10" class="red"/>
<text x="170.0" y="185.0" text-anchor="middle" dominant-baseline="middle">your code must guess ✗</text>
<rect x="400" y="160" width="300" height="50" rx="10" class="green"/>
<text x="550.0" y="185.0" text-anchor="middle" dominant-baseline="middle" class="code">result[&quot;score&quot;]   → 7 ✓</text>
</svg>
<figcaption>Free text is for humans. JSON lets your code read each value directly.</figcaption>
</figure>
