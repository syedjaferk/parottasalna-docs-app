<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s01-list-dict-t s01-list-dict-d" xmlns="http://www.w3.org/2000/svg">
<title id="s01-list-dict-t">A list and a dictionary</title>
<desc id="s01-list-dict-d">A list is ordered by position (starting at 0). A dictionary is looked up by a label (key).</desc>
<defs><marker id="s01-list-dict-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-list-dict-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-list-dict-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-list-dict-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="130" y="18" text-anchor="middle" dominant-baseline="middle" class="title">LIST  (by position)</text>
<text x="60" y="42" text-anchor="middle" dominant-baseline="middle" class="bold">0</text>
<rect x="20" y="52" width="80" height="44" rx="10" class="blue"/>
<text x="60.0" y="74.0" text-anchor="middle" dominant-baseline="middle" class="code">apple</text>
<text x="150" y="42" text-anchor="middle" dominant-baseline="middle" class="bold">1</text>
<rect x="110" y="52" width="80" height="44" rx="10" class="box"/>
<text x="150.0" y="74.0" text-anchor="middle" dominant-baseline="middle" class="code">banana</text>
<text x="240" y="42" text-anchor="middle" dominant-baseline="middle" class="bold">2</text>
<rect x="200" y="52" width="80" height="44" rx="10" class="box"/>
<text x="240.0" y="74.0" text-anchor="middle" dominant-baseline="middle" class="code">mango</text>
<text x="130" y="120" text-anchor="middle" dominant-baseline="middle" class="code">fruits[0]  →  &quot;apple&quot;</text>
<text x="500" y="18" text-anchor="middle" dominant-baseline="middle" class="title">DICTIONARY  (by label)</text>
<rect x="400" y="40" width="100" height="40" rx="10" class="amber"/>
<text x="450.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="code">name</text>
<rect x="510" y="40" width="160" height="40" rx="10" class="box"/>
<text x="590.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Asha&quot;</text>
<path d="M500,60 L508,60" class="arrow"/>
<rect x="400" y="90" width="100" height="40" rx="10" class="amber"/>
<text x="450.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">age</text>
<rect x="510" y="90" width="160" height="40" rx="10" class="box"/>
<text x="590.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">21</text>
<path d="M500,110 L508,110" class="arrow"/>
<rect x="400" y="140" width="100" height="40" rx="10" class="amber"/>
<text x="450.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="code">city</text>
<rect x="510" y="140" width="160" height="40" rx="10" class="box"/>
<text x="590.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Chennai&quot;</text>
<path d="M500,160 L508,160" class="arrow"/>
<text x="540" y="200" text-anchor="middle" dominant-baseline="middle" class="code">person[&quot;name&quot;]  →  &quot;Asha&quot;</text>
<rect x="120" y="150" width="480" height="70" rx="10" class="green"/>
<text x="360.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">Together: a chat is a LIST of DICTIONARIES</text>
<text x="360.0" y="195.0" text-anchor="middle" dominant-baseline="middle" class="code">[{&quot;role&quot;: &quot;user&quot;, &quot;content&quot;: &quot;Hi&quot;}, ...]</text>
</svg>
<figcaption>A list is ordered by position (starting at 0). A dictionary is looked up by a label (key).</figcaption>
</figure>
