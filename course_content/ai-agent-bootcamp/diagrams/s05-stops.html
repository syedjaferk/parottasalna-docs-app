<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="s05-stops-t s05-stops-d" xmlns="http://www.w3.org/2000/svg">
<title id="s05-stops-t">Three ways an agent stops</title>
<desc id="s05-stops-d">It finishes normally, hits the step limit, or is stopped from repeating the same call.</desc>
<defs><marker id="s05-stops-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s05-stops-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s05-stops-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s05-stops-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="40" width="210" height="110" rx="10" class="green"/>
<text x="125.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">1  Finished</text>
<text x="125.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">no tool needed →</text>
<text x="125.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">final answer</text>
<rect x="255" y="40" width="210" height="110" rx="10" class="amber"/>
<text x="360.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">2  max_steps</text>
<text x="360.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">after 6 steps →</text>
<text x="360.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">stop and apologise</text>
<rect x="490" y="40" width="210" height="110" rx="10" class="red"/>
<text x="595.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="bold">3  No repeats</text>
<text x="595.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">same call twice →</text>
<text x="595.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="small">refuse, say so</text>
<text x="360" y="185" text-anchor="middle" dominant-baseline="middle" class="small">Without limits an agent can loop forever and run up your bill</text>
</svg>
<figcaption>It finishes normally, hits the step limit, or is stopped from repeating the same call.</figcaption>
</figure>
