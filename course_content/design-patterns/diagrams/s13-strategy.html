<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s13-strategy-t s13-strategy-d" xmlns="http://www.w3.org/2000/svg">
<title id="s13-strategy-t">Strategy: plug in the way of doing the job</title>
<desc id="s13-strategy-d">The cart doesn&#x27;t care how the discount is worked out. It calls apply(total) on whichever strategy is plugged in, and you can swap it at run time.</desc>
<defs><marker id="s13-strategy-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s13-strategy-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s13-strategy-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s13-strategy-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="90" width="200" height="70" rx="10" class="blue"/>
<text x="120.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="bold">Cart</text>
<text x="120.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="code">discount.apply(total)</text>
<rect x="400" y="15" width="300" height="46" rx="10" class="box"/>
<text x="550.0" y="28.0" text-anchor="middle" dominant-baseline="middle" class="code">NoDiscount</text>
<text x="550.0" y="48.0" text-anchor="middle" dominant-baseline="middle" class="small">total</text>
<path d="M220,125 L398,38" class="arrow dashed" marker-end="url(#s13-strategy-h)"/>
<rect x="400" y="73" width="300" height="46" rx="10" class="green"/>
<text x="550.0" y="86.0" text-anchor="middle" dominant-baseline="middle" class="code">StudentDiscount</text>
<text x="550.0" y="106.0" text-anchor="middle" dominant-baseline="middle" class="small">× 0.9</text>
<path d="M220,125 L398,96" class="arrow green" marker-end="url(#s13-strategy-h-green)"/>
<rect x="400" y="131" width="300" height="46" rx="10" class="box"/>
<text x="550.0" y="144.0" text-anchor="middle" dominant-baseline="middle" class="code">PremiumDiscount</text>
<text x="550.0" y="164.0" text-anchor="middle" dominant-baseline="middle" class="small">× 0.8</text>
<path d="M220,125 L398,154" class="arrow dashed" marker-end="url(#s13-strategy-h)"/>
<rect x="400" y="189" width="300" height="46" rx="10" class="box"/>
<text x="550.0" y="202.0" text-anchor="middle" dominant-baseline="middle" class="code">FlatOff(100)</text>
<text x="550.0" y="222.0" text-anchor="middle" dominant-baseline="middle" class="small">− 100</text>
<path d="M220,125 L398,212" class="arrow dashed" marker-end="url(#s13-strategy-h)"/>
<text x="120" y="185" text-anchor="middle" dominant-baseline="middle" class="small">green = plugged in now</text>
</svg>
<figcaption>The cart doesn&#x27;t care how the discount is worked out. It calls apply(total) on whichever strategy is plugged in, and you can swap it at run time.</figcaption>
