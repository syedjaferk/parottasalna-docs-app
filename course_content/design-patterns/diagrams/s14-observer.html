<title id="s14-observer-t">Observer: publish once, every subscriber reacts</title>
<desc id="s14-observer-d">OrderService only publishes an event. The bus calls every subscribed handler. A new reaction is one subscribe() call; the publisher never changes.</desc>

<rect x="20" y="95" width="160" height="60" rx="10" class="blue"/>

<text x="100.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="code">publish(...)</text>

<rect x="480" y="68" width="220" height="46" rx="10" class="green"/>
