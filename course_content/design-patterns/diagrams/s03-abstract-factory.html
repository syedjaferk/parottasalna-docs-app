<title id="s03-abstract-factory-t">Abstract Factory: pick a family once</title>
<desc id="s03-abstract-factory-d">run_app() only talks to a factory. Each factory makes a whole matching family, so cloud storage with a local queue can&#x27;t happen.</desc>
<defs><marker id="s03-abstract-factory-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s03-abstract-factory-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s03-abstract-factory-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s03-abstract-factory-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="250" y="15" width="220" height="46" rx="10" class="blue"/>
<text x="360.0" y="38.0" text-anchor="middle" dominant-baseline="middle" class="code">run_app(factory)</text>
<rect x="30" y="95" width="300" height="46" rx="10" class="green"/>
<text x="180.0" y="118.0" text-anchor="middle" dominant-baseline="middle" class="bold">LocalFactory</text>
<path d="M360,61 L180,93" class="arrow" marker-end="url(#s03-abstract-factory-h)"/>
<rect x="40" y="175" width="130" height="44" rx="10" class="box"/>
<text x="105.0" y="197.0" text-anchor="middle" dominant-baseline="middle" class="code">FileStorage</text>
<path d="M180,141 L105,173" class="arrow" marker-end="url(#s03-abstract-factory-h)"/>
<rect x="190" y="175" width="130" height="44" rx="10" class="box"/>
<text x="255.0" y="197.0" text-anchor="middle" dominant-baseline="middle" class="code">MemoryQueue</text>
<path d="M180,141 L255,173" class="arrow" marker-end="url(#s03-abstract-factory-h)"/>
<rect x="390" y="95" width="300" height="46" rx="10" class="amber"/>
<text x="540.0" y="118.0" text-anchor="middle" dominant-baseline="middle" class="bold">AWSFactory</text>

<rect x="400" y="175" width="130" height="44" rx="10" class="box"/>

<path d="M540,141 L465,173" class="arrow" marker-end="url(#s03-abstract-factory-h)"/>
<rect x="550" y="175" width="130" height="44" rx="10" class="box"/>
<text x="615.0" y="197.0" text-anchor="middle" dominant-baseline="middle" class="code">SQSQueue</text>

<line x1="240" y1="245" x2="480" y2="245" class="line cut"/>
<text x="360" y="233" text-anchor="middle" dominant-baseline="middle" class="small">S3Storage + MemoryQueue: can&#x27;t be mixed</text>
</svg>
