<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s01-singleton-t s01-singleton-d" xmlns="http://www.w3.org/2000/svg">
<title id="s01-singleton-t">Singleton: everyone gets the same object</title>
<desc id="s01-singleton-d">The first Config() call creates the object. Every later call returns that same object, so a change made through one variable is seen through all of them.</desc>
<defs><marker id="s01-singleton-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-singleton-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-singleton-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-singleton-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="190" height="50" rx="10" class="blue"/>
<text x="115.0" y="35.0" text-anchor="middle" dominant-baseline="middle" class="code">a = Config()</text>
<text x="115.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="small">settings page</text>
<path d="M210,45 L418,110" class="arrow green" marker-end="url(#s01-singleton-h-green)"/>
<rect x="20" y="88" width="190" height="50" rx="10" class="blue"/>
<text x="115.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="code">b = Config()</text>
<text x="115.0" y="123.0" text-anchor="middle" dominant-baseline="middle" class="small">API handler</text>
<path d="M210,113 L418,110" class="arrow" marker-end="url(#s01-singleton-h)"/>
<rect x="20" y="156" width="190" height="50" rx="10" class="blue"/>
<text x="115.0" y="171.0" text-anchor="middle" dominant-baseline="middle" class="code">c = Config()</text>
<text x="115.0" y="191.0" text-anchor="middle" dominant-baseline="middle" class="small">background job</text>
<path d="M210,181 L418,110" class="arrow" marker-end="url(#s01-singleton-h)"/>
<text x="300" y="40" text-anchor="middle" dominant-baseline="middle" class="small">first call: create</text>
<text x="330" y="222" text-anchor="middle" dominant-baseline="middle" class="small">later calls: return the same one</text>
<rect x="420" y="60" width="280" height="100" rx="10" class="green"/>
<text x="560.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="bold">the one Config object</text>
<text x="560.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">settings = {&quot;debug&quot;: True}</text>
<text x="560.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">a is b is c  →  True</text>
</svg>
<figcaption>The first Config() call creates the object. Every later call returns that same object, so a change made through one variable is seen through all of them.</figcaption>
</figure>
