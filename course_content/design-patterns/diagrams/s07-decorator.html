<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s07-decorator-t s07-decorator-d" xmlns="http://www.w3.org/2000/svg">
<title id="s07-decorator-t">Decorator: wrap, keep the interface, add a little</title>
<desc id="s07-decorator-d">Sugar wraps Milk, which wraps Espresso. Each layer passes the call inward and adds its own part on the way out.</desc>
<defs><marker id="s07-decorator-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s07-decorator-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s07-decorator-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s07-decorator-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="440" height="200" rx="10" class="amber"/>
<text x="40" y="42" text-anchor="start" dominant-baseline="middle" class="bold">Sugar   +5</text>
<rect x="50" y="60" width="380" height="145" rx="10" class="blue"/>
<text x="70" y="82" text-anchor="start" dominant-baseline="middle" class="bold">Milk   +20</text>
<rect x="80" y="100" width="320" height="90" rx="10" class="green"/>
<text x="240.0" y="135.0" text-anchor="middle" dominant-baseline="middle" class="bold">Espresso</text>
<text x="240.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="code">cost() = 100</text>
<path d="M470,120 L520,120" class="arrow" marker-end="url(#s07-decorator-h)"/>
<rect x="525" y="70" width="180" height="100" rx="10" class="box"/>
<text x="615.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">order.cost()</text>
<text x="615.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">100 + 20 + 5</text>
<text x="615.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold"> = 125</text>
</svg>
<figcaption>Sugar wraps Milk, which wraps Espresso. Each layer passes the call inward and adds its own part on the way out.</figcaption>
</figure>
