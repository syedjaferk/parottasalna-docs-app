<figure class="diagram">
<svg class="dg" viewBox="0 0 720 300" role="img" aria-labelledby="map-patterns-t map-patterns-d" xmlns="http://www.w3.org/2000/svg">
<title id="map-patterns-t">The three families of design patterns</title>
<desc id="map-patterns-d">Creational patterns are about making objects, structural about fitting them together, behavioural about how they talk and share work.</desc>
<defs><marker id="map-patterns-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="map-patterns-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="map-patterns-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="map-patterns-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="15" width="200" height="56" rx="10" class="blue"/>
<text x="120.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">CREATIONAL</text>
<text x="120.0" y="53.0" text-anchor="middle" dominant-baseline="middle" class="small">How objects are made</text>
<rect x="40" y="85" width="160" height="24" rx="6" class="box"/>
<text x="120.0" y="97.0" text-anchor="middle" dominant-baseline="middle" class="small">1 Singleton</text>
<rect x="40" y="114" width="160" height="24" rx="6" class="box"/>
<text x="120.0" y="126.0" text-anchor="middle" dominant-baseline="middle" class="small">2 Factory Method</text>
<rect x="40" y="143" width="160" height="24" rx="6" class="box"/>
<text x="120.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="small">3 Abstract Factory</text>
<rect x="40" y="172" width="160" height="24" rx="6" class="box"/>
<text x="120.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="small">4 Builder</text>
<rect x="40" y="201" width="160" height="24" rx="6" class="box"/>
<text x="120.0" y="213.0" text-anchor="middle" dominant-baseline="middle" class="small">5 Prototype</text>
<rect x="260" y="15" width="200" height="56" rx="10" class="green"/>
<text x="360.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">STRUCTURAL</text>
<text x="360.0" y="53.0" text-anchor="middle" dominant-baseline="middle" class="small">How objects fit together</text>
<rect x="280" y="85" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="97.0" text-anchor="middle" dominant-baseline="middle" class="small">6 Adapter</text>
<rect x="280" y="114" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="126.0" text-anchor="middle" dominant-baseline="middle" class="small">7 Decorator</text>
<rect x="280" y="143" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="small">8 Facade</text>
<rect x="280" y="172" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="small">9 Proxy</text>
<rect x="280" y="201" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="213.0" text-anchor="middle" dominant-baseline="middle" class="small">10 Composite</text>
<rect x="280" y="230" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="242.0" text-anchor="middle" dominant-baseline="middle" class="small">11 Bridge</text>
<rect x="280" y="259" width="160" height="24" rx="6" class="box"/>
<text x="360.0" y="271.0" text-anchor="middle" dominant-baseline="middle" class="small">12 Flyweight</text>
<rect x="500" y="15" width="200" height="56" rx="10" class="amber"/>
<text x="600.0" y="33.0" text-anchor="middle" dominant-baseline="middle" class="bold">BEHAVIOURAL</text>
<text x="600.0" y="53.0" text-anchor="middle" dominant-baseline="middle" class="small">How objects work together</text>
<rect x="520" y="85" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="97.0" text-anchor="middle" dominant-baseline="middle" class="small">13 Strategy</text>
<rect x="520" y="114" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="126.0" text-anchor="middle" dominant-baseline="middle" class="small">14 Observer</text>
<rect x="520" y="143" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="small">15 Command</text>
<rect x="520" y="172" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="184.0" text-anchor="middle" dominant-baseline="middle" class="small">16 State</text>
<rect x="520" y="201" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="213.0" text-anchor="middle" dominant-baseline="middle" class="small">17 Template Method</text>
<rect x="520" y="230" width="160" height="24" rx="6" class="box"/>
<text x="600.0" y="242.0" text-anchor="middle" dominant-baseline="middle" class="small">18 Chain of Resp.</text>
</svg>
<figcaption>Creational patterns are about making objects, structural about fitting them together, behavioural about how they talk and share work.</figcaption>
</figure>
