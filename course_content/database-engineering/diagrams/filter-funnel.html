<figure class="diagram">
<svg class="dg" viewBox="0 0 760 250" role="img" aria-labelledby="filter-funnel-t filter-funnel-d" xmlns="http://www.w3.org/2000/svg">
<title id="filter-funnel-t">Filters narrow the rows</title>
<desc id="filter-funnel-d">Eleven movies go in; WHERE genre = &#x27;Action&#x27; keeps four; AND year &gt; 2000 keeps three.</desc>
<defs><marker id="filter-funnel-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="filter-funnel-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="filter-funnel-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="filter-funnel-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="60.0" y="20" width="640" height="54" rx="10" class="box"/>
<text x="380.0" y="37.0" text-anchor="middle" dominant-baseline="middle" class="bold">11 rows</text>
<text x="380.0" y="57.0" text-anchor="middle" dominant-baseline="middle" class="small">all movies</text>
<rect x="220.0" y="90" width="320" height="54" rx="10" class="blue"/>
<text x="380.0" y="107.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 rows</text>
<text x="380.0" y="127.0" text-anchor="middle" dominant-baseline="middle" class="small">genre = &#x27;Action&#x27;</text>
<rect x="260.0" y="160" width="240" height="54" rx="10" class="green"/>
<text x="380.0" y="177.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 rows</text>
<text x="380.0" y="197.0" text-anchor="middle" dominant-baseline="middle" class="small">AND year &gt; 2000</text>
<text x="380" y="230" text-anchor="middle" dominant-baseline="middle" class="small">each condition only removes rows, never adds</text>
</svg>
<figcaption>Eleven movies go in; WHERE genre = &#x27;Action&#x27; keeps four; AND year &gt; 2000 keeps three.</figcaption>
</figure>
