<figure class="diagram">
<svg class="dg" viewBox="0 0 760 260" role="img" aria-labelledby="step-shape-t step-shape-d" xmlns="http://www.w3.org/2000/svg">
<title id="step-shape-t">A step load shape</title>
<desc id="step-shape-d">A LoadTestShape adds a few users every few seconds, so you can see at which step response times start to climb.</desc>
<defs><marker id="step-shape-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="step-shape-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="step-shape-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="step-shape-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<line x1="60" y1="200" x2="700" y2="200" class="line"/>
<line x1="60" y1="30" x2="60" y2="200" class="line"/>
<rect x="60" y="160" width="180" height="40" rx="0" class="blue"/>
<text x="150" y="180.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 users</text>
<text x="150" y="218" text-anchor="middle" dominant-baseline="middle" class="small">0-3 s</text>
<rect x="240" y="120" width="180" height="80" rx="0" class="blue"/>
<text x="330" y="160.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 users</text>
<text x="330" y="218" text-anchor="middle" dominant-baseline="middle" class="small">3-6 s</text>
<rect x="420" y="80" width="180" height="120" rx="0" class="green"/>
<text x="510" y="140.0" text-anchor="middle" dominant-baseline="middle" class="bold">6 users</text>
<text x="510" y="218" text-anchor="middle" dominant-baseline="middle" class="small">6-9 s</text>
<text x="380" y="245" text-anchor="middle" dominant-baseline="middle" class="small">step_time = 3 s, +2 users per step, total_time = 9 s</text>
</svg>
<figcaption>A LoadTestShape adds a few users every few seconds, so you can see at which step response times start to climb.</figcaption>
</figure>
