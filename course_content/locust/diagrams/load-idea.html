<figure class="diagram">
<svg class="dg" viewBox="0 0 760 250" role="img" aria-labelledby="load-idea-t load-idea-d" xmlns="http://www.w3.org/2000/svg">
<title id="load-idea-t">What a load test does</title>
<desc id="load-idea-d">Locust runs many simulated users against your service while you watch response time, requests per second and failures.</desc>
<defs><marker id="load-idea-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="load-idea-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="load-idea-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="load-idea-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="70" width="190" height="100" rx="10" class="blue"/>
<text x="115.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="bold">Locust</text>
<text x="115.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">simulated users</text>
<text x="115.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="code">u1 u2 u3 ... u500</text>
<rect x="320" y="70" width="190" height="100" rx="10" class="amber"/>
<text x="415.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="bold">Your service</text>
<text x="415.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">web app + database</text>
<rect x="600" y="40" width="140" height="160" rx="10" class="green"/>
<text x="670.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="bold">You watch</text>
<text x="670.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">response time</text>
<text x="670.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="small">requests/second</text>
<text x="670.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">failures</text>
<path d="M212,120 L318,120" class="arrow blue" marker-end="url(#load-idea-h-blue)"/>
<text x="265" y="102" text-anchor="middle" dominant-baseline="middle" class="small">requests</text>
<path d="M512,120 L598,120" class="arrow green" marker-end="url(#load-idea-h-green)"/>
<text x="555" y="102" text-anchor="middle" dominant-baseline="middle" class="small">numbers</text>
</svg>
<figcaption>Locust runs many simulated users against your service while you watch response time, requests per second and failures.</figcaption>
</figure>
