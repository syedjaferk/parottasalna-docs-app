<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="s05-types-t s05-types-d" xmlns="http://www.w3.org/2000/svg">
<title id="s05-types-t">The three Elastic Load Balancer types</title>
<desc id="s05-types-d">Pick by what you need to see in the traffic: HTTP details (ALB), raw TCP/UDP speed (NLB) or security appliances (GWLB).</desc>
<defs><marker id="s05-types-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s05-types-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s05-types-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s05-types-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="215" height="60" rx="10" class="blue"/>
<text x="127.5" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">ALB</text>
<text x="127.5" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">Layer 7 · HTTP/HTTPS</text>
<rect x="20" y="90" width="215" height="110" rx="10" class="box"/>
<text x="127.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">path &amp; host routing</text>
<text x="127.5" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">targets: EC2, IP, Lambda</text>
<text x="127.5" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">WAF, auth, redirects</text>
<rect x="255" y="20" width="215" height="60" rx="10" class="green"/>
<text x="362.5" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">NLB</text>
<text x="362.5" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">Layer 4 · TCP/UDP/TLS</text>
<rect x="255" y="90" width="215" height="110" rx="10" class="box"/>
<text x="362.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">millions of req/sec</text>
<text x="362.5" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">static IP per AZ</text>
<text x="362.5" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">lowest latency</text>
<rect x="490" y="20" width="215" height="60" rx="10" class="purple"/>
<text x="597.5" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">GWLB</text>
<text x="597.5" y="60.0" text-anchor="middle" dominant-baseline="middle" class="small">Layer 3 · IP packets</text>
<rect x="490" y="90" width="215" height="110" rx="10" class="box"/>
<text x="597.5" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">firewalls / IDS appliances</text>
<text x="597.5" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">GENEVE port 6081</text>
<text x="597.5" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">transparent bump-in-wire</text>
</svg>
<figcaption>Pick by what you need to see in the traffic: HTTP details (ALB), raw TCP/UDP speed (NLB) or security appliances (GWLB).</figcaption>
</figure>
