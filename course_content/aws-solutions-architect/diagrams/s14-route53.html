<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="s14-route53-t s14-route53-d" xmlns="http://www.w3.org/2000/svg">
<title id="s14-route53-t">Pointing a domain to AWS with Route 53</title>
<desc id="s14-route53-d">The registrar is told which name servers own the domain. Route 53&#x27;s hosted zone then answers with records that point at your load balancer, bucket or server.</desc>
<defs><marker id="s14-route53-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s14-route53-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s14-route53-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s14-route53-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="140" height="70" rx="10" class="box"/>
<text x="90.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Registrar</text>
<text x="90.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="small">GoDaddy / R53</text>
<path d="M160,65 L238,65" class="arrow" marker-end="url(#s14-route53-h)"/>
<text x="199" y="52" text-anchor="middle" dominant-baseline="middle" class="small">NS records</text>
<rect x="240" y="20" width="260" height="220" rx="14" class="amber"/>
<text x="370" y="40" text-anchor="middle" dominant-baseline="middle" class="bold">Hosted zone example.com</text>
<rect x="255" y="55" width="230" height="36" rx="10" class="green"/>
<text x="370.0" y="73.0" text-anchor="middle" dominant-baseline="middle" class="small">A (Alias) example.com → ALB</text>
<rect x="255" y="99" width="230" height="36" rx="10" class="box"/>
<text x="370.0" y="117.0" text-anchor="middle" dominant-baseline="middle" class="small">CNAME www → example.com</text>
<rect x="255" y="143" width="230" height="36" rx="10" class="box"/>
<text x="370.0" y="161.0" text-anchor="middle" dominant-baseline="middle" class="small">MX → mail provider</text>
<rect x="255" y="187" width="230" height="36" rx="10" class="box"/>
<text x="370.0" y="205.0" text-anchor="middle" dominant-baseline="middle" class="small">TXT → verification</text>
<path d="M485,73 L548,73" class="arrow green" marker-end="url(#s14-route53-h-green)"/>
<rect x="550" y="40" width="150" height="65" rx="10" class="blue"/>
<text x="625.0" y="62.5" text-anchor="middle" dominant-baseline="middle">ALB</text>
<text x="625.0" y="82.5" text-anchor="middle" dominant-baseline="middle" class="small">→ EC2 targets</text>
<rect x="550" y="130" width="150" height="90" rx="10" class="box"/>
<text x="625.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">routing policies:</text>
<text x="625.0" y="165.0" text-anchor="middle" dominant-baseline="middle" class="small">simple · weighted</text>
<text x="625.0" y="185.0" text-anchor="middle" dominant-baseline="middle" class="small">latency · failover</text>
<text x="625.0" y="205.0" text-anchor="middle" dominant-baseline="middle" class="small">geolocation…</text>
</svg>
<figcaption>The registrar is told which name servers own the domain. Route 53&#x27;s hosted zone then answers with records that point at your load balancer, bucket or server.</figcaption>
</figure>
