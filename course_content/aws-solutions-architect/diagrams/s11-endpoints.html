<figure class="diagram">
<svg class="dg" viewBox="0 0 720 270" role="img" aria-labelledby="s11-endpoints-t s11-endpoints-d" xmlns="http://www.w3.org/2000/svg">
<title id="s11-endpoints-t">Reaching AWS services privately with VPC endpoints</title>
<desc id="s11-endpoints-d">A gateway endpoint (S3, DynamoDB) is a route in the route table and is free. An interface endpoint puts a private network card (ENI) in your subnet for almost any other service, using PrivateLink.</desc>
<defs><marker id="s11-endpoints-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s11-endpoints-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s11-endpoints-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s11-endpoints-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="420" height="230" rx="14" class="blue"/>
<text x="120" y="38" text-anchor="middle" dominant-baseline="middle" class="bold">VPC · private subnet</text>
<rect x="40" y="60" width="150" height="60" rx="10" class="box"/>
<text x="115.0" y="80.0" text-anchor="middle" dominant-baseline="middle">app EC2</text>
<text x="115.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">no internet</text>
<rect x="40" y="150" width="180" height="80" rx="10" class="green"/>
<text x="130.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">route table</text>
<text x="130.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="code">pl-s3 → vpce-gw</text>
<text x="130.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">(gateway endpoint)</text>
<rect x="250" y="150" width="170" height="80" rx="10" class="purple"/>
<text x="335.0" y="170.0" text-anchor="middle" dominant-baseline="middle">Interface endpoint</text>
<text x="335.0" y="190.0" text-anchor="middle" dominant-baseline="middle" class="code">ENI 10.0.2.40</text>
<text x="335.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">private DNS</text>
<path d="M190,90 L558,70" class="arrow green" marker-end="url(#s11-endpoints-h-green)"/>
<text x="310" y="66" text-anchor="middle" dominant-baseline="middle" class="small">via gateway endpoint (free)</text>
<rect x="560" y="40" width="140" height="60" rx="10" class="amber"/>
<text x="630.0" y="60.0" text-anchor="middle" dominant-baseline="middle">Amazon S3</text>
<text x="630.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="small">DynamoDB</text>
<path d="M120,120 L300,148" class="arrow" marker-end="url(#s11-endpoints-h)"/>
<path d="M420,190 L558,190" class="arrow" marker-end="url(#s11-endpoints-h)"/>
<text x="490" y="178" text-anchor="middle" dominant-baseline="middle" class="small">PrivateLink</text>
<rect x="560" y="160" width="140" height="60" rx="10" class="amber"/>
<text x="630.0" y="180.0" text-anchor="middle" dominant-baseline="middle">SQS, SSM,</text>
<text x="630.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">Secrets Mgr, ECR…</text>
</svg>
<figcaption>A gateway endpoint (S3, DynamoDB) is a route in the route table and is free. An interface endpoint puts a private network card (ENI) in your subnet for almost any other service, using PrivateLink.</figcaption>
</figure>
