<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="s12-waf-t s12-waf-d" xmlns="http://www.w3.org/2000/svg">
<title id="s12-waf-t">AWS WAF filters requests before your app sees them</title>
<desc id="s12-waf-d">A Web ACL is attached to CloudFront, an ALB or API Gateway. Its rules run in priority order; the first match decides Allow or Block, and the default action handles the rest.</desc>
<defs><marker id="s12-waf-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s12-waf-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s12-waf-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s12-waf-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="40" width="140" height="55" rx="10" class="box"/>
<text x="90.0" y="57.5" text-anchor="middle" dominant-baseline="middle">Student</text>
<text x="90.0" y="77.5" text-anchor="middle" dominant-baseline="middle" class="small">GET /courses</text>
<rect x="20" y="150" width="140" height="55" rx="10" class="red"/>
<text x="90.0" y="167.5" text-anchor="middle" dominant-baseline="middle">Attacker</text>
<text x="90.0" y="187.5" text-anchor="middle" dominant-baseline="middle" class="code">&#x27; OR 1=1 --</text>
<rect x="200" y="20" width="280" height="210" rx="14" class="amber"/>
<text x="340" y="40" text-anchor="middle" dominant-baseline="middle" class="bold">Web ACL</text>
<rect x="215" y="55" width="250" height="28" rx="10" class="box"/>
<text x="340.0" y="69.0" text-anchor="middle" dominant-baseline="middle" class="small">1 · IP block list</text>
<rect x="215" y="89" width="250" height="28" rx="10" class="box"/>
<text x="340.0" y="103.0" text-anchor="middle" dominant-baseline="middle" class="small">2 · rate limit 300 / 5 min</text>
<rect x="215" y="123" width="250" height="28" rx="10" class="box"/>
<text x="340.0" y="137.0" text-anchor="middle" dominant-baseline="middle" class="small">3 · SQL injection rules</text>
<rect x="215" y="157" width="250" height="28" rx="10" class="box"/>
<text x="340.0" y="171.0" text-anchor="middle" dominant-baseline="middle" class="small">4 · common exploits (XSS…)</text>
<rect x="215" y="191" width="250" height="28" rx="10" class="box"/>
<text x="340.0" y="205.0" text-anchor="middle" dominant-baseline="middle" class="small">default: Allow</text>
<path d="M160,67 L198,67" class="arrow green" marker-end="url(#s12-waf-h-green)"/>
<path d="M160,177 L198,177" class="arrow red" marker-end="url(#s12-waf-h-red)"/>
<path d="M480,90 L548,90" class="arrow green" marker-end="url(#s12-waf-h-green)"/>
<text x="514" y="78" text-anchor="middle" dominant-baseline="middle" class="small">allowed</text>
<rect x="550" y="60" width="150" height="60" rx="10" class="green"/>
<text x="625.0" y="80.0" text-anchor="middle" dominant-baseline="middle">ALB → app</text>
<text x="625.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">only clean traffic</text>
<path d="M480,160 L548,170" class="arrow red" marker-end="url(#s12-waf-h-red)"/>
<text x="514" y="182" text-anchor="middle" dominant-baseline="middle" class="small">blocked</text>
<rect x="550" y="150" width="150" height="50" rx="10" class="red"/>
<text x="625.0" y="175.0" text-anchor="middle" dominant-baseline="middle" class="bold">403 Forbidden</text>
</svg>
<figcaption>A Web ACL is attached to CloudFront, an ALB or API Gateway. Its rules run in priority order; the first match decides Allow or Block, and the default action handles the rest.</figcaption>
</figure>
