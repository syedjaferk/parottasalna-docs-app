<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s02-evaluation-t s02-evaluation-d" xmlns="http://www.w3.org/2000/svg">
<title id="s02-evaluation-t">How IAM decides allow or deny</title>
<desc id="s02-evaluation-d">Everything starts as denied. An explicit Allow grants access, but any explicit Deny anywhere always wins.</desc>
<defs><marker id="s02-evaluation-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s02-evaluation-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s02-evaluation-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s02-evaluation-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="85" width="140" height="60" rx="10" class="box"/>
<text x="90.0" y="105.0" text-anchor="middle" dominant-baseline="middle">Request</text>
<text x="90.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">s3:DeleteObject</text>
<path d="M160,115 L198,115" class="arrow" marker-end="url(#s02-evaluation-h)"/>
<rect x="200" y="80" width="150" height="70" rx="10" class="amber"/>
<text x="275.0" y="105.0" text-anchor="middle" dominant-baseline="middle">Explicit Deny</text>
<text x="275.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">in any policy?</text>
<path d="M275,80 L275,40 L548,40" class="arrow red" marker-end="url(#s02-evaluation-h-red)"/>
<text x="410" y="28" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<rect x="550" y="15" width="150" height="50" rx="10" class="red"/>
<text x="625.0" y="40.0" text-anchor="middle" dominant-baseline="middle" class="bold">DENY</text>
<path d="M350,115 L388,115" class="arrow" marker-end="url(#s02-evaluation-h)"/>
<text x="369" y="102" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<rect x="390" y="80" width="140" height="70" rx="10" class="amber"/>
<text x="460.0" y="105.0" text-anchor="middle" dominant-baseline="middle">Explicit Allow</text>
<text x="460.0" y="125.0" text-anchor="middle" dominant-baseline="middle" class="small">anywhere?</text>
<path d="M530,115 L548,115" class="arrow green" marker-end="url(#s02-evaluation-h-green)"/>
<rect x="550" y="90" width="150" height="50" rx="10" class="green"/>
<text x="625.0" y="115.0" text-anchor="middle" dominant-baseline="middle" class="bold">ALLOW</text>
<text x="560" y="82" text-anchor="middle" dominant-baseline="middle" class="small">yes</text>
<path d="M460,150 L460,190 L548,190" class="arrow red" marker-end="url(#s02-evaluation-h-red)"/>
<text x="500" y="178" text-anchor="middle" dominant-baseline="middle" class="small">no</text>
<rect x="550" y="165" width="150" height="50" rx="10" class="red"/>
<text x="625.0" y="180.0" text-anchor="middle" dominant-baseline="middle">DENY</text>
<text x="625.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">(implicit)</text>
</svg>
<figcaption>Everything starts as denied. An explicit Allow grants access, but any explicit Deny anywhere always wins.</figcaption>
</figure>
