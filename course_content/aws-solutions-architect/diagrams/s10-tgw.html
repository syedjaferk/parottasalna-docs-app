<title id="s10-tgw-t">Transit Gateway: one hub for many networks</title>
<desc id="s10-tgw-d">Each VPC (and the office VPN) attaches once to the Transit Gateway. The TGW route tables decide who can reach whom, and routing through the hub is transitive.</desc>

<rect x="270" y="105" width="180" height="70" rx="10" class="amber"/>

<rect x="520" y="20" width="180" height="60" rx="10" class="blue"/>
<text x="610.0" y="40.0" text-anchor="middle" dominant-baseline="middle">VPC shared</text>
