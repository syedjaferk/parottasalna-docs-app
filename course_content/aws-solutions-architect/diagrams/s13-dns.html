<svg class="dg" viewBox="0 0 720 280" role="img" aria-labelledby="s13-dns-t s13-dns-d" xmlns="http://www.w3.org/2000/svg">
<title id="s13-dns-t">How a name becomes an IP address</title>
<desc id="s13-dns-d">The resolver asks the root, then the .com servers, then the domain&#x27;s own (authoritative) servers, and caches the answer for the record&#x27;s TTL.</desc>
<defs><marker id="s13-dns-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s13-dns-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s13-dns-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s13-dns-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="110" width="130" height="60" rx="10" class="box"/>
<text x="85.0" y="130.0" text-anchor="middle" dominant-baseline="middle">Browser</text>
<text x="85.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">learn.example.com</text>
<path d="M150,140 L218,140" class="arrow" marker-end="url(#s13-dns-h)"/>
<text x="184" y="128" text-anchor="middle" dominant-baseline="middle" class="small">1</text>
<rect x="220" y="100" width="160" height="80" rx="10" class="blue"/>
<text x="300.0" y="120.0" text-anchor="middle" dominant-baseline="middle">Resolver</text>
<text x="300.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">ISP / 8.8.8.8 /</text>
<text x="300.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="small">VPC .2 resolver</text>
<rect x="520" y="20" width="180" height="70" rx="10" class="amber"/>
<text x="610.0" y="45.0" text-anchor="middle" dominant-baseline="middle">Root server</text>
<text x="610.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="small">“ask .com”</text>
<path d="M380,140 L518,55" class="arrow" marker-end="url(#s13-dns-h)"/>
<text x="440" y="50" text-anchor="middle" dominant-baseline="middle" class="small">2</text>
<rect x="520" y="105" width="180" height="70" rx="10" class="amber"/>
<text x="610.0" y="130.0" text-anchor="middle" dominant-baseline="middle">TLD .com</text>
<text x="610.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">“ask ns-1.awsdns…”</text>
<path d="M380,140 L518,140" class="arrow" marker-end="url(#s13-dns-h)"/>
<text x="448" y="128" text-anchor="middle" dominant-baseline="middle" class="small">3</text>
<rect x="520" y="190" width="180" height="70" rx="10" class="green"/>
<text x="610.0" y="215.0" text-anchor="middle" dominant-baseline="middle">Authoritative</text>
<text x="610.0" y="235.0" text-anchor="middle" dominant-baseline="middle" class="small">A 13.234.5.6</text>
<path d="M380,140 L518,225" class="arrow" marker-end="url(#s13-dns-h)"/>
<text x="456" y="220" text-anchor="middle" dominant-baseline="middle" class="small">4</text>
<path d="M220,165 L150,165" class="arrow green" marker-end="url(#s13-dns-h-green)"/>
<text x="185" y="200" text-anchor="middle" dominant-baseline="middle" class="small">5 · IP (cached for TTL)</text>
</svg>
<figcaption>The resolver asks the root, then the .com servers, then the domain&#x27;s own (authoritative) servers, and caches the answer for the record&#x27;s TTL.</figcaption>
