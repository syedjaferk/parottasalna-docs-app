<figure class="diagram">
<svg class="dg" viewBox="0 0 720 300" role="img" aria-labelledby="s07-vpc-t s07-vpc-d" xmlns="http://www.w3.org/2000/svg">
<title id="s07-vpc-t">A VPC with a public and a private subnet</title>
<desc id="s07-vpc-d">A subnet is public only because its route table sends 0.0.0.0/0 to the Internet Gateway. The private subnet has only the local route, so the internet can&#x27;t reach it.</desc>
<defs><marker id="s07-vpc-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s07-vpc-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s07-vpc-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s07-vpc-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="280" y="10" width="160" height="40" rx="10" class="box"/>
<text x="360.0" y="30.0" text-anchor="middle" dominant-baseline="middle">Internet</text>
<line x1="360" y1="50" x2="360" y2="70" class="line"/>
<rect x="290" y="70" width="140" height="34" rx="10" class="amber"/>
<text x="360.0" y="87.0" text-anchor="middle" dominant-baseline="middle" class="small">Internet Gateway</text>
<rect x="20" y="115" width="680" height="175" rx="14" class="blue"/>
<text x="110" y="133" text-anchor="middle" dominant-baseline="middle" class="bold">VPC 10.0.0.0/16</text>
<rect x="40" y="145" width="310" height="130" rx="10" class="green"/>
<text x="195" y="163" text-anchor="middle" dominant-baseline="middle" class="bold">Public subnet 10.0.1.0/24</text>
<rect x="55" y="175" width="120" height="50" rx="10" class="box"/>
<text x="115.0" y="190.0" text-anchor="middle" dominant-baseline="middle">web EC2</text>
<text x="115.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">public IP</text>
<rect x="180" y="175" width="162" height="85" rx="10" class="box"/>
<text x="261.0" y="197.5" text-anchor="middle" dominant-baseline="middle" class="small">route table</text>
<text x="261.0" y="217.5" text-anchor="middle" dominant-baseline="middle" class="code">10.0.0.0/16 → local</text>
<text x="261.0" y="237.5" text-anchor="middle" dominant-baseline="middle" class="code">0.0.0.0/0 → igw</text>
<rect x="370" y="145" width="310" height="130" rx="10" class="purple"/>
<text x="525" y="163" text-anchor="middle" dominant-baseline="middle" class="bold">Private subnet 10.0.2.0/24</text>
<rect x="385" y="175" width="120" height="50" rx="10" class="box"/>
<text x="445.0" y="190.0" text-anchor="middle" dominant-baseline="middle">app / db</text>
<text x="445.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="small">private IP only</text>
<rect x="510" y="175" width="162" height="85" rx="10" class="box"/>
<text x="591.0" y="197.5" text-anchor="middle" dominant-baseline="middle" class="small">route table</text>
<text x="591.0" y="217.5" text-anchor="middle" dominant-baseline="middle" class="code">10.0.0.0/16 → local</text>
<text x="591.0" y="237.5" text-anchor="middle" dominant-baseline="middle" class="small">(no internet)</text>
<line x1="360" y1="104" x2="360" y2="145" class="line"/>
<path d="M115,225 L115,268 L445,268 L445,227" class="arrow green" marker-end="url(#s07-vpc-h-green)"/>
<text x="360" y="256" text-anchor="middle" dominant-baseline="middle" class="small">local</text>
</svg>
<figcaption>A subnet is public only because its route table sends 0.0.0.0/0 to the Internet Gateway. The private subnet has only the local route, so the internet can&#x27;t reach it.</figcaption>
</figure>
