<figure class="diagram">
<svg class="dg" viewBox="0 0 720 270" role="img" aria-labelledby="g03-diff-t g03-diff-d" xmlns="http://www.w3.org/2000/svg">
<title id="g03-diff-t">What git diff compares</title>
<desc id="g03-diff-d">git diff compares working folder to staging, git diff --staged compares staging to the last commit, git diff HEAD compares working folder to the last commit.</desc>
<defs><marker id="g03-diff-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g03-diff-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g03-diff-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g03-diff-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="170" height="46" rx="10" class="blue"/>
<text x="105.0" y="43.0" text-anchor="middle" dominant-baseline="middle" class="bold">Working folder</text>
<rect x="275" y="20" width="170" height="46" rx="10" class="amber"/>
<text x="360.0" y="43.0" text-anchor="middle" dominant-baseline="middle" class="bold">Staging area</text>
<rect x="530" y="20" width="170" height="46" rx="10" class="green"/>
<text x="615.0" y="43.0" text-anchor="middle" dominant-baseline="middle" class="bold">Last commit (HEAD)</text>
<line x1="105" y1="112" x2="360" y2="112" class="line"/>
<line x1="105" y1="105" x2="105" y2="119" class="line"/>
<line x1="360" y1="105" x2="360" y2="119" class="line"/>
<text x="232.5" y="98" text-anchor="middle" dominant-baseline="middle" class="code">git diff</text>
<text x="232.5" y="130" text-anchor="middle" dominant-baseline="middle" class="small">edited, not yet staged</text>
<line x1="360" y1="160" x2="615" y2="160" class="line"/>
<line x1="360" y1="153" x2="360" y2="167" class="line"/>
<line x1="615" y1="153" x2="615" y2="167" class="line"/>
<text x="487.5" y="146" text-anchor="middle" dominant-baseline="middle" class="code">git diff --staged</text>
<text x="487.5" y="178" text-anchor="middle" dominant-baseline="middle" class="small">staged, not yet committed</text>
<line x1="105" y1="208" x2="615" y2="208" class="line"/>
<line x1="105" y1="201" x2="105" y2="215" class="line"/>
<line x1="615" y1="201" x2="615" y2="215" class="line"/>
<text x="360.0" y="194" text-anchor="middle" dominant-baseline="middle" class="code">git diff HEAD</text>
<text x="360.0" y="226" text-anchor="middle" dominant-baseline="middle" class="small">everything changed since the last commit</text>
<line x1="105" y1="66" x2="105" y2="105" class="line"/>
<line x1="360" y1="66" x2="360" y2="105" class="line"/>
<line x1="615" y1="66" x2="615" y2="105" class="line"/>
</svg>
<figcaption>git diff compares working folder to staging, git diff --staged compares staging to the last commit, git diff HEAD compares working folder to the last commit.</figcaption>
</figure>
