<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="g02-areas-t g02-areas-d" xmlns="http://www.w3.org/2000/svg">
<title id="g02-areas-t">The three areas of Git</title>
<desc id="g02-areas-d">You edit in the working folder, git add moves changes to the staging area, git commit saves them in the repository.</desc>
<defs><marker id="g02-areas-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g02-areas-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g02-areas-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g02-areas-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="35" width="170" height="100" rx="10" class="blue"/>
<text x="105.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Working folder</text>
<text x="105.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">your desk</text>
<text x="105.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">files you edit</text>
<rect x="275" y="35" width="170" height="100" rx="10" class="amber"/>
<text x="360.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Staging area</text>
<text x="360.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">the packing box</text>
<text x="360.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">what goes in the next save</text>
<rect x="530" y="35" width="170" height="100" rx="10" class="green"/>
<text x="615.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">Repository (.git)</text>
<text x="615.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">the photo album</text>
<text x="615.0" y="105.0" text-anchor="middle" dominant-baseline="middle" class="small">permanent history</text>
<path d="M190,70 L273,70" class="arrow blue" marker-end="url(#g02-areas-h-blue)"/>
<text x="232" y="55" text-anchor="middle" dominant-baseline="middle" class="small">git add</text>
<path d="M445,70 L528,70" class="arrow green" marker-end="url(#g02-areas-h-green)"/>
<text x="487" y="55" text-anchor="middle" dominant-baseline="middle" class="small">git commit</text>
<path d="M273,108 L192,108" class="arrow red" marker-end="url(#g02-areas-h-red)"/>
<text x="232" y="123" text-anchor="middle" dominant-baseline="middle" class="small">restore</text>
<path d="M528,108 L447,108" class="arrow red" marker-end="url(#g02-areas-h-red)"/>
<text x="487" y="123" text-anchor="middle" dominant-baseline="middle" class="small">unstage</text>
<text x="360" y="175" text-anchor="middle" dominant-baseline="middle" class="bold">edit  →  add  →  commit : the three-step rhythm of Git</text>
<text x="360" y="205" text-anchor="middle" dominant-baseline="middle" class="small">the staging area lets you choose exactly what goes into each save</text>
</svg>
<figcaption>You edit in the working folder, git add moves changes to the staging area, git commit saves them in the repository.</figcaption>
</figure>
