<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="g01-before-after-t g01-before-after-d" xmlns="http://www.w3.org/2000/svg">
<title id="g01-before-after-t">Files with and without Git</title>
<desc id="g01-before-after-d">Without Git you copy files and invent names; with Git there is one file and Git remembers every version.</desc>
<defs><marker id="g01-before-after-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g01-before-after-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g01-before-after-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g01-before-after-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="320" height="160" rx="10" class="red"/>
<text x="180.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="title">WITHOUT GIT</text>
<text x="180.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="code">report.docx</text>
<text x="180.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">report_final.docx</text>
<text x="180.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">report_final_v2.docx</text>
<text x="180.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="code">report_final_v2_REAL.docx</text>
<text x="180.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">which one is the latest?</text>
<rect x="380" y="20" width="320" height="160" rx="10" class="green"/>
<text x="540.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="title">WITH GIT</text>
<text x="540.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">report.docx</text>
<text x="540.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="small">one file in your folder</text>
<text x="540.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="small">git log  →  every version, who, when, why</text>
<text x="540.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">git restore  →  go back any time</text>
<text x="360" y="210" text-anchor="middle" dominant-baseline="middle" class="small">Git is a time machine for your project folder</text>
</svg>
<figcaption>Without Git you copy files and invent names; with Git there is one file and Git remembers every version.</figcaption>
</figure>
