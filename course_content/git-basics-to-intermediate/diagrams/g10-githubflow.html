<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="g10-githubflow-t g10-githubflow-d" xmlns="http://www.w3.org/2000/svg">
<title id="g10-githubflow-t">GitHub Flow</title>
<desc id="g10-githubflow-d">A simple loop: branch from main, commit, open a pull request, review, merge, deploy; main is always ready to ship.</desc>
<defs><marker id="g10-githubflow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g10-githubflow-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g10-githubflow-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g10-githubflow-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<text x="360" y="20" text-anchor="middle" dominant-baseline="middle" class="title">main is always ready to ship</text>
<rect x="10" y="45" width="100" height="70" rx="10" class="blue"/>
<text x="60.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 Branch</text>
<text x="60.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">off main</text>
<path d="M110,80 L128,80" class="arrow blue" marker-end="url(#g10-githubflow-h-blue)"/>
<rect x="130" y="45" width="100" height="70" rx="10" class="blue"/>
<text x="180.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 Commit</text>
<text x="180.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">small steps</text>
<path d="M230,80 L248,80" class="arrow blue" marker-end="url(#g10-githubflow-h-blue)"/>
<rect x="250" y="45" width="100" height="70" rx="10" class="amber"/>
<text x="300.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 Open PR</text>
<text x="300.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">pull request</text>
<path d="M350,80 L368,80" class="arrow blue" marker-end="url(#g10-githubflow-h-blue)"/>
<rect x="370" y="45" width="100" height="70" rx="10" class="amber"/>
<text x="420.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 Review</text>
<text x="420.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">discuss + test</text>
<path d="M470,80 L488,80" class="arrow blue" marker-end="url(#g10-githubflow-h-blue)"/>
<rect x="490" y="45" width="100" height="70" rx="10" class="green"/>
<text x="540.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">5 Merge</text>
<text x="540.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">into main</text>
<path d="M590,80 L608,80" class="arrow blue" marker-end="url(#g10-githubflow-h-blue)"/>
<rect x="610" y="45" width="100" height="70" rx="10" class="green"/>
<text x="660.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">6 Deploy</text>
<text x="660.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">to users</text>
<path d="M610,115 L610,160 L60,160 L60,117" class="arrow blue dashed" marker-end="url(#g10-githubflow-h-blue)"/>
<text x="335" y="180" text-anchor="middle" dominant-baseline="middle" class="small">repeat for the next change</text>
</svg>
<figcaption>A simple loop: branch from main, commit, open a pull request, review, merge, deploy; main is always ready to ship.</figcaption>
</figure>
