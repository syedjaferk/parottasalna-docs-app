<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="g09-stash-t g09-stash-d" xmlns="http://www.w3.org/2000/svg">
<title id="g09-stash-t">Stash: a shelf for half-done work</title>
<desc id="g09-stash-d">git stash puts your uncommitted changes on a shelf and cleans the folder; git stash pop brings them back.</desc>
<defs><marker id="g09-stash-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g09-stash-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g09-stash-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g09-stash-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="15" y="40" width="170" height="80" rx="10" class="amber"/>
<text x="100.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">Half-done work</text>
<text x="100.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">uncommitted changes</text>
<rect x="275" y="40" width="170" height="80" rx="10" class="blue"/>
<text x="360.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">The stash shelf</text>
<text x="360.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">folder is clean now</text>
<rect x="535" y="40" width="170" height="80" rx="10" class="green"/>
<text x="620.0" y="70.0" text-anchor="middle" dominant-baseline="middle" class="bold">Work is back</text>
<text x="620.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="small">carry on</text>
<path d="M185,80 L273,80" class="arrow blue" marker-end="url(#g09-stash-h-blue)"/>
<text x="229" y="64" text-anchor="middle" dominant-baseline="middle" class="small">git stash</text>
<path d="M445,80 L533,80" class="arrow green" marker-end="url(#g09-stash-h-green)"/>
<text x="489" y="64" text-anchor="middle" dominant-baseline="middle" class="small">git stash pop</text>
<text x="360" y="160" text-anchor="middle" dominant-baseline="middle" class="small">in between: switch branch · fix the urgent bug · switch back</text>
</svg>
<figcaption>git stash puts your uncommitted changes on a shelf and cleans the folder; git stash pop brings them back.</figcaption>
</figure>
