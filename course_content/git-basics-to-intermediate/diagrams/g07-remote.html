<figure class="diagram">
<svg class="dg" viewBox="0 0 720 290" role="img" aria-labelledby="g07-remote-t g07-remote-d" xmlns="http://www.w3.org/2000/svg">
<title id="g07-remote-t">Local and remote repositories</title>
<desc id="g07-remote-d">You work on your computer; push sends commits to GitHub; fetch and pull bring other people&#x27;s commits back; clone copies a repo the first time.</desc>
<defs><marker id="g07-remote-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g07-remote-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g07-remote-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g07-remote-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="78" width="385" height="110" rx="12" class="ghost"/>
<text x="24" y="94" text-anchor="start" dominant-baseline="middle" class="title">YOUR COMPUTER</text>
<rect x="25" y="110" width="130" height="60" rx="10" class="blue"/>
<text x="90.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Working folder</text>
<text x="90.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">your files</text>
<rect x="235" y="110" width="140" height="60" rx="10" class="amber"/>
<text x="305.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">Local repo</text>
<text x="305.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">.git history</text>
<rect x="535" y="110" width="170" height="60" rx="10" class="green"/>
<text x="620.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="bold">GitHub</text>
<text x="620.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="small">remote called origin</text>
<path d="M155,140 L233,140" class="arrow blue" marker-end="url(#g07-remote-h-blue)"/>
<text x="194" y="125" text-anchor="middle" dominant-baseline="middle" class="small">commit</text>
<path d="M375,125 L533,125" class="arrow green" marker-end="url(#g07-remote-h-green)"/>
<text x="454" y="110" text-anchor="middle" dominant-baseline="middle" class="small">git push</text>
<path d="M533,155 L377,155" class="arrow blue" marker-end="url(#g07-remote-h-blue)"/>
<text x="455" y="172" text-anchor="middle" dominant-baseline="middle" class="small">git fetch</text>
<path d="M620,108 L620,40 L90,40 L90,108" class="arrow blue" marker-end="url(#g07-remote-h-blue)"/>
<text x="355" y="26" text-anchor="middle" dominant-baseline="middle" class="small">git pull  =  fetch + merge</text>
<path d="M620,172 L620,240 L305,240 L305,172" class="arrow green dashed" marker-end="url(#g07-remote-h-green)"/>
<text x="462" y="262" text-anchor="middle" dominant-baseline="middle" class="small">git clone  (first time only)</text>
</svg>
<figcaption>You work on your computer; push sends commits to GitHub; fetch and pull bring other people&#x27;s commits back; clone copies a repo the first time.</figcaption>
</figure>
