<figure class="diagram">
<svg class="dg" viewBox="0 0 720 250" role="img" aria-labelledby="g12-rescue-t g12-rescue-d" xmlns="http://www.w3.org/2000/svg">
<title id="g12-rescue-t">The calm-down loop</title>
<desc id="g12-rescue-d">When something looks wrong: check status, log and reflog, make a backup branch, then fix. Committed work can nearly always be recovered.</desc>
<defs><marker id="g12-rescue-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g12-rescue-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g12-rescue-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g12-rescue-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="12" y="30" width="124" height="90" rx="10" class="blue"/>
<text x="74.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 · status</text>
<text x="74.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">where am I?</text>
<rect x="152" y="30" width="124" height="90" rx="10" class="blue"/>
<text x="214.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 · log --graph</text>
<text x="214.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">what does history look like?</text>
<path d="M138,75 L151,75" class="arrow blue" marker-end="url(#g12-rescue-h-blue)"/>
<rect x="292" y="30" width="124" height="90" rx="10" class="blue"/>
<text x="354.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 · reflog</text>
<text x="354.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">where has HEAD been?</text>
<path d="M278,75 L291,75" class="arrow blue" marker-end="url(#g12-rescue-h-blue)"/>
<rect x="432" y="30" width="124" height="90" rx="10" class="amber"/>
<text x="494.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 · backup branch</text>
<text x="494.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">git branch backup-before-fix</text>
<path d="M418,75 L431,75" class="arrow blue" marker-end="url(#g12-rescue-h-blue)"/>
<rect x="572" y="30" width="124" height="90" rx="10" class="green"/>
<text x="634.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">5 · fix</text>
<text x="634.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">reset, revert, rebase...</text>
<path d="M558,75 L571,75" class="arrow blue" marker-end="url(#g12-rescue-h-blue)"/>
<rect x="12" y="150" width="696" height="70" rx="10" class="ghost"/>
<text x="360.0" y="175.0" text-anchor="middle" dominant-baseline="middle">Committed work: almost always recoverable (reflog keeps it ~90 days)</text>
<text x="360.0" y="195.0" text-anchor="middle" dominant-baseline="middle" class="small">Uncommitted edits: gone if you discard them, so commit or stash first</text>
</svg>
<figcaption>When something looks wrong: check status, log and reflog, make a backup branch, then fix. Committed work can nearly always be recovered.</figcaption>
</figure>
