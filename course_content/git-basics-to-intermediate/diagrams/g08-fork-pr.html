<figure class="diagram">
<svg class="dg" viewBox="0 0 720 290" role="img" aria-labelledby="g08-fork-pr-t g08-fork-pr-d" xmlns="http://www.w3.org/2000/svg">
<title id="g08-fork-pr-t">Fork and pull request</title>
<desc id="g08-fork-pr-d">Fork copies the project to your GitHub account, you clone and push to your fork, then open a pull request back to the official repo.</desc>
<defs><marker id="g08-fork-pr-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g08-fork-pr-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g08-fork-pr-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g08-fork-pr-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="250" y="12" width="220" height="52" rx="10" class="blue"/>
<text x="360.0" y="28.0" text-anchor="middle" dominant-baseline="middle" class="bold">Official repo</text>
<text x="360.0" y="48.0" text-anchor="middle" dominant-baseline="middle" class="small">upstream (the owner&#x27;s)</text>
<rect x="470" y="150" width="220" height="52" rx="10" class="green"/>
<text x="580.0" y="166.0" text-anchor="middle" dominant-baseline="middle" class="bold">Your fork</text>
<text x="580.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">origin (on GitHub)</text>
<rect x="30" y="150" width="220" height="52" rx="10" class="amber"/>
<text x="140.0" y="166.0" text-anchor="middle" dominant-baseline="middle" class="bold">Your computer</text>
<text x="140.0" y="186.0" text-anchor="middle" dominant-baseline="middle" class="small">local clone</text>
<path d="M400,64 L520,148" class="arrow blue" marker-end="url(#g08-fork-pr-h-blue)"/>
<text x="430" y="110" text-anchor="middle" dominant-baseline="middle" class="small">1 fork</text>
<path d="M468,168 L252,168" class="arrow green" marker-end="url(#g08-fork-pr-h-green)"/>
<text x="360" y="153" text-anchor="middle" dominant-baseline="middle" class="small">2 clone</text>
<path d="M252,188 L468,188" class="arrow green" marker-end="url(#g08-fork-pr-h-green)"/>
<text x="360" y="205" text-anchor="middle" dominant-baseline="middle" class="small">3 push your branch</text>
<path d="M640,148 L472,40" class="arrow red" marker-end="url(#g08-fork-pr-h-red)"/>
<text x="618" y="88" text-anchor="middle" dominant-baseline="middle" class="small">4 open a pull request</text>
<path d="M290,64 L150,148" class="arrow blue dashed" marker-end="url(#g08-fork-pr-h-blue)"/>
<text x="148" y="100" text-anchor="middle" dominant-baseline="middle" class="small">5 pull upstream</text>
<text x="360" y="250" text-anchor="middle" dominant-baseline="middle" class="small">dashed: keep your copy up to date with the owner&#x27;s changes</text>
</svg>
<figcaption>Fork copies the project to your GitHub account, you clone and push to your fork, then open a pull request back to the official repo.</figcaption>
</figure>
