<figure class="diagram">
<svg class="dg" viewBox="0 0 720 170" role="img" aria-labelledby="g08-pr-flow-t g08-pr-flow-d" xmlns="http://www.w3.org/2000/svg">
<title id="g08-pr-flow-t">Life of a pull request</title>
<desc id="g08-pr-flow-d">Branch, commit, push, open the pull request, get a review, then merge.</desc>
<defs><marker id="g08-pr-flow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="g08-pr-flow-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="g08-pr-flow-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="g08-pr-flow-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="10" y="40" width="100" height="70" rx="10" class="blue"/>
<text x="60.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">1 Branch</text>
<text x="60.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">git switch -c</text>
<path d="M110,75 L128,75" class="arrow blue" marker-end="url(#g08-pr-flow-h-blue)"/>
<rect x="130" y="40" width="100" height="70" rx="10" class="blue"/>
<text x="180.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">2 Commit</text>
<text x="180.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">git commit</text>
<path d="M230,75 L248,75" class="arrow blue" marker-end="url(#g08-pr-flow-h-blue)"/>
<rect x="250" y="40" width="100" height="70" rx="10" class="amber"/>
<text x="300.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">3 Push</text>
<text x="300.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">git push -u</text>
<path d="M350,75 L368,75" class="arrow blue" marker-end="url(#g08-pr-flow-h-blue)"/>
<rect x="370" y="40" width="100" height="70" rx="10" class="amber"/>
<text x="420.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">4 Open PR</text>
<text x="420.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">on GitHub</text>
<path d="M470,75 L488,75" class="arrow blue" marker-end="url(#g08-pr-flow-h-blue)"/>
<rect x="490" y="40" width="100" height="70" rx="10" class="green"/>
<text x="540.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">5 Review</text>
<text x="540.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">discuss, fix</text>
<path d="M590,75 L608,75" class="arrow blue" marker-end="url(#g08-pr-flow-h-blue)"/>
<rect x="610" y="40" width="100" height="70" rx="10" class="green"/>
<text x="660.0" y="65.0" text-anchor="middle" dominant-baseline="middle" class="bold">6 Merge</text>
<text x="660.0" y="85.0" text-anchor="middle" dominant-baseline="middle" class="small">delete branch</text>
<path d="M580,110 L580,140 L130,140 L130,112" class="arrow red dashed" marker-end="url(#g08-pr-flow-h-red)"/>
<text x="355" y="156" text-anchor="middle" dominant-baseline="middle" class="small">changes requested: commit and push again</text>
