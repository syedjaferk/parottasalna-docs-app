<figure class="diagram">
<svg class="dg" viewBox="0 0 760 300" role="img" aria-labelledby="table-test-t table-test-d" xmlns="http://www.w3.org/2000/svg">
<title id="table-test-t">A table-driven test</title>
<desc id="table-test-d">List the cases once, loop over them, and run each as a named subtest so a failure tells you exactly which case broke.</desc>
<defs><marker id="table-test-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="table-test-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="table-test-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="table-test-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="330" height="160" rx="10" class="blue"/>
<text x="185.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="code">tests := []struct{name; input; want}{</text>
<text x="185.0" y="80.0" text-anchor="middle" dominant-baseline="middle" class="code">  {&quot;simple&quot;,  &quot;level&quot;,  true},</text>
<text x="185.0" y="100.0" text-anchor="middle" dominant-baseline="middle" class="code">  {&quot;spaces&quot;,  &quot;Never Odd Or Even&quot;, true},</text>
<text x="185.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="code">  {&quot;not one&quot;,  &quot;golang&quot;, false},</text>
<text x="185.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="code">}</text>
<path d="M352,100 L418,100" class="arrow" marker-end="url(#table-test-h)"/>
<text x="385.0" y="88.0" text-anchor="middle" dominant-baseline="middle" class="small">for each</text>
<rect x="420" y="60" width="150" height="80" rx="10" class="green"/>
<text x="495.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">t.Run(name, …)</text>
<text x="495.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">IsPalindrome(in)</text>
<path d="M572,100 L618,100" class="arrow" marker-end="url(#table-test-h)"/>
<rect x="620" y="60" width="120" height="80" rx="10" class="amber"/>
<text x="680.0" y="90.0" text-anchor="middle" dominant-baseline="middle" class="code">got == want?</text>
<text x="680.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="small">t.Errorf if not</text>
<rect x="20" y="200" width="720" height="80" rx="10" class="ghost"/>
<text x="380.0" y="230.0" text-anchor="middle" dominant-baseline="middle" class="code">go test  ·  go test -v  ·  go test -cover  ·  go test -bench=.  ·  go test -race ./...</text>
<text x="380.0" y="250.0" text-anchor="middle" dominant-baseline="middle" class="small">Test files end in _test.go, functions start with Test, Benchmark and take *testing.T / *testing.B</text>
</svg>
<figcaption>List the cases once, loop over them, and run each as a named subtest so a failure tells you exactly which case broke.</figcaption>
</figure>
