<figure class="diagram">
<svg class="dg" viewBox="0 0 760 300" role="img" aria-labelledby="sql-flow-t sql-flow-d" xmlns="http://www.w3.org/2000/svg">
<title id="sql-flow-t">Go talks to a database through database/sql</title>
<desc id="sql-flow-d">Your code uses one API. A driver, imported with a blank import, translates it for Postgres, SQLite or MySQL.</desc>
<defs><marker id="sql-flow-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="sql-flow-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="sql-flow-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="sql-flow-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="30" y="30" width="140" height="56" rx="10" class="box"/>
<text x="100.0" y="48.0" text-anchor="middle" dominant-baseline="middle">Your code</text>
<text x="100.0" y="68.0" text-anchor="middle" dominant-baseline="middle" class="small">db.Query(…)</text>
<rect x="225" y="30" width="140" height="56" rx="10" class="blue"/>
<text x="295.0" y="48.0" text-anchor="middle" dominant-baseline="middle">database/sql</text>
<text x="295.0" y="68.0" text-anchor="middle" dominant-baseline="middle" class="small">pool + API</text>
<path d="M172,58.0 L223,58.0" class="arrow" marker-end="url(#sql-flow-h)"/>
<rect x="420" y="30" width="140" height="56" rx="10" class="amber"/>
<text x="490.0" y="48.0" text-anchor="middle" dominant-baseline="middle">driver</text>
<text x="490.0" y="68.0" text-anchor="middle" dominant-baseline="middle" class="small">lib/pq · sqlite</text>
<path d="M367,58.0 L418,58.0" class="arrow" marker-end="url(#sql-flow-h)"/>
<rect x="615" y="30" width="140" height="56" rx="10" class="green"/>
<text x="685.0" y="48.0" text-anchor="middle" dominant-baseline="middle">Database</text>
<text x="685.0" y="68.0" text-anchor="middle" dominant-baseline="middle" class="small">tables</text>
<path d="M562,58.0 L613,58.0" class="arrow" marker-end="url(#sql-flow-h)"/>
<rect x="30" y="130" width="340" height="140" rx="10" class="ghost"/>
<text x="200.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="bold">Reading rows</text>
<text x="200.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">rows, err := db.Query(sql, args…)</text>
<text x="200.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="code">defer rows.Close()</text>
<text x="200.0" y="220.0" text-anchor="middle" dominant-baseline="middle" class="code">for rows.Next() { rows.Scan(&amp;a, &amp;b) }</text>
<text x="200.0" y="240.0" text-anchor="middle" dominant-baseline="middle" class="code">QueryRow(…).Scan(&amp;x)  → one row</text>
<rect x="400" y="130" width="330" height="140" rx="10" class="red"/>
<text x="565.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="bold">Placeholders, always</text>
<text x="565.0" y="180.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;... WHERE id = ?&quot;, id</text>
<text x="565.0" y="200.0" text-anchor="middle" dominant-baseline="middle" class="small">(Postgres writes $1, $2)</text>
<text x="565.0" y="220.0" text-anchor="middle" dominant-baseline="middle" class="small">never build SQL with string +</text>
<text x="565.0" y="240.0" text-anchor="middle" dominant-baseline="middle" class="small">→ stops SQL injection</text>
