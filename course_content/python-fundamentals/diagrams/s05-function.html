<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s05-function-t s05-function-d" xmlns="http://www.w3.org/2000/svg">
<title id="s05-function-t">Anatomy of a function</title>
<desc id="s05-function-d">def gives the function a name and parameters. Calling it passes arguments in; return sends a value back to the caller.</desc>
<defs><marker id="s05-function-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s05-function-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s05-function-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s05-function-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="400" height="190" rx="12" class="blue"/>
<text x="220" y="45" text-anchor="middle" dominant-baseline="middle" class="code">def celsius_to_fahrenheit(celsius):</text>
<text x="220" y="75" text-anchor="middle" dominant-baseline="middle" class="small">name                parameter</text>
<rect x="50" y="95" width="340" height="44" rx="10" class="box"/>
<text x="220.0" y="117.0" text-anchor="middle" dominant-baseline="middle" class="code">return (celsius * 9/5) + 32</text>
<text x="220" y="170" text-anchor="middle" dominant-baseline="middle" class="small">the body runs only when the function is called</text>
<rect x="480" y="30" width="220" height="50" rx="10" class="amber"/>
<text x="590.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code">celsius_to_fahrenheit(25)</text>
<text x="590" y="98" text-anchor="middle" dominant-baseline="middle" class="small">argument 25 → celsius</text>
<path d="M480,55 L422,55" class="arrow blue" marker-end="url(#s05-function-h-blue)"/>
<path d="M422,117 L480,150" class="arrow green" marker-end="url(#s05-function-h-green)"/>
<text x="450" y="122" text-anchor="middle" dominant-baseline="middle" class="small">return</text>
<rect x="480" y="130" width="220" height="50" rx="10" class="green"/>
<text x="590.0" y="155.0" text-anchor="middle" dominant-baseline="middle" class="code">77.0</text>
</svg>
<figcaption>def gives the function a name and parameters. Calling it passes arguments in; return sends a value back to the caller.</figcaption>
</figure>
