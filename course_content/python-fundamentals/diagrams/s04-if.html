<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="s04-if-t s04-if-d" xmlns="http://www.w3.org/2000/svg">
<title id="s04-if-t">if / elif / else</title>
<desc id="s04-if-d">Python checks the conditions from top to bottom and runs the first block whose condition is True. else runs only if none matched.</desc>
<defs><marker id="s04-if-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s04-if-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s04-if-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s04-if-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="105" width="150" height="50" rx="10" class="box"/>
<text x="95.0" y="120.0" text-anchor="middle" dominant-baseline="middle">number =</text>
<text x="95.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="code">float(input())</text>
<path d="M170,130 L208,130" class="arrow" marker-end="url(#s04-if-h)"/>
<rect x="210" y="25" width="190" height="50" rx="10" class="amber"/>
<text x="305.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">if number &gt; 0</text>
<path d="M400,50 L468,50" class="arrow green" marker-end="url(#s04-if-h-green)"/>
<text x="434" y="37" text-anchor="middle" dominant-baseline="middle" class="small">True</text>
<rect x="470" y="25" width="230" height="50" rx="10" class="green"/>
<text x="585.0" y="50.0" text-anchor="middle" dominant-baseline="middle" class="code">print(&quot;… positive.&quot;)</text>
<path d="M305,75 L305,103" class="arrow red" marker-end="url(#s04-if-h-red)"/>
<text x="335" y="89" text-anchor="middle" dominant-baseline="middle" class="small">False</text>
<rect x="210" y="105" width="190" height="50" rx="10" class="amber"/>
<text x="305.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="code">elif number &lt; 0</text>
<path d="M400,130 L468,130" class="arrow green" marker-end="url(#s04-if-h-green)"/>
<text x="434" y="117" text-anchor="middle" dominant-baseline="middle" class="small">True</text>
<rect x="470" y="105" width="230" height="50" rx="10" class="green"/>
<text x="585.0" y="130.0" text-anchor="middle" dominant-baseline="middle" class="code">print(&quot;… negative.&quot;)</text>
<path d="M305,155 L305,183" class="arrow red" marker-end="url(#s04-if-h-red)"/>
<text x="335" y="169" text-anchor="middle" dominant-baseline="middle" class="small">False</text>
<rect x="210" y="185" width="190" height="50" rx="10" class="amber"/>
<text x="305.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="code">else</text>
<path d="M400,210 L468,210" class="arrow green" marker-end="url(#s04-if-h-green)"/>
<rect x="470" y="185" width="230" height="50" rx="10" class="green"/>
<text x="585.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="code">print(&quot;… zero.&quot;)</text>
</svg>
<figcaption>Python checks the conditions from top to bottom and runs the first block whose condition is True. else runs only if none matched.</figcaption>
</figure>
