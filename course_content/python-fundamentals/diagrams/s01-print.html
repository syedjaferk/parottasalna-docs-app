<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="s01-print-t s01-print-d" xmlns="http://www.w3.org/2000/svg">
<title id="s01-print-t">What print() does with its arguments</title>
<desc id="s01-print-d">print() turns each argument into text, puts sep between them (a space by default) and end after the last one (a newline by default).</desc>
<defs><marker id="s01-print-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s01-print-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s01-print-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s01-print-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="30" width="130" height="50" rx="10" class="blue"/>
<text x="85.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Hello&quot;</text>
<rect x="162" y="30" width="90" height="50" rx="10" class="amber"/>
<text x="207.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code">sep</text>
<rect x="264" y="30" width="130" height="50" rx="10" class="blue"/>
<text x="329.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;world&quot;</text>
<rect x="406" y="30" width="90" height="50" rx="10" class="amber"/>
<text x="451.0" y="55.0" text-anchor="middle" dominant-baseline="middle" class="code">end</text>
<text x="20" y="110" text-anchor="start" dominant-baseline="middle" class="code">print(&quot;Hello&quot;, &quot;world&quot;)                  →  Hello world⏎</text>
<text x="20" y="140" text-anchor="start" dominant-baseline="middle" class="code">print(&quot;Hello&quot;, &quot;world&quot;, sep=&quot;-&quot;, end=&quot;!&quot;) →  Hello-world!</text>
<text x="20" y="170" text-anchor="start" dominant-baseline="middle" class="small">defaults: sep=&quot; &quot;   end=&quot;\n&quot;</text>
</svg>
<figcaption>print() turns each argument into text, puts sep between them (a space by default) and end after the last one (a newline by default).</figcaption>
</figure>
