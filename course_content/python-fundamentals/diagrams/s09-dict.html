<figure class="diagram">
<svg class="dg" viewBox="0 0 720 230" role="img" aria-labelledby="s09-dict-t s09-dict-d" xmlns="http://www.w3.org/2000/svg">
<title id="s09-dict-t">Annachi Kadai&#x27;s price list</title>
<desc id="s09-dict-d">A dictionary maps keys to values. You look up a value by its key, not by position. Keys are unique; assigning to an existing key replaces its value.</desc>
<defs><marker id="s09-dict-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s09-dict-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s09-dict-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s09-dict-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="330" height="190" rx="12" class="amber"/>
<text x="185" y="42" text-anchor="middle" dominant-baseline="middle" class="code">prices = {</text>
<rect x="40" y="60" width="120" height="36" rx="6" class="blue"/>
<text x="100.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;rice&quot;</text>
<path d="M160,78 L208,78" class="arrow" marker-end="url(#s09-dict-h)"/>
<rect x="210" y="60" width="120" height="36" rx="6" class="green"/>
<text x="270.0" y="78.0" text-anchor="middle" dominant-baseline="middle" class="code">60</text>
<rect x="40" y="106" width="120" height="36" rx="6" class="blue"/>
<text x="100.0" y="124.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;dal&quot;</text>
<path d="M160,124 L208,124" class="arrow" marker-end="url(#s09-dict-h)"/>
<rect x="210" y="106" width="120" height="36" rx="6" class="green"/>
<text x="270.0" y="124.0" text-anchor="middle" dominant-baseline="middle" class="code">120</text>
<rect x="40" y="152" width="120" height="36" rx="6" class="blue"/>
<text x="100.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;oil&quot;</text>
<path d="M160,170 L208,170" class="arrow" marker-end="url(#s09-dict-h)"/>
<rect x="210" y="152" width="120" height="36" rx="6" class="green"/>
<text x="270.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="code">180</text>
<text x="185" y="200" text-anchor="middle" dominant-baseline="middle" class="code">}</text>
<text x="380" y="50" text-anchor="start" dominant-baseline="middle" class="code">prices[&quot;dal&quot;]            → 120</text>
<text x="380" y="85" text-anchor="start" dominant-baseline="middle" class="code">prices[&quot;sugar&quot;] = 45     → add</text>
<text x="380" y="120" text-anchor="start" dominant-baseline="middle" class="code">prices[&quot;dal&quot;] = 125      → update</text>
<text x="380" y="155" text-anchor="start" dominant-baseline="middle" class="code">prices.get(&quot;tea&quot;, 0)    → 0</text>
<text x="380" y="190" text-anchor="start" dominant-baseline="middle" class="code">prices[&quot;tea&quot;]            → KeyError</text>
</svg>
<figcaption>A dictionary maps keys to values. You look up a value by its key, not by position. Keys are unique; assigning to an existing key replaces its value.</figcaption>
</figure>
