<figure class="diagram">
<svg class="dg" viewBox="0 0 720 220" role="img" aria-labelledby="s08-tuple-t s08-tuple-d" xmlns="http://www.w3.org/2000/svg">
<title id="s08-tuple-t">A tuple is a sealed photo</title>
<desc id="s08-tuple-d">A tuple is ordered like a list but immutable: you can read, unpack, join and repeat tuples, but you can&#x27;t change an item in place.</desc>
<defs><marker id="s08-tuple-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s08-tuple-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s08-tuple-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s08-tuple-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="25" width="400" height="80" rx="12" class="blue"/>
<rect x="30" y="45" width="120" height="44" rx="8" class="box"/>
<text x="90.0" y="67.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Ooty&quot;</text>
<rect x="158" y="45" width="120" height="44" rx="8" class="box"/>
<text x="218.0" y="67.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;2024-07-01&quot;</text>
<rect x="286" y="45" width="120" height="44" rx="8" class="box"/>
<text x="346.0" y="67.0" text-anchor="middle" dominant-baseline="middle" class="code">&quot;Botanical&quot;</text>
<text x="220" y="120" text-anchor="middle" dominant-baseline="middle" class="code">ooty = (place, date, note)</text>
<rect x="460" y="25" width="240" height="40" rx="8" class="green"/>
<text x="580.0" y="45.0" text-anchor="middle" dominant-baseline="middle" class="small">ooty[0] → &quot;Ooty&quot;   ✓ read</text>
<rect x="460" y="75" width="240" height="40" rx="8" class="green"/>
<text x="580.0" y="95.0" text-anchor="middle" dominant-baseline="middle" class="small">place, date, note = ooty   ✓</text>
<rect x="460" y="125" width="240" height="40" rx="8" class="green"/>
<text x="580.0" y="145.0" text-anchor="middle" dominant-baseline="middle" class="small">ooty + other, ooty * 2   ✓</text>
<rect x="460" y="175" width="240" height="40" rx="8" class="red"/>
<text x="580.0" y="195.0" text-anchor="middle" dominant-baseline="middle" class="small">ooty[2] = &quot;…&quot;   ✗ TypeError</text>
</svg>
<figcaption>A tuple is ordered like a list but immutable: you can read, unpack, join and repeat tuples, but you can&#x27;t change an item in place.</figcaption>
</figure>
