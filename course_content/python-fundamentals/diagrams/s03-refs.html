<figure class="diagram">
<svg class="dg" viewBox="0 0 720 240" role="img" aria-labelledby="s03-refs-t s03-refs-d" xmlns="http://www.w3.org/2000/svg">
<title id="s03-refs-t">Names point to objects</title>
<desc id="s03-refs-d">a = [1, 2] creates a list object and binds the name a to it. b = a binds a second name to the SAME object, so a change through b is visible through a.</desc>
<defs><marker id="s03-refs-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s03-refs-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s03-refs-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s03-refs-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="20" width="200" height="200" rx="12" class="ghost"/>
<text x="120" y="40" text-anchor="middle" dominant-baseline="middle" class="bold">namespace (names)</text>
<rect x="50" y="70" width="140" height="44" rx="10" class="blue"/>
<text x="120.0" y="92.0" text-anchor="middle" dominant-baseline="middle" class="code">a</text>
<rect x="50" y="140" width="140" height="44" rx="10" class="blue"/>
<text x="120.0" y="162.0" text-anchor="middle" dominant-baseline="middle" class="code">b</text>
<rect x="420" y="20" width="280" height="200" rx="12" class="ghost"/>
<text x="560" y="40" text-anchor="middle" dominant-baseline="middle" class="bold">objects in memory</text>
<rect x="460" y="85" width="200" height="70" rx="10" class="green"/>
<text x="560.0" y="100.0" text-anchor="middle" dominant-baseline="middle">list object</text>
<text x="560.0" y="120.0" text-anchor="middle" dominant-baseline="middle" class="code">[1, 2, 3]</text>
<text x="560.0" y="140.0" text-anchor="middle" dominant-baseline="middle" class="small">id 1407…</text>
<path d="M190,92 L458,110" class="arrow green" marker-end="url(#s03-refs-h-green)"/>
<path d="M190,162 L458,132" class="arrow green" marker-end="url(#s03-refs-h-green)"/>
<text x="320" y="85" text-anchor="middle" dominant-baseline="middle" class="code">a = [1, 2]</text>
<text x="320" y="175" text-anchor="middle" dominant-baseline="middle" class="code">b = a</text>
<text x="560" y="195" text-anchor="middle" dominant-baseline="middle" class="small">b.append(3) → a sees it too</text>
</svg>
<figcaption>a = [1, 2] creates a list object and binds the name a to it. b = a binds a second name to the SAME object, so a change through b is visible through a.</figcaption>
</figure>
