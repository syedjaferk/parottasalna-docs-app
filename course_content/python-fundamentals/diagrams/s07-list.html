<title id="s07-list-t">Alex&#x27;s truck: list methods</title>
<desc id="s07-list-d">A list is an ordered, changeable row of items. append adds at the end, insert at a position, remove deletes by value, pop removes and returns the last item.</desc>

<rect x="20" y="40" width="130" height="50" rx="8" class="blue"/>
<text x="85.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Letter</text>
<text x="85.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="code">[0]</text>
<rect x="160" y="40" width="130" height="50" rx="8" class="blue"/>
<text x="225.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Fragile Box</text>
<text x="225.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="code">[1]</text>
<rect x="300" y="40" width="130" height="50" rx="8" class="blue"/>
<text x="365.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Parcel</text>
<text x="365.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="code">[2]</text>
<rect x="440" y="40" width="130" height="50" rx="8" class="green"/>
<text x="505.0" y="55.0" text-anchor="middle" dominant-baseline="middle">Special Delivery</text>
<text x="505.0" y="75.0" text-anchor="middle" dominant-baseline="middle" class="code">[3]</text>
<text x="580" y="25" text-anchor="middle" dominant-baseline="middle" class="small">append() ⟶ new item at the end</text>
<rect x="20" y="120" width="162" height="80" rx="8" class="amber"/>

<rect x="192" y="120" width="162" height="80" rx="8" class="amber"/>
<text x="273.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="code">remove(&quot;Box&quot;)</text>
<text x="273.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">delete first &quot;Box&quot;</text>
<rect x="364" y="120" width="162" height="80" rx="8" class="amber"/>
<text x="445.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="code">pop()</text>
<text x="445.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">remove + return last</text>
<rect x="536" y="120" width="162" height="80" rx="8" class="amber"/>
<text x="617.0" y="150.0" text-anchor="middle" dominant-baseline="middle" class="code">sort() / reverse()</text>
<text x="617.0" y="170.0" text-anchor="middle" dominant-baseline="middle" class="small">reorder in place</text>
