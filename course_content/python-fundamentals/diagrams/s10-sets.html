<figure class="diagram">
<svg class="dg" viewBox="0 0 720 260" role="img" aria-labelledby="s10-sets-t s10-sets-d" xmlns="http://www.w3.org/2000/svg">
<title id="s10-sets-t">Rose garden and botanical garden</title>
<desc id="s10-sets-d">Set operations compare two collections of unique items: union (|) is everything, intersection (&amp;) is what&#x27;s in both, difference (-) is what&#x27;s only in the first.</desc>
<defs><marker id="s10-sets-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s10-sets-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s10-sets-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s10-sets-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<circle cx="240" cy="145" r="100" class="circle-a"/>
<circle cx="370" cy="145" r="100" class="circle-b"/>
<text x="200" y="25" text-anchor="middle" dominant-baseline="middle" class="bold">rose_garden</text>
<text x="420" y="25" text-anchor="middle" dominant-baseline="middle" class="bold">botanical_garden</text>
<text x="190" y="125" text-anchor="middle" dominant-baseline="middle" class="small">white rose</text>
<text x="190" y="160" text-anchor="middle" dominant-baseline="middle" class="small">pink rose</text>
<text x="305" y="145" text-anchor="middle" dominant-baseline="middle" class="small">red rose</text>
<text x="420" y="125" text-anchor="middle" dominant-baseline="middle" class="small">sunflower</text>
<text x="420" y="160" text-anchor="middle" dominant-baseline="middle" class="small">tulip</text>
<rect x="500" y="40" width="200" height="40" rx="8" class="box"/>
<text x="600.0" y="60.0" text-anchor="middle" dominant-baseline="middle" class="code">a | b   union</text>
<rect x="500" y="90" width="200" height="40" rx="8" class="box"/>
<text x="600.0" y="110.0" text-anchor="middle" dominant-baseline="middle" class="code">a &amp; b   intersection</text>
<rect x="500" y="140" width="200" height="40" rx="8" class="box"/>
<text x="600.0" y="160.0" text-anchor="middle" dominant-baseline="middle" class="code">a - b   difference</text>
<rect x="500" y="190" width="200" height="40" rx="8" class="box"/>
<text x="600.0" y="210.0" text-anchor="middle" dominant-baseline="middle" class="code">a ^ b   in one only</text>
</svg>
<figcaption>Set operations compare two collections of unique items: union (|) is everything, intersection (&amp;) is what&#x27;s in both, difference (-) is what&#x27;s only in the first.</figcaption>
</figure>
