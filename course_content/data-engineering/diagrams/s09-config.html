<figure class="diagram">
<svg class="dg" viewBox="0 0 720 200" role="img" aria-labelledby="s09-config-t s09-config-d" xmlns="http://www.w3.org/2000/svg">
<title id="s09-config-t">Layered settings</title>
<desc id="s09-config-d">Defaults in code are overridden by the config file, which is overridden by environment variables. Secrets come only from the environment and never from files in Git.</desc>
<defs><marker id="s09-config-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head"/></marker><marker id="s09-config-h-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head blue"/></marker><marker id="s09-config-h-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head green"/></marker><marker id="s09-config-h-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head red"/></marker></defs>
<rect x="20" y="50" width="215" height="70" rx="10" class="ghost"/>
<text x="127.5" y="75.0" text-anchor="middle" dominant-baseline="middle">defaults in code</text>
<text x="127.5" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">batch_size = 100</text>
<rect x="255" y="50" width="215" height="70" rx="10" class="blue"/>
<text x="362.5" y="75.0" text-anchor="middle" dominant-baseline="middle">config file (in Git)</text>
<text x="362.5" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">pipeline.toml</text>
<path d="M235,85 L253,85" class="arrow" marker-end="url(#s09-config-h)"/>
<rect x="490" y="50" width="215" height="70" rx="10" class="green"/>
<text x="597.5" y="75.0" text-anchor="middle" dominant-baseline="middle">environment variables</text>
<text x="597.5" y="95.0" text-anchor="middle" dominant-baseline="middle" class="code">SHOP_BATCH_SIZE=1000</text>
<path d="M470,85 L488,85" class="arrow" marker-end="url(#s09-config-h)"/>
<text x="360" y="150" text-anchor="middle" dominant-baseline="middle" class="small">weakest  ──────────────▶  strongest</text>
<rect x="240" y="162" width="240" height="30" rx="8" class="red"/>
<text x="360.0" y="177.0" text-anchor="middle" dominant-baseline="middle" class="small">secrets: environment only</text>
</svg>
<figcaption>Defaults in code are overridden by the config file, which is overridden by environment variables. Secrets come only from the environment and never from files in Git.</figcaption>
</figure>
