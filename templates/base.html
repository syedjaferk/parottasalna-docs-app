<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Course Portal{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --muted:#667085; --accent:#2f5bea; --line:#e4e7ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14161a; --fg:#e8eaee; --card:#1d2026; --muted:#98a2b3; --accent:#7c9cff; --line:#2c313a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
    header { display:flex; justify-content:space-between; align-items:center; padding:.9rem 1.5rem; background:var(--card); border-bottom:1px solid var(--line); }
    header a.brand { font-weight:700; color:var(--fg); text-decoration:none; }
    header .who { color:var(--muted); font-size:.9rem; display:flex; gap:.75rem; align-items:center; }
    main { max-width:960px; margin:2rem auto; padding:0 1.25rem; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:1.25rem; }
    .narrow { max-width:420px; margin:4rem auto; text-align:center; }
    .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.6rem 1.1rem; font:inherit; cursor:pointer; text-decoration:none; }
    .btn.link { background:none; color:var(--accent); padding:0; }
    .muted { color:var(--muted); }
    .msg { padding:.6rem 1rem; border-radius:8px; background:var(--card); border:1px solid var(--line); margin-bottom:1rem; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{% url 'home' %}">Course Portal</a>
    {% if user.is_authenticated %}
    <div class="who">
      <span>{{ user.email|default:user.username }}</span>
      {% if user.is_staff %}<a href="{% url 'admin:index' %}">Admin</a>{% endif %}
      <form class="inline" method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button class="btn link" type="submit">Sign out</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
